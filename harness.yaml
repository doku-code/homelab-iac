# harness.yaml — project configuration for the agent harness.
# Project-owned: edit freely. Framework updates never rewrite this file.
harness:
  version: 0.1.0
  profile: infrastructure
  detected_profiles:
  - infrastructure
  - python
  platforms:
  - claude
  - codex
  # Installs the copy vendored in tools/agent-harness; separate from requirements-controller.txt.
  harness_install: .venv/bin/python -m pip install -r requirements-agents.txt
project:
  name: homelab-iac
  description: Reproducible self-hosted homelab rebuilt with OpenTofu, Ansible and Compose on Proxmox,
    driven from Forgejo and Windmill.
verification:
  commands:
  - name: whitespace
    run: git diff --check
    detected: false
    verified: true
    description: No whitespace errors in the working tree (also enforced in CI)
  - name: harness-check
    run: .venv/bin/harness check
    detected: false
    verified: true
    description: Frontmatter, links, indexes and sensitive-data rules for docs/, milestones/, tasks/
  - name: quality
    run: .venv/bin/python scripts/check-quality.py
    detected: false
    verified: true
    description: Parses every tracked YAML/Python/shell file and guards the CI activation gate
  - name: terraform-fmt
    run: terraform fmt -check -recursive terraform
    detected: false
    verified: true
  - name: terraform-validate
    run: d="$(mktemp -d)"; for r in terraform/stacks/*/ terraform/examples/cloud-image-vm/; do case "$r" in terraform/stacks/pve-management-control/|terraform/stacks/deploy-runner/|terraform/stacks/ci-runner/|terraform/stacks/ci-disposable/|terraform/stacks/k3s/|terraform/stacks/storage/|terraform/stacks/postgresql/|terraform/stacks/dns/|terraform/stacks/media/)
      continue;; esac; n="$d/$(basename "$r")"; TF_DATA_DIR="$n" terraform -chdir="$r" init -backend=false -input=false -lockfile=readonly
      >/dev/null && TF_DATA_DIR="$n" terraform -chdir="$r" validate >/dev/null || { echo "FAIL $r"; exit
      1; }; done; rm -rf "$d"
    detected: false
    verified: true
    description: Every root with the backend disabled and a throwaway TF_DATA_DIR (never touches local
      state)
  - name: mgmt-check
    run: make mgmt-check
    detected: false
    verified: true
    description: OpenTofu root for mgmt-control-01 (fmt, validate, mocked tofu test) plus auth/Make guard tests; offline
  - name: deploy-runner-check
    run: make deploy-runner-check
    detected: false
    verified: true
    description: OpenTofu roots deploy-runner and ci-disposable (fmt, validate, mocked tofu test), playbook syntax,
      wrapper/role/workflow/Make guard tests; offline
  - name: k3s-cluster-check
    run: make k3s-cluster-check
    detected: false
    verified: true
    description: OpenTofu root k3s (fmt, validate, mocked tofu test), configure-k3s syntax, host-key script,
      role/template/kubeconfig/Make guard tests; offline
  - name: storage-check
    run: make storage-check
    detected: false
    verified: true
    description: OpenTofu root storage (fmt, validate, mocked tofu test), playbook syntax, NFS role/StorageClass/Make guard tests; offline
  - name: postgresql-check
    run: make postgresql-check
    detected: false
    verified: true
    description: OpenTofu root postgresql (fmt, validate, mocked tofu test), playbook syntax, Patroni role/access/Make guard tests; offline
  - name: ci-runner-check
    run: make ci-runner-check
    detected: false
    verified: true
    description: OpenTofu root ci-runner (fmt, validate, mocked tofu test), playbook syntax, runner configuration and Make guard tests; offline
  - name: dns-check
    run: make dns-check
    detected: false
    verified: true
    description: OpenTofu root dns (fmt, validate, mocked tofu test), playbook syntax, AdGuard Home role/configuration/Make guard tests; offline
  - name: truenas-check
    run: make truenas-check
    detected: false
    verified: true
    description: The NAS's apps as files, placeholders for secrets, gated apply; offline
  - name: media-check
    run: make media-check
    detected: false
    verified: true
    description: OpenTofu root media (fmt, validate, mocked tofu test), playbook syntax, Compose project, NAS protection, firewall, routes and Make guard tests; offline
  - name: phase-check
    run: make phase-check
    detected: false
    verified: true
    description: Renders the pinned Phase chart and tests scripts/secrets.py with fake stores (workstation only; needs helm, the chart download and age)
  - name: observability-check
    run: make observability-check
    detected: false
    verified: true
    description: Renders the four pinned observability charts, checks allow-lists against dashboard and alert queries, routes and agent templates (workstation only; needs helm and the chart downloads)
  - name: ingress-check
    run: make ingress-check
    detected: false
    verified: true
    description: Renders the pinned cert-manager chart and checks issuer, wildcard certificate, Traefik store and the routes carried over from the legacy Caddy (workstation only; needs helm and the chart download)
  - name: argocd-check
    run: make argocd-check
    detected: false
    verified: true
    description: Renders the pinned Argo CD chart and checks route, project limits and every Application (workstation only; needs helm and the chart download)
  - name: windmill-k3s-check
    run: make windmill-k3s-check
    detected: false
    verified: true
    description: Renders the pinned Windmill chart and checks route, database roles and the scripts of windmill/ (workstation only; needs helm and the chart download)
  - name: homepage-k3s-check
    run: make homepage-k3s-check
    detected: false
    verified: true
    description: Renders the dashboard's manifests and checks route, sign-in, cards and the widget data API on canned data (workstation only; needs kubectl)
  - name: wiki-check
    run: make wiki-check
    detected: false
    verified: true
    description: Renders the pinned Wiki.js chart and checks route, database, the documentation export and the configuration tool against an in-memory wiki (workstation only; needs helm and the chart download)
  - name: authentik-check
    run: make authentik-check
    detected: false
    verified: true
    description: Renders the pinned Authentik chart and checks route, blueprints and the single sign-on wiring of every application (workstation only; needs helm and the chart download)
  - name: netbox-check
    run: make netbox-check
    detected: false
    verified: true
    description: Renders the pinned NetBox chart and runs the inventory reconciliation against an in-memory NetBox (workstation only; needs helm and the chart download)
  - name: headlamp-check
    run: make headlamp-check
    detected: false
    verified: true
    description: Renders the pinned Headlamp chart and checks access rules (workstation only; needs helm and the chart download)
  - name: ansible-syntax
    run: for p in ansible/playbooks/*.yml; do .venv/bin/ansible-playbook --syntax-check -i ansible/inventories/homelab.yml
      "$p" >/dev/null || exit 1; done
    detected: false
    verified: true
  - name: compose-config
    run: docker-compose -f services/monitoring/compose.yml config --quiet && DB_PASSWORD=synthetic-ci-only
      docker-compose -f services/windmill/compose.yml config --quiet
    detected: false
    verified: true
    description: Static Compose validation with synthetic inputs; starts nothing
  - name: offline-tests
    run: for t in windmill runner-connections tfstate-backups tailscale-routers vm-profiles stage-a stage-a-inputs
      k3s-bootstrap flux-demo homepage; do .venv/bin/python "tests/$t.py" || exit 1; done
    detected: false
    verified: true
    description: Offline test scripts run by CI (mocked providers, synthetic fixtures; flux/homepage need
      kubectl)
paths:
  docs: docs
  milestones: milestones
  tasks: tasks
  history: history
  references: docs/reference/external
  local: .local
  knowledge_map: docs/knowledge-map.md
  catalog: docs/knowledge-map.json
  llms: docs/llms.txt
documents:
  ignore:
  - .local
  - .venv
  - node_modules
  - .git
  - .harness
  - archive
history:
  branches:
  - HEAD
  limit: 50
  skip_history_only_commits: true
# Wiki publication (operator decision 2026-11-17): .forgejo/workflows/harness-wiki-publish.yml is the
# adapted template (main-only gate, homelab-iac runner, vendored harness, job token only); keep the
# adaptations when `harness update` reports it as a conflict.
wiki:
  home_title: homelab-iac documentation
  include:
  - docs/**/*.md
  - milestones/*.md
  - tasks/*.md
  - history/**/*.md
  exclude:
  - docs/knowledge-map.json
  - '**/README.md'
  include_readme: true
  home_from_readme: true
  remote: null
  token_env: HARNESS_WIKI_TOKEN
