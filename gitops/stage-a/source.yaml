apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: homelab-iac
  namespace: flux-system
spec:
  interval: 1m
  timeout: 30s
  url: https://git.doku-lab.net/Homelab/homelab-iac.git
  ref:
    branch: main
  ignore: |
    /*
    !/gitops/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: disposable-demo
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 2m
  path: ./gitops/stage-a/demo
  targetNamespace: flux-demo
  serviceAccountName: demo-reconciler
  sourceRef:
    kind: GitRepository
    name: homelab-iac
  prune: true
  wait: true
