apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homepage
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 30s
  timeout: 3m
  path: ./gitops/stage-a/homepage
  targetNamespace: homepage
  serviceAccountName: homepage-reconciler
  sourceRef:
    kind: GitRepository
    name: homelab-iac
  prune: true
  wait: true
