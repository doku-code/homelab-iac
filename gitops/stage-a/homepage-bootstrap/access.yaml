apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  labels:
    homelab-iac-bootstrap: task125
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage-reconciler
  namespace: flux-system
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homepage-impersonation
  namespace: flux-system
rules:
  - apiGroups: ['']
    resources: [serviceaccounts]
    resourceNames: [homepage-reconciler]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homepage-impersonation
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homepage-impersonation
subjects:
  - kind: ServiceAccount
    name: kustomize-controller
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: homepage-reconciler
  namespace: homepage
rules:
  - apiGroups: ['']
    resources: [configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: homepage-reconciler
  namespace: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: homepage-reconciler
subjects:
  - kind: ServiceAccount
    name: homepage-reconciler
    namespace: flux-system
