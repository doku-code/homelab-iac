name: Validate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    # Activation gate, not isolation: see docs/ci-quality.md before enabling.
    if: forgejo.ref == 'refs/heads/main' && vars.CI_QUALITY_APPROVED == 'true'
    runs-on: homelab-iac

    steps:
      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install verified secret scanner
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSLo "$work/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$work/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$work/gitleaks.tar.gz" -C "$work" gitleaks
          install -m 0755 "$work/gitleaks" /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION"

      - name: Scan checked-out history without publishing findings
        run: |
          set -euo pipefail
          if ! gitleaks git --log-opts=HEAD --redact=100 --no-banner --log-level error . >/dev/null 2>&1; then
            echo 'Secret scan failed. Review locally with redaction; do not upload findings or bypass the gate.' >&2
            exit 1
          fi

      - name: Check committed whitespace
        run: git show --format= --check HEAD

      - name: Install validation tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            python3 \
            unzip

      - name: Install standalone Compose v2 for static validation
        env:
          COMPOSE_VERSION: "2.39.4"
          COMPOSE_SHA256: 7af95166a730b87e172d4fc9aefea8725d3c6c7327d59149267b452114ddb7d4
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSLo "$work/docker-compose" \
            "https://github.com/docker/compose/releases/download/v${COMPOSE_VERSION}/docker-compose-linux-x86_64"
          printf '%s  %s\n' "$COMPOSE_SHA256" "$work/docker-compose" | sha256sum --check --status
          install -m 0755 "$work/docker-compose" /usr/local/bin/docker-compose
          docker-compose version

      - name: Install Terraform
        env:
          TERRAFORM_SHA256: 745d33b4b02b7980c62a38ec1beea24ee084ea8caf3f503c200554bd9a0cbe49
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSLo "$work/terraform.zip" \
            https://releases.hashicorp.com/terraform/1.16.1/terraform_1.16.1_linux_amd64.zip
          printf '%s  %s\n' "$TERRAFORM_SHA256" "$work/terraform.zip" | sha256sum --check --status
          unzip -qo "$work/terraform.zip" -d /usr/local/bin
          terraform version

      - name: Install pinned controller Python
        env:
          CONTROLLER_PYTHON_VERSION: "3.14.0"
          PYTHON_BUILD: "20251014"
          PYTHON_SHA256: 493c477b4a88bb1ea2f6c6f57fa0e88ffbe55d9e7b1405c4699f2d41c04eb154
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSLo "$work/python.tar.gz" \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PYTHON_BUILD}/cpython-${CONTROLLER_PYTHON_VERSION}%2B${PYTHON_BUILD}-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          printf '%s  %s\n' "$PYTHON_SHA256" "$work/python.tar.gz" | sha256sum --check --status
          mkdir -p /opt/controller-python
          tar -xzf "$work/python.tar.gz" -C /opt/controller-python --strip-components=1
          test "$(/opt/controller-python/bin/python3 -c 'import platform; print(platform.python_version())')" = "$CONTROLLER_PYTHON_VERSION"

      - name: Rebuild controller environment
        run: |
          set -euo pipefail
          make setup-controller CONTROLLER_PYTHON=/opt/controller-python/bin/python3
          .venv/bin/python --version
          .venv/bin/python -m pip check
          .venv/bin/ansible --version

      # Production state is operator-local. Do not add plan/apply here.
      - name: Validate Terraform formatting and configuration
        run: |
          set -euo pipefail
          terraform_data_root="$(mktemp -d)"
          trap 'rm -rf "$terraform_data_root"' EXIT
          terraform fmt -check -recursive terraform
          for root in \
            terraform/stacks/pve-lab-workstations \
            terraform/stacks/deb13-monitoring \
            terraform/stacks/pve-compute-forgejo-runner-migration \
            terraform/stacks/pve-compute-forgejo-runner \
            terraform/stacks/pve-core-garage \
            terraform/stacks/pve-core-tfstate \
            terraform/stacks/pve-lab-controller \
            terraform/stacks/pve-lab-k3s \
            terraform/examples/cloud-image-vm; do
            root_data_dir="$terraform_data_root/$(basename "$root")"
            mkdir -p "$root_data_dir"
            TF_DATA_DIR="$root_data_dir" terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            TF_DATA_DIR="$root_data_dir" terraform -chdir="$root" validate
          done

      - name: Validate Ansible playbooks
        run: |
          set -euo pipefail
          for playbook in ansible/playbooks/*.yml; do
            .venv/bin/ansible-playbook \
              --syntax-check \
              -i ansible/inventories/homelab.yml \
              "$playbook"
          done

      - name: Validate monitoring Compose configuration
        run: docker-compose -f services/monitoring/compose.yml config --quiet

      - name: Test runner configuration offline
        run: .venv/bin/python tests/runner-connections.py

      - name: Test logical backup tooling offline
        run: .venv/bin/python tests/tfstate-backups.py

      - name: Test VM profiles with mocked providers
        run: .venv/bin/python tests/vm-profiles.py

      - name: Test Recovery Kit verifier with synthetic fixtures
        run: make recovery-check

      - name: Test Stage A baseline and approval guards offline
        run: .venv/bin/python tests/stage-a.py

      - name: Test K3s bootstrap and lifecycle guards offline
        run: .venv/bin/python tests/k3s-bootstrap.py

      - name: Parse configuration and check script syntax
        run: .venv/bin/python scripts/check-quality.py

      - name: Check workspace whitespace
        run: git diff --check
