[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-harness"
version = "0.1.0"
description = "Reusable, documentation-first AI agent harness for Claude Code and Codex projects."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = { find = { include = ["harness", "harness.*"] } }
include-package-data = true

[tool.setuptools.package-data]
harness = ["assets/**/*", "assets/**/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
