route:
  receiver: discord

  group_by:
    - alertname
    - severity

  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity="critical"
      receiver: discord
      repeat_interval: 1h

    - matchers:
        - severity="warning"
      receiver: discord
      repeat_interval: 4h

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /run/secrets/discord-webhook-url
        send_resolved: true
