global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node
    static_configs:
      - targets:
          - 192.168.0.28:9100 # deb13-monitoring
          - 192.168.0.10:9100 # pve-infra
          - 192.168.0.11:9100 # pve-core
          - 192.168.0.12:9100 # pve-compute
          - 192.168.0.14:9100 # pve-lab

  - job_name: pve
    metrics_path: /pve

    static_configs:
      - targets:
          - 192.168.0.11

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      - source_labels:
          - __param_target
        target_label: instance

      - target_label: __address__
        replacement: pve-exporter:9221
