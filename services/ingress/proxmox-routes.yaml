---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: proxmox-ui
spec:
  ipAllowList:
    sourceRange:
    - 192.168.0.0/24
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-management
  namespace: proxmox-ui
spec:
  serverName: 192.168.0.10
  rootCAs:
  - configMap: doku-lab-cluster-ca
---
apiVersion: v1
kind: Service
metadata:
  name: pve-management
  namespace: proxmox-ui
spec:
  ports:
  - name: api
    port: 8006
    targetPort: 8006
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pve-management
  namespace: proxmox-ui
  labels:
    kubernetes.io/service-name: pve-management
addressType: IPv4
ports:
- name: api
  port: 8006
  protocol: TCP
endpoints:
- addresses:
  - 192.168.0.10
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pve-management
  namespace: proxmox-ui
spec:
  entryPoints:
  - websecure
  tls: {}
  routes:
  - match: Host(`pve-management.doku-lab.net`)
    kind: Rule
    middlewares:
    - name: admin-lan
    services:
    - name: pve-management
      port: 8006
      scheme: https
      serversTransport: pve-management
---
