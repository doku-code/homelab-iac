# Web interfaces of the four doku-lab Proxmox hosts under their current names (operator direction
# 2026-11-18; the legacy Caddy still had three names pointing at addresses that changed owner).
# Administration LAN only. Traefik verifies each host against the cluster CA (public certificate, also in
# keys/pve-management-root-ca.crt) by its address, so nothing is skipped. The old environment
# (192.168.0.14) has no route here.
