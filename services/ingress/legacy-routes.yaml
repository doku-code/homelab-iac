  - 192.168.0.21
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: homepage
  namespace: legacy-edge
spec:
  entryPoints:
  - websecure
  routes:
  - match: (Host(`homepage.doku-lab.net`) || Host(`home.doku-lab.net`)) && (Path(`/health`)
      || Path(`/api/summary`) || Path(`/api/nodes`) || Path(`/api/storage`) || Path(`/api/snapshot`))
    kind: Rule
    services:
    - name: homepage-metrics
      port: 9101
  - match: (Host(`homepage.doku-lab.net`) || Host(`home.doku-lab.net`))
    kind: Rule
    services:
    - name: homepage
      port: 3000
  tls: {}
