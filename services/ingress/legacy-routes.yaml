# Sites of the legacy Caddy (CT204, 192.168.0.24) that are still in use, served by Traefik instead: same
# names, same backends outside k3s, same headers. A name moves here when its DNS answer changes from
# 192.168.0.24 to the cluster; until then these routes are idle. Remove a block when its service has
# been redeployed on the platform (secrets: removed with the Infisical shutdown). Not carried over: the three Proxmox names (they pointed at addresses
# that now belong to other hosts) and dropper (its backend address is now a k3s node).
apiVersion: v1
kind: Namespace
metadata:
  name: legacy-edge
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: legacy-edge
spec:
  headers:
    customResponseHeaders:
      Strict-Transport-Security: max-age=15552000
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: self-signed-backend
  namespace: legacy-edge
spec:
  insecureSkipVerify: true
---
apiVersion: v1
kind: Service
metadata:
  name: cloud
  namespace: legacy-edge
spec:
  ports:
  - name: backend
    port: 30027
    targetPort: 30027
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: cloud
  namespace: legacy-edge
  labels:
    kubernetes.io/service-name: cloud
addressType: IPv4
ports:
- name: backend
  port: 30027
  protocol: TCP
endpoints:
- addresses:
  - 192.168.0.13
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cloud
  namespace: legacy-edge
spec:
  entryPoints:
  - websecure
  routes:
  - match: Host(`cloud.doku-lab.net`)
    kind: Rule
    services:
    - name: cloud
      port: 30027
    middlewares:
    - name: hsts
  tls: {}
---
