# Certificates of the bundled Traefik: every IngressRoute with `tls: {}` serves one of them, chosen by name.
# - *.doku-lab.net: Let's Encrypt wildcard kept current by cert-manager (certificates.yaml); also the default.
# - *.192.168.0.40.sslip.io: self-signed certificate (public part keys/k3s-ingress.crt, trusted by the
#   workstation; Secret from the store path /ingress by `make ingress-tls-deploy`) until every service has
#   moved to a doku-lab.net name.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: doku-lab-wildcard-tls
  certificates:
    - secretName: ingress-default-tls
