# Applied by `make argocd-deploy`: the Traefik route and the project that limits what applications may do.
# Only the administration LAN may reach Argo CD. Needs the real client address: the k3s role sets
# externalTrafficPolicy: Local on Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: argocd
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`argocd.doku-lab.net`)
      middlewares:
        - name: admin-lan
      services:
        - name: argocd-server
          port: 80
  tls: {}
---
# Two projects limit what an application may do. Manifests and values come only from this repository on
# Forgejo, charts only from the registries listed, objects go only to this cluster.
#
# platform: the services people use. Named namespaces; the only cluster-wide kinds are namespaces, the
# cluster roles the charts create for their own service accounts, and the definitions a chart ships (Alloy).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform services of the doku-lab cluster, declared in homelab-iac
  sourceRepos:
    - https://git.doku-lab.net/Homelab/homelab-iac.git
    - ghcr.io/netbox-community/netbox-chart
    - https://kubernetes-sigs.github.io/headlamp/
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://grafana-community.github.io/helm-charts
    - https://windmill-labs.github.io/windmill-helm-charts/
    - https://charts.goauthentik.io
  destinations:
    - {server: https://kubernetes.default.svc, namespace: netbox}
    - {server: https://kubernetes.default.svc, namespace: headlamp}
    - {server: https://kubernetes.default.svc, namespace: monitoring}
    - {server: https://kubernetes.default.svc, namespace: phase}
    - {server: https://kubernetes.default.svc, namespace: authentik}
    - {server: https://kubernetes.default.svc, namespace: windmill}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
---
# infrastructure: what the cluster itself needs (certificates and routes, the storage driver). These charts
# install definitions, cluster roles and admission webhooks and reach into kube-system, so this project allows
# every cluster-wide kind; keep ordinary services out of it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
spec:
  description: Cluster infrastructure of doku-lab (certificates, routes, storage driver), declared in homelab-iac
  sourceRepos:
    - https://git.doku-lab.net/Homelab/homelab-iac.git
    - https://charts.jetstack.io
    - https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
  destinations:
    - {server: https://kubernetes.default.svc, namespace: cert-manager}
    - {server: https://kubernetes.default.svc, namespace: kube-system}
    - {server: https://kubernetes.default.svc, namespace: legacy-edge}
    - {server: https://kubernetes.default.svc, namespace: proxmox-ui}
  clusterResourceWhitelist:
    - {group: "*", kind: "*"}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
