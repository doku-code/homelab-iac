# Argo CD (M009, ADR-011): official chart argo/argo-cd, pinned in the Makefile. One replica of each component.
# Installed from the workstation (`make argocd-deploy`): it is the tool that deploys the others, so it cannot
# deploy itself on a rebuilt cluster.
global:
  domain: argocd.doku-lab.net

configs:
  params:
    # TLS ends at Traefik (wildcard certificate); the route is in services/argocd/access.yaml.
    server.insecure: true
  # Appearance (TASK-039, Charcoal Titanium): Argo CD's supported custom stylesheet. The chart mounts it and sets
  # ui.cssurl itself. Written from services/argocd/theme.css by scripts/theme.py; edit that file, never this copy.
  styles: |
    /* theme:start (scripts/theme.py) */
    /* Charcoal Titanium for Argo CD (TASK-039), through its supported custom stylesheet (configs.styles of the chart,
       written into values.yaml by scripts/theme.py). Argo CD's dark theme is already neutral; this only replaces the
       blue-green sidebar and the coloured buttons and links. Health, sync and graph colours are Argo CD's own. The
       class names below are the long-standing ones of argo-ui; a rule whose class disappears simply stops applying. */
    /* tokens:start (written by scripts/theme.py from services/_shared/theme/tokens.json) */
    :root {
      --ct-canvas: #10100F;
      --ct-sidebar: #151514;
      --ct-surface: #1B1B19;
      --ct-surface-elevated: #242423;
      --ct-surface-hover: #292927;
      --ct-surface-active: #30302E;
      --ct-border: #30302E;
      --ct-border-strong: #41413E;
      --ct-fg: #EDECE9;
      --ct-fg-secondary: #B5B4AF;
      --ct-fg-muted: #999894;
      --ct-fg-disabled: #666561;
      --ct-action: #E6E5E1;
      --ct-action-hover: #F5F4F0;
      --ct-action-fg: #10100F;
      --ct-action-secondary: #242423;
      --ct-focus: #B5B4AF;
      --ct-success: #79A88C;
      --ct-warning: #C9A66B;
      --ct-error: #D47D7D;
      --ct-series-1: #8FA8BF;
      --ct-series-2: #B9A283;
      --ct-series-3: #8FB39F;
      --ct-series-4: #B596AD;
      --ct-series-5: #A9A7A0;
      --ct-series-6: #C98F8F;
      --ct-radius-sm: 4px;
      --ct-radius-md: 6px;
      --ct-radius-lg: 8px;
      --ct-radius-dialog: 12px;
      --ct-space-1: 4px;
      --ct-space-2: 8px;
      --ct-space-3: 12px;
      --ct-space-4: 16px;
      --ct-space-6: 24px;
      --ct-space-8: 32px;
      --ct-font-sans: "Geist", "Geist Sans", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ct-font-mono: "Geist Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --ct-font-size-sm: 12px;
      --ct-font-size-md: 13px;
      --ct-font-size-lg: 14px;
      --ct-font-size-heading: 20px;
      --ct-grid-image: radial-gradient(ellipse 85% 55% at 50% 0%, rgba(237, 236, 233, 0.10), transparent 72%), radial-gradient(circle at 1.5px 1.5px, rgba(237, 236, 233, 0.17) 1.5px, transparent 0);
      --ct-grid-size: 100% 100%, 28px 28px;
      --ct-metal: linear-gradient(180deg, #FAF9F6 0%, #E4E3DF 46%, #C9C8C3 100%);
      --ct-metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 0 rgba(0, 0, 0, 0.16), 0 1px 2px rgba(0, 0, 0, 0.45);
      --ct-panel-sheen: linear-gradient(180deg, rgba(237, 236, 233, 0.055) 0%, rgba(237, 236, 233, 0) 48%);
      --ct-panel-edge: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 1px 2px rgba(0, 0, 0, 0.35);
      --ct-motion-duration: 140ms;
      --ct-motion-easing: cubic-bezier(0.2, 0, 0, 1);
    }
    /* tokens:end */

    /* Argo CD has no theme variables: its dark mode is a set of rules under .theme-dark with a blue-grey for every
       panel and a teal for every accent. This file answers those rules one for one (class names read from the
       bundles of v3.6.1). States keep Argo CD's own colours: the status icons, the bar of an application list, the
       left edge of a tile, the pods of the resource tree are not named here. */

    body,
    .theme-dark {
      font-family: var(--ct-font-sans);
    }

    /* ── Page, sidebar, top bar ─────────────────────────────────────────────────────────────────────────────── */

    .theme-dark .cd-layout,
    .theme-dark .layout {
      background-color: var(--ct-canvas);
      background-image: var(--ct-grid-image);
      background-size: var(--ct-grid-size);
      background-attachment: fixed;
    }

    .sidebar {
      background: var(--ct-sidebar) !important;
      border-right: 1px solid var(--ct-border);
    }

    .sidebar__nav-item:hover,
    .sidebar__nav-item--active {
      background: var(--ct-surface-active) !important;
      border-radius: var(--ct-radius-md);
    }

    .sidebar__nav-item--active i {
      color: var(--ct-fg) !important;
    }

    .theme-dark .top-bar {
      background: var(--ct-sidebar);
      border-color: var(--ct-border);
    }

    .theme-dark .top-bar__title {
      color: var(--ct-fg-muted);
      letter-spacing: 0.06em;
    }

    .theme-dark .top-bar__breadcrumbs,
    .theme-dark .top-bar__breadcrumbs a {
      color: var(--ct-fg);
    }

    .theme-dark .login-logout-button,
    .theme-dark .login-logout-button:focus {
      color: var(--ct-fg-secondary);
      box-shadow: none;
    }

    .theme-dark .login-logout-button:hover {
      color: var(--ct-fg);
    }

    /* ── Panels: tiles, rows, boxes, tabs, side panels, dialogs ─────────────────────────────────────────────── */

    .theme-dark .white-box,
    .theme-dark .argo-table-list__row,
    .theme-dark .application-status-panel,
    .theme-dark .application-deployment-history__item,
    .theme-dark .application-details .graph-options-panel,
    .theme-dark .application-resource-tree__node,
    .theme-dark .application-resource-tree__node--expansion,
    .theme-dark .application-resource-tree__node--podgroup--expansion,
    .theme-dark .editable-panel__sticky-title,
    .theme-dark .tabs__nav,
    .theme-dark .application-node-info__manifest .tabs__content,
    .theme-dark .sliding-panel__wrapper,
    .theme-dark .popup-overlay .popup-container__body,
    .theme-dark .popup-overlay .popup-container__footer {
      background-color: var(--ct-surface);
      color: var(--ct-fg);
    }

    .theme-dark .white-box,
    .theme-dark .argo-table-list__row,
    .theme-dark .application-status-panel,
    .theme-dark .application-resource-tree__node,
    .theme-dark .application-resource-tree__node--expansion,
    .theme-dark .application-resource-tree__node--podgroup--expansion {
      box-shadow: 0 0 0 1px var(--ct-border), var(--ct-panel-edge);
      border-radius: var(--ct-radius-md);
    }

    .theme-dark .white-box,
    .theme-dark .argo-table-list__row {
      background-image: var(--ct-panel-sheen);
    }

    .theme-dark .argo-table-list__row:hover {
      box-shadow: 0 0 0 1px var(--ct-border-strong);
    }

    .theme-dark .editable-panel__sticky-title {
      border-bottom-color: var(--ct-border);
      box-shadow: 0 -30px 0 0 var(--ct-surface);
    }

    .theme-dark .sliding-panel__header,
    .theme-dark .sliding-panel__body,
    .theme-dark .sliding-panel--off-canvas .sliding-panel__header,
    .theme-dark .popup-overlay .popup-container__header__normal,
    .theme-dark .application-resource-tree__node--orphaned {
      background-color: var(--ct-surface-elevated) !important;
    }

    .theme-dark .sliding-panel__header,
    .theme-dark .white-box__details-row .columns,
    .theme-dark .tabs__nav.transparent,
    .theme-dark .application-status-panel__item:not(:first-child),
    .theme-dark .application-details .graph-options-panel .separator {
      border-color: var(--ct-border);
    }

    .theme-dark .application-resource-tree__node-kind-icon--big {
      border-color: var(--ct-surface);
    }

    .theme-dark .application-status-panel__item,
    .theme-dark .application-status-panel__item label,
    .theme-dark .application-status-panel__item-value,
    .theme-dark .application-summary .white-box__details p,
    .theme-dark .application-parameters .white-box__details p,
    .theme-dark .argo-form-row label {
      color: var(--ct-fg-secondary);
    }

    /* ── The accent: Argo CD's teal becomes the off-white of the system ─────────────────────────────────────── */

    .theme-dark a,
    .theme-dark .argo-button--link,
    .theme-dark .application-node-info__application-link,
    .theme-dark .application-status-panel__item-value--highlight,
    .theme-dark .editable-panel__subsection-title,
    .theme-dark .editable-panel__collapsible-button__override,
    .theme-dark .application-details__container span {
      color: var(--ct-fg);
    }

    .theme-dark a:hover,
    .theme-dark .application-node-info__application-link:hover {
      color: var(--ct-action-hover);
    }

    .theme-dark .tabs__nav a,
    .theme-dark .tabs__nav.transparent a {
      color: var(--ct-fg-secondary);
    }

    .theme-dark .tabs__nav a.active,
    .theme-dark .tabs__nav.transparent a.active {
      color: var(--ct-fg);
    }

    .theme-dark .tabs__indicator {
      background: var(--ct-action);
    }

    .theme-dark .nav-bar__item.active {
      border-color: var(--ct-action);
    }

    .theme-dark .application-resource-list__row--selected,
    .theme-dark .application-resource-tree__node.active {
      border-left-color: var(--ct-action);
    }

    .theme-dark .application-resource-list__row--selected::after,
    .theme-dark .application-resource-tree__node.active::after {
      background-color: color-mix(in srgb, var(--ct-fg) 8%, transparent);
    }

    /* ── Buttons. Nearly every button of Argo CD is its "base" one, three to a tile: they are the neutral button
          here, and the off-white is kept for the ones that confirm something. ──────────────────────────────── */

    .theme-dark .argo-button {
      border-radius: var(--ct-radius-md) !important;
      color: var(--ct-fg);
    }

    .theme-dark .argo-button--base,
    .theme-dark .argo-button--base-o,
    .theme-dark .argo-button--rectangle,
    .theme-dark .yaml-editor__buttons .argo-button--base-o {
      background-color: var(--ct-action-secondary) !important;
      border-color: var(--ct-border-strong) !important;
      box-shadow: inset 0 0 0 1px var(--ct-border-strong);
      color: var(--ct-fg) !important;
    }

    .theme-dark .argo-button--base:not(.disabled):not([disabled]):hover,
    .theme-dark .argo-button--base:not(.disabled):not([disabled]):focus,
    .theme-dark .argo-button--base-o:not(.disabled):not([disabled]):hover,
    .theme-dark .argo-button--base-o:not(.disabled):not([disabled]):focus {
      background-color: var(--ct-surface-active) !important;
      border-color: var(--ct-border-strong) !important;
      color: var(--ct-fg) !important;
    }

    .theme-dark .argo-button--special,
    .theme-dark .argo-button--radius,
    .theme-dark .popup-container__footer .argo-button--base,
    .theme-dark .sliding-panel__header .argo-button--base:first-child {
      background: var(--ct-metal) var(--ct-action) !important;
      box-shadow: var(--ct-metal-edge);
      color: var(--ct-action-fg) !important;
    }

    .theme-dark .argo-button--special:not(.disabled):hover,
    .theme-dark .argo-button--special:not(.disabled):focus,
    .theme-dark .popup-container__footer .argo-button--base:not(.disabled):not([disabled]):hover,
    .theme-dark .sliding-panel__header .argo-button--base:first-child:not(.disabled):not([disabled]):hover {
      background: var(--ct-action-hover) !important;
      color: var(--ct-action-fg) !important;
    }

    /* ── Fields, search, filters, checkboxes ────────────────────────────────────────────────────────────────── */

    .theme-dark .search-bar__input {
      background-color: var(--ct-surface);
      border: 1px solid var(--ct-border);
      border-radius: var(--ct-radius-md);
    }

    .theme-dark .search-bar__input:focus-within,
    .theme-dark .search-bar__input--regex {
      border-color: var(--ct-focus) !important;
    }

    .theme-dark .search-bar__input .keyboard-hint {
      border-color: var(--ct-border-strong);
      color: var(--ct-fg-muted);
    }

    .theme-dark .argo-field,
    .theme-dark .argo-textarea,
    .theme-dark .select__value {
      border-bottom-color: var(--ct-border-strong);
      color: var(--ct-fg);
    }

    .theme-dark .argo-field:focus,
    .theme-dark .argo-textarea:focus,
    .theme-dark .tags-input--focused {
      border-color: var(--ct-focus);
    }

    .theme-dark .argo-field-container > .argo-field:focus + label.argo-label-placeholder,
    .theme-dark .argo-field-container > .argo-textarea:focus + label.argo-label-placeholder {
      color: var(--ct-fg-secondary);
    }

    .theme-dark .filter__header {
      color: var(--ct-fg-muted);
    }

    .theme-dark .filter__item--selected,
    .theme-dark .filter__header .argo-button {
      background-color: var(--ct-surface-active) !important;
      color: var(--ct-fg);
    }

    .theme-dark .argo-checkbox input + span {
      border-color: var(--ct-border-strong);
    }

    .theme-dark .argo-checkbox input:checked + span,
    .theme-dark .checkbox--selected {
      background-color: var(--ct-action);
      border-color: var(--ct-action);
      color: var(--ct-action-fg);
    }

    .theme-dark .argo-radio input:checked + span {
      background-color: var(--ct-action);
      border-color: var(--ct-action);
      box-shadow: inset 0 0 0 3px var(--ct-surface);
    }

    .theme-dark .argo-checkbox-slide input:checked + span::before {
      background-color: var(--ct-action);
    }

    .theme-dark .argo-checkbox-slide input:checked + span {
      background-color: var(--ct-border-strong);
    }

    .argo-button:focus-visible,
    .theme-dark a:focus-visible,
    .theme-dark .argo-checkbox input:focus {
      outline: 2px solid var(--ct-focus) !important;
      outline-offset: 2px;
    }
    /* theme:end */
  cm:
    # No shell into pods from the web interface.
    exec.enabled: false
    # services/phase/kustomization.yaml renders a Helm chart and patches it.
    kustomize.buildOptions: --enable-helm
    # Object kinds Argo CD does not track. This is the chart's default list without EndpointSlice: the routes
    # to services outside k3s (services/ingress) are Services with hand-written EndpointSlices, which Argo CD
    # must be able to create and update.
    resource.exclusions: |
      - apiGroups: ['']
        kinds: [Endpoints]
      - apiGroups: [coordination.k8s.io]
        kinds: [Lease]
      - apiGroups: [authentication.k8s.io, authorization.k8s.io]
        kinds: [SelfSubjectReview, TokenReview, LocalSubjectAccessReview, SelfSubjectAccessReview, SelfSubjectRulesReview, SubjectAccessReview]
      - apiGroups: [certificates.k8s.io]
        kinds: [CertificateSigningRequest]
      - apiGroups: [cert-manager.io]
        kinds: [CertificateRequest]
    # Single sign-on through Authentik (ADR-017). The client secret is the key clientSecret of the Secret
    # `argocd-sso`, written by `make argocd-deploy` from the secret store. The local account `admin` stays.
    oidc.config: |
      name: Authentik
      issuer: https://auth.doku-lab.net/application/o/argocd/
      clientID: argocd
      clientSecret: $argocd-sso:clientSecret
      requestedScopes: [openid, profile, email]
  rbac:
    # Rights come from the groups Authentik reports: its group homelab-admins administers Argo CD, anyone
    # else who signs in gets nothing.
    policy.default: ""
    scopes: "[groups]"
    policy.csv: |
      g, homelab-admins, role:admin
  # Chart registries that are not plain Git or HTTPS Helm repositories. No credentials: all are public.
  repositories:
    netbox-chart:
      name: netbox-chart
      type: helm
      url: ghcr.io/netbox-community/netbox-chart
      enableOCI: "true"
    wiki-chart:
      name: wiki-chart
      type: helm
      url: ghcr.io/requarks/charts
      enableOCI: "true"

# Not needed: the bundled identity broker (Argo CD talks to Authentik directly), notifications, generated applications.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0

controller:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 2000m, memory: 1536Mi}
server:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 1000m, memory: 512Mi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 2000m, memory: 1Gi}
redis:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
