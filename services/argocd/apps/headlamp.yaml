# Headlamp under Argo CD (M005, M009): the pinned chart with the values from this repository, plus the
# manifests of services/headlamp/access.yaml. No secret input.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
spec:
  project: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  sources:
    - repoURL: https://kubernetes-sigs.github.io/headlamp/
      chart: headlamp
      targetRevision: 0.46.0
      helm:
        releaseName: headlamp
        valueFiles:
          - $values/services/headlamp/values.yaml
    - repoURL: https://git.doku-lab.net/Homelab/homelab-iac.git
      targetRevision: main
      ref: values
    - repoURL: https://git.doku-lab.net/Homelab/homelab-iac.git
      targetRevision: main
      path: services/headlamp
      directory:
        include: access.yaml
  syncPolicy:
    # A change merged on main is applied; a change made by hand in the cluster is reverted. Nothing is
    # deleted automatically: removing an object from Git leaves it in the cluster until a person prunes it.
    automated:
      prune: false
      selfHeal: true
