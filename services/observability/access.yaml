# Applied by `make observability-deploy`. Namespace, network restrictions and Traefik routes.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# Grafana: administration LAN only. Needs the real client address: the k3s role sets
# externalTrafficPolicy: Local on Traefik (ansible/roles/k3s/templates/traefik-config.yaml.j2).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
---
# Ingestion: only the VMs this repository manages (runner .32, k3s .40-.49, storage .50-.59,
# PostgreSQL .60-.69) may push, and only to the two write paths below.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: managed-vms
  namespace: monitoring
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.32/32
      - 192.168.0.40/29
      - 192.168.0.48/28
      - 192.168.0.64/30
      - 192.168.0.68/31
      # A k3s node reaching its own Traefik arrives from the pod network. Pods can reach both services
      # directly inside the cluster anyway, so this opens nothing new.
      - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.doku-lab.net`)
      middlewares:
        - name: admin-lan
      services:
        - name: grafana
          port: 80
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingest
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`metrics.192.168.0.40.sslip.io`) && Path(`/api/v1/write`)
      middlewares:
        - name: managed-vms
      services:
        - name: prometheus-server
          port: 80
    - kind: Rule
      match: Host(`logs.192.168.0.40.sslip.io`) && Path(`/loki/api/v1/push`)
      middlewares:
        - name: managed-vms
      services:
        - name: loki
          port: 3100
  tls: {}
