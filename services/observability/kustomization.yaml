# What Argo CD applies beside the four charts of services/argocd/apps/monitoring.yaml: the routes, and the
# Alloy configuration and the dashboards as ConfigMaps built from the files next to this one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - access.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy=cluster.alloy
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/homelab-overview.json
