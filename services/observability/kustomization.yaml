# What Argo CD applies beside the four charts of services/argocd/apps/monitoring.yaml: the routes, and the
# Alloy configuration (with what it asks the switch over SNMP) and the dashboards as ConfigMaps built from the files next to this one.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - access.yaml
  - truenas.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: alloy-config
    namespace: monitoring
    files:
      - config.alloy=cluster.alloy
      - snmp.yml
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - dashboards/homelab-overview.json
      - dashboards/switch.json
      - dashboards/truenas.json
      - dashboards/proxmox-hosts.json
      - dashboards/pfsense.json
      - dashboards/postgresql.json
      - dashboards/kubernetes.json
      - dashboards/virtual-machines.json
      - dashboards/service-health.json
  - name: truenas-graphite-mapping
    namespace: monitoring
    files:
      - truenas-mapping.yml
  - name: truenas-exporter
    namespace: monitoring
    files:
      - truenas-exporter.py
