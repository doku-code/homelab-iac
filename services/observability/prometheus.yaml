# Prometheus (lean observability, TASK-020): storage and rules only. Nothing is scraped from here: Alloy
# collects a small allow-list of metrics and pushes them (remote write), in the cluster and on every VM.
alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false # Alloy on each VM carries the node collectors

# Cluster object state (pods not ready, restarts, replicas, PVC phase): a short allow-list, not all 300+ series families.
kube-state-metrics:
  enabled: true
  metricAllowlist:
    - kube_pod_info
    - kube_pod_status_phase
    - kube_pod_status_ready
    - kube_pod_container_status_restarts_total
    - kube_pod_container_status_waiting_reason
    - kube_pod_container_resource_limits
    - kube_deployment_spec_replicas
    - kube_deployment_status_replicas_available
    - kube_statefulset_replicas
    - kube_statefulset_status_replicas_ready
    - kube_daemonset_status_number_unavailable
    - kube_job_status_failed
    - kube_node_status_condition
    - kube_persistentvolumeclaim_status_phase
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {cpu: 200m, memory: 128Mi}

server:
  global:
    scrape_interval: 1m
    evaluation_interval: 1m
  retention: 15d
  retentionSize: 8GB
  extraFlags:
    - web.enable-lifecycle
    - web.enable-remote-write-receiver
  persistentVolume:
    enabled: true
    size: 10Gi
    storageClass: local-path # measurements are rebuildable runtime data, not user data
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {cpu: 1000m, memory: 1Gi}

# The chart's own discovery jobs are off: they would collect every series of every pod and endpoint.
# Only Prometheus's self-scrape stays; Alloy pushes the rest.
scrapeConfigs:
  prometheus:
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "up|prometheus_tsdb_head_series|prometheus_tsdb_storage_blocks_bytes|prometheus_tsdb_compactions_failed_total|prometheus_remote_storage_.*|prometheus_rule_evaluation_failures_total|prometheus_notifications_dropped_total|process_resident_memory_bytes"
        action: keep
  kubernetes-api-servers: {enabled: false}
  kubernetes-nodes: {enabled: false}
  kubernetes-nodes-cadvisor: {enabled: false}
  kubernetes-service-endpoints: {enabled: false}
  kubernetes-service-endpoints-slow: {enabled: false}
  prometheus-pushgateway: {enabled: false}
  kubernetes-services: {enabled: false}
  kubernetes-pods: {enabled: false}
  kubernetes-pods-slow: {enabled: false}

serverFiles:
  alerting_rules.yml:
    groups:
      - name: hosts
        rules:
          - alert: HostSilent
            expr: 'time() - max by (instance) (timestamp(node_load1)) > 300'
            for: 5m
            labels: {severity: critical}
            annotations: {summary: "{{ $labels.instance }} has sent no metrics for 5 minutes"}
          - alert: DiskAlmostFull
            expr: '(1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 0.85'
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is over 85% full"}
          - alert: MemoryPressure
            expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92'
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "{{ $labels.instance }} has under 8% memory available"}
      - name: postgresql
        rules:
          - alert: PostgresNoPrimary
            expr: 'sum(patroni_primary) != 1'
            for: 2m
            labels: {severity: critical}
            annotations: {summary: "The PostgreSQL cluster has {{ $value }} primaries (expected 1)"}
          - alert: PostgresMemberMissing
            expr: 'count(patroni_postgres_running == 1) < 3'
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "Only {{ $value }} of 3 PostgreSQL members are running"}
          - alert: PostgresReplicationLag
            expr: 'pg_replication_lag_seconds > 120 and on (instance) patroni_replica == 1'
            for: 10m
            labels: {severity: warning}
            annotations: {summary: "{{ $labels.instance }} is {{ $value | humanizeDuration }} behind the primary"}
      - name: kubernetes
        rules:
          - alert: PodRestarting
            expr: 'increase(kube_pod_container_status_restarts_total[30m]) > 3'
            for: 5m
            labels: {severity: warning}
            annotations: {summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times in 30 minutes"}
          - alert: PodNotReady
            expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) > 0'
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "{{ $labels.namespace }}/{{ $labels.pod }} is not running"}
          - alert: VolumeAlmostFull
            expr: 'kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85'
            for: 15m
            labels: {severity: warning}
            annotations: {summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 85% full"}
