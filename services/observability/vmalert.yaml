# vmalert (TASK-034): evaluates the alert rules against VictoriaMetrics once a minute, writes their state back
# as the ALERTS series the dashboards show, and hands firing alerts to the Alertmanager below, which posts
# them to the operator's Discord channel. The webhook address is the Secret alertmanager-discord, written by
# `make observability-deploy` from the store (DISCORD_ALERT_WEBHOOK); it is never in Git.
alertmanager:
  enabled: true
  fullnameOverride: alertmanager
  retention: 120h
  resources:
    requests: {cpu: 5m, memory: 24Mi}
    limits: {cpu: 100m, memory: 96Mi}
  extraVolumes:
    - name: discord
      secret:
        secretName: alertmanager-discord
  extraVolumeMounts:
    - name: discord
      mountPath: /etc/alertmanager-discord
      readOnly: true
  config:
    route:
      receiver: discord
      group_by: [alertname, severity]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - matchers: ['severity="critical"']
          receiver: discord
          repeat_interval: 1h
    receivers:
      - name: discord
        discord_configs:
          - webhook_url_file: /etc/alertmanager-discord/url
            send_resolved: true
server:
  fullnameOverride: vmalert
  datasource:
    url: http://victoria-metrics.monitoring.svc:8428
  remoteWrite:
    url: http://victoria-metrics.monitoring.svc:8428
  remoteRead:
    url: http://victoria-metrics.monitoring.svc:8428 # alerts keep their "for" state across a restart
  extraArgs:
    evaluationInterval: 1m
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 200m, memory: 128Mi}
  config:
    alerts:
      groups:
        - name: hosts
          rules:
            - alert: HostSilent
              expr: 'max by (instance) (lag(node_load1[1h])) > 300'
              for: 5m
              labels: {severity: critical}
              annotations: {summary: "{{ $labels.instance }} has sent no metrics for 5 minutes"}
            - alert: DiskAlmostFull
              expr: '(1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 0.85'
              for: 15m
              labels: {severity: warning}
              annotations: {summary: "{{ $labels.instance }} {{ $labels.mountpoint }} is over 85% full"}
            - alert: MemoryPressure
              expr: '(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92'
              for: 15m
              labels: {severity: warning}
              annotations: {summary: "{{ $labels.instance }} has under 8% memory available"}
        - name: postgresql
          rules:
            - alert: PostgresNoPrimary
              expr: 'sum(patroni_primary) != 1'
              for: 2m
              labels: {severity: critical}
              annotations: {summary: "The PostgreSQL cluster has {{ $value }} primaries (expected 1)"}
            - alert: PostgresMemberMissing
              expr: 'count(patroni_postgres_running == 1) < 3'
              for: 10m
              labels: {severity: warning}
              annotations: {summary: "Only {{ $value }} of 3 PostgreSQL members are running"}
            - alert: PostgresReplicationLag
              expr: 'pg_replication_lag_seconds > 120 and on (instance) patroni_replica == 1'
              for: 10m
              labels: {severity: warning}
              annotations: {summary: "{{ $labels.instance }} is {{ $value | humanizeDuration }} behind the primary"}
        - name: network
          rules:
            - alert: SwitchSilent
              expr: 'absent(sysUpTime{job="switch"})'
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "The switch has not answered SNMP for 5 minutes"}
            - alert: SwitchPortErrors
              expr: 'increase(ifInErrors{job="switch"}[15m]) + increase(ifOutErrors{job="switch"}[15m]) > 0'
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "Switch port {{ $labels.ifIndex }} counted {{ $value | humanize }} frame errors in 15 minutes"}
            - alert: SwitchPortDiscards
              expr: 'increase(ifInDiscards{job="switch"}[15m]) + increase(ifOutDiscards{job="switch"}[15m]) > 100'
              for: 10m
              labels: {severity: warning}
              annotations: {summary: "Switch port {{ $labels.ifIndex }} discarded {{ $value | humanize }} frames in 15 minutes"}
            - alert: SwitchRestarted
              expr: 'sysUpTime{job="switch"} < 60000'
              for: 1m
              labels: {severity: warning}
              annotations: {summary: "The switch restarted less than 10 minutes ago"}
        # The Proxmox hosts' own sensors (the agent of ansible/inventories/proxmox-hosts.yml). The SFP28 adapters report a
        # critical limit of 105 °C; a host that froze on 2026-11-27 had shown nothing in its log before it stopped.
        - name: proxmox-hosts
          rules:
            - alert: ProxmoxNetworkAdapterHot
              expr: 'node_hwmon_temp_celsius * on(chip, instance) group_left(chip_name) node_hwmon_chip_names{chip_name="mlx5"} > 90'
              for: 10m
              labels: {severity: warning}
              annotations: {summary: "The SFP28 adapter of {{ $labels.instance }} is at {{ $value }} °C (limit 105 °C)"}
            - alert: ProxmoxNetworkAdapterNearLimit
              expr: 'node_hwmon_temp_celsius * on(chip, instance) group_left(chip_name) node_hwmon_chip_names{chip_name="mlx5"} > 100'
              for: 2m
              labels: {severity: critical}
              annotations: {summary: "The SFP28 adapter of {{ $labels.instance }} is at {{ $value }} °C, close to its limit of 105 °C"}
            - alert: ProxmoxHostSilent
              expr: 'count_over_time(node_load1{instance=~"pve-.+"}[1h] offset 5m) unless count_over_time(node_load1{instance=~"pve-.+"}[5m])'
              for: 2m
              labels: {severity: critical}
              annotations: {summary: "{{ $labels.instance }} has sent no metrics for 5 minutes (frozen, off, or off the network)"}
        # The probes of cluster.alloy: what a person at home notices first.
        - name: probes
          rules:
            - alert: InternetSlow
              expr: 'min(probe_duration_seconds{job=~"integrations/blackbox/internet-.+"}) > 0.5'
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "Reaching the Internet takes {{ $value | humanizeDuration }} for 5 minutes (saturated line or provider trouble)"}
            - alert: InternetUnreachable
              expr: 'max(probe_success{job=~"integrations/blackbox/internet-.+"}) == 0'
              for: 3m
              labels: {severity: critical}
              annotations: {summary: "Neither public server answers for 3 minutes: the Internet is down"}
            - alert: LanDnsDown
              expr: 'probe_success{job="integrations/blackbox/dns-shared-address"} == 0'
              for: 2m
              labels: {severity: critical}
              annotations: {summary: "192.168.0.20 answers no lookup for 2 minutes: the LAN has no DNS"}
            - alert: LanDnsNotRedundant
              expr: 'probe_success{job=~"integrations/blackbox/dns-0."} == 0'
              for: 10m
              labels: {severity: warning}
              annotations: {summary: "{{ $labels.job }} answers no lookup for 10 minutes: the LAN's DNS runs on one server"}
            - alert: ServiceNotAnswering
              expr: 'probe_success{instance="prometheus.exporter.blackbox.web"} == 0'
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "{{ $labels.job }} has not answered for 5 minutes"}
        - name: truenas
          rules:
            - alert: TrueNASSilent
              expr: 'absent(truenas_exporter_up{job="truenas"}) or truenas_exporter_up{job="truenas"} == 0'
              for: 10m
              labels: {severity: critical}
              annotations: {summary: "TrueNAS has not answered its API for 10 minutes"}
            - alert: TrueNASMetricsMissing
              expr: 'absent(truenas_uptime_seconds{job="truenas"})'
              for: 10m
              labels: {severity: warning}
              annotations: {summary: "TrueNAS has pushed no metrics for 10 minutes (Reporting, Exporters)"}
            # pve-pool: its only disk died in November 2026 and the pool waits to be removed.
            - alert: TrueNASPoolUnhealthy
              expr: 'truenas_pool_healthy{job="truenas",pool!="pve-pool"} == 0'
              for: 5m
              labels: {severity: critical}
              annotations: {summary: "Pool {{ $labels.pool }} on TrueNAS is not healthy"}
            - alert: TrueNASPoolAlmostFull
              expr: 'truenas_pool_allocated_bytes{job="truenas"} / truenas_pool_size_bytes{job="truenas"} > 0.85'
              for: 30m
              labels: {severity: warning}
              annotations: {summary: "Pool {{ $labels.pool }} on TrueNAS is over 85% full"}
            - alert: TrueNASDiskHot
              expr: 'truenas_disk_temperature_celsius{job="truenas"} > 50'
              for: 15m
              labels: {severity: warning}
              annotations: {summary: "Disk {{ $labels.disk }} on TrueNAS is at {{ $value | humanize }} degrees"}
            - alert: TrueNASAppDown
              expr: 'truenas_app_running{job="truenas"} == 0'
              for: 10m
              labels: {severity: warning}
              annotations: {summary: "The app {{ $labels.app }} on TrueNAS is not running"}
            # Fires when the count rises, so the alerts already known do not ring forever.
            - alert: TrueNASNewCriticalAlert
              expr: 'sum(truenas_alerts{job="truenas",level=~"CRITICAL|ALERT|EMERGENCY"}) > sum(truenas_alerts{job="truenas",level=~"CRITICAL|ALERT|EMERGENCY"} offset 1h)'
              for: 1m
              labels: {severity: warning}
              annotations: {summary: "TrueNAS shows a new critical alert in its interface"}
        - name: kubernetes
          rules:
            - alert: PodRestarting
              expr: 'increase(kube_pod_container_status_restarts_total[30m]) > 3'
              for: 5m
              labels: {severity: warning}
              annotations: {summary: "{{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times in 30 minutes"}
            - alert: PodNotReady
              expr: 'sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) > 0'
              for: 15m
              labels: {severity: warning}
              annotations: {summary: "{{ $labels.namespace }}/{{ $labels.pod }} is not running"}
            - alert: VolumeAlmostFull
              expr: 'kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85'
              for: 15m
              labels: {severity: warning}
              annotations: {summary: "Volume {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is over 85% full"}
