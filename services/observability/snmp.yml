# What Alloy asks the switch (QNAP QSW-M3216R-8S8T) over SNMP: snmp_exporter configuration, version 0.29 format.
# The switch answers only the system group and the classic interface table: no 64-bit counters, no address
# table, no neighbour table, and it returns an error for anything else. So this module walks the columns it
# needs one by one instead of using the exporter's own if_mib module, and leaves the port descriptions out
# (the switch does not answer when 25 of them are asked at once; ifIndex 1 to 16 is the port number). The sign-in (SNMPv3 user and passwords)
# is not here: `make observability-deploy` writes it from the secret store into the Secret switch-snmp.
modules:
  qsw_if:
    max_repetitions: 25
    retries: 2
    timeout: 4s
    walk:
      - 1.3.6.1.2.1.2.2.1.5
      - 1.3.6.1.2.1.2.2.1.8
      - 1.3.6.1.2.1.2.2.1.10
      - 1.3.6.1.2.1.2.2.1.11
      - 1.3.6.1.2.1.2.2.1.13
      - 1.3.6.1.2.1.2.2.1.14
      - 1.3.6.1.2.1.2.2.1.16
      - 1.3.6.1.2.1.2.2.1.17
      - 1.3.6.1.2.1.2.2.1.19
      - 1.3.6.1.2.1.2.2.1.20
    get:
      - 1.3.6.1.2.1.1.3.0
    metrics:
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3
        type: gauge
        help: "Time since the switch started, in hundredths of a second"
      - name: ifSpeed
        oid: 1.3.6.1.2.1.2.2.1.5
        type: gauge
        help: "Nominal speed of the port in bits per second (wraps on 10 Gbit/s ports: the switch has no 64-bit columns)"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: "State of the port: 1 up, 2 down"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInOctets
        oid: 1.3.6.1.2.1.2.2.1.10
        type: counter
        help: "Bytes received on the port (32-bit counter)"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInUcastPkts
        oid: 1.3.6.1.2.1.2.2.1.11
        type: counter
        help: "Unicast frames received on the port"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInDiscards
        oid: 1.3.6.1.2.1.2.2.1.13
        type: counter
        help: "Received frames the switch discarded although they had no error"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: "Received frames with an error"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutOctets
        oid: 1.3.6.1.2.1.2.2.1.16
        type: counter
        help: "Bytes sent on the port (32-bit counter)"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutUcastPkts
        oid: 1.3.6.1.2.1.2.2.1.17
        type: counter
        help: "Unicast frames sent on the port"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutDiscards
        oid: 1.3.6.1.2.1.2.2.1.19
        type: counter
        help: "Frames the switch discarded instead of sending them"
        indexes:
          - labelname: ifIndex
            type: gauge
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: "Frames that could not be sent because of an error"
        indexes:
          - labelname: ifIndex
            type: gauge
