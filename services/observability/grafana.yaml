# Grafana (lean observability, TASK-020). Users, folders and edited dashboards live in database "grafana" on
# the shared PostgreSQL (ADR-015), so the pod holds no state. Data sources and the overview dashboard are
# provisioned from Git.
replicas: 1
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
envValueFrom:
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db
      key: password
  # Client secret of the single sign-on (Secret written by `make observability-deploy`). Optional: Grafana
  # starts without it and the local administrator still works.
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-sso
      key: clientSecret
      optional: true
persistence:
  enabled: false
testFramework:
  enabled: false
ingress:
  enabled: false # Traefik routes are in services/observability/access.yaml
grafana.ini:
  server:
    root_url: https://grafana.doku-lab.net/
  database:
    type: postgres
    host: 192.168.0.60:5432
    name: grafana
    user: grafana
    ssl_mode: require
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  users:
    allow_sign_up: false
  # Single sign-on through Authentik (ADR-017). Members of its group homelab-admins are Grafana
  # administrators; nobody else gets a role, so nobody else gets in. The login form stays for the local
  # administrator.
  auth:
    signout_redirect_url: https://auth.doku-lab.net/application/o/grafana/end-session/
  auth.generic_oauth:
    enabled: true
    name: Authentik
    client_id: grafana
    scopes: openid profile email
    auth_url: https://auth.doku-lab.net/application/o/authorize/
    token_url: https://auth.doku-lab.net/application/o/token/
    api_url: https://auth.doku-lab.net/application/o/userinfo/
    allow_sign_up: true
    use_pkce: true
    login_attribute_path: preferred_username
    role_attribute_path: contains(groups[*], 'homelab-admins') && 'GrafanaAdmin'
    allow_assign_grafana_admin: true
    role_attribute_strict: true
  news:
    news_feed_enabled: false
datasources:
  datasources.yaml:
    apiVersion: 1
    # The data source was named Prometheus until TASK-034; a new name with the same uid is refused while the old one exists.
    deleteDatasources:
      - {name: Prometheus, orgId: 1}
    datasources:
      # VictoriaMetrics, read through its Prometheus query API; the uid stays so the dashboards need no change.
      - name: VictoriaMetrics
        type: prometheus
        uid: prometheus
        url: http://victoria-metrics.monitoring.svc:8428
        isDefault: true
        jsonData:
          timeInterval: 60s
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.monitoring.svc:3100
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: homelab
        folder: Homelab
        type: file
        disableDeletion: true
        options:
          path: /var/lib/grafana/dashboards/homelab
dashboardsConfigMaps:
  homelab: grafana-dashboards
resources:
  requests: {cpu: 50m, memory: 192Mi}
  limits: {cpu: 1000m, memory: 512Mi}
