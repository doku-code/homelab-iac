# Applied by Argo CD (services/argocd/apps/authentik.yaml): namespace and the Traefik route.
apiVersion: v1
kind: Namespace
metadata:
  name: authentik
---
# The administration LAN signs in here; the pod network is allowed too because every application that uses
# single sign-on calls Authentik from its pod (token exchange, signing keys). Needs the real client address:
# the k3s role sets externalTrafficPolicy: Local on Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: authentik
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
      - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.doku-lab.net`)
      middlewares:
        - name: admin-lan
      services:
        - name: authentik-server
          port: 80
    # Forward authentication (ADR-017): on every name of the domain, the paths under /outpost.goauthentik.io/
    # belong to Authentik's embedded outpost (sign-in start, callback, sign-out of the protected application).
    - kind: Rule
      match: HostRegexp(`^[a-z0-9-]+\.doku-lab\.net$`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 1000
      middlewares:
        - name: admin-lan
      services:
        - name: authentik-server
          port: 80
  tls: {}
