# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The wiki signs people in through Authentik (ADR-017): whoever signs in is an administrator of the wiki
# (scripts/wiki-admin.py), and only members of homelab-admins may open the application.
# The wiki names its callback address after an identifier it generates when the sign-in method is created, so
# the address is matched by pattern: any identifier, this host, this path only.
# The client secret is read from the environment of the worker (Secret authentik-secrets, written from the
# secret store path /authentik); nothing secret is in this file.
version: 1
metadata:
  name: Homelab - Wiki
  labels:
    homelab/application: wiki
entries:
  # Authentik's own defaults this file refers to must exist first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Provider authorization flow (implicit consent)}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Provider invalidation flow}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: System - OAuth2 Provider - Scopes}
      required: true

  - model: authentik_core.group
    id: admins
    identifiers: {name: homelab-admins}

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: {name: wiki}
    attrs:
      client_type: confidential
      client_id: wiki
      client_secret: !Env SSO_WIKI_CLIENT_SECRET
      # Since Authentik 2026.5 a provider allows no grant unless it is listed.
      grant_types: [authorization_code, refresh_token]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - {matching_mode: regex, url: "^https://wiki\\.doku-lab\\.net/_api/auth/[0-9a-f-]{36}/callback$"}
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    id: application
    identifiers: {slug: wiki}
    attrs:
      name: Wiki
      group: Platform
      provider: !KeyOf provider
      meta_launch_url: https://wiki.doku-lab.net/
      policy_engine_mode: any

  # Only members of homelab-admins may open the application.
  - model: authentik_policies.policybinding
    identifiers: {target: !KeyOf application, group: !KeyOf admins}
    attrs: {order: 0}
