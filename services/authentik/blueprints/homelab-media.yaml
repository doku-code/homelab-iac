# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# The administration tools of the media stack (Radarr, Sonarr, Prowlarr, qBittorrent; TASK-036) share one name,
# media.doku-lab.net, and Traefik asks Authentik before every request to it (ADR-017, forward authentication;
# middleware "authentik" of services/media/access.yaml). Jellyfin and Seerr are not behind it: they sign in
# with Jellyfin's own accounts, as television and phone applications need. No secret is shared.
version: 1
metadata:
  name: Homelab - Media
  labels:
    homelab/application: media
entries:
  # Authentik's own defaults this file refers to must exist first.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Provider authorization flow (implicit consent)}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: Default - Provider invalidation flow}
      required: true
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers: {name: System - OAuth2 Provider - Scopes}
      required: true

  - model: authentik_core.group
    id: admins
    identifiers: {name: homelab-admins}

  - model: authentik_providers_proxy.proxyprovider
    id: provider
    identifiers: {name: media}
    attrs:
      # One name, checked by Traefik on every request; Authentik never proxies the traffic itself.
      mode: forward_single
      external_host: https://media.doku-lab.net
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      access_token_validity: hours=24

  - model: authentik_core.application
    id: application
    identifiers: {slug: media}
    attrs:
      name: Media tools
      group: Media
      provider: !KeyOf provider
      meta_launch_url: https://media.doku-lab.net/
      policy_engine_mode: any

  # Open to homelab-admins only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf application
      group: !KeyOf admins
    attrs:
      order: 0
