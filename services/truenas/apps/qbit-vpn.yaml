# qBittorrent behind a VPN (gluetun), a custom app of the NAS. Managed by scripts/truenas-apps.py (make truenas-plan).
# Images are pinned to the digests that ran on 2026-11-27 (builds of 2026-10-19 and 2026-10-20, pulled as
# "latest" until then): an update is a new digest here, then a plan and an apply.
name: qbit-vpn
kind: custom
compose:
  services:
    gluetun:
      cap_add:
      - NET_ADMIN
      container_name: gluetun
      devices:
      - /dev/net/tun:/dev/net/tun
      environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${QBIT_VPN_WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Canada
      - VPN_PORT_FORWARDING=on
      - FIREWALL=on
      - TZ=America/Toronto
      image: qmcgaw/gluetun@sha256:c2ee4191762fca6b6a3c3359a731198a95d9c9af4db32d466e223bf3a84e779b
      ports:
      - 8080:8080
      - 6881:6881/tcp
      - 6881:6881/udp
      restart: unless-stopped
      volumes:
      - /mnt/apps-pool/apps/qbit-vpn/gluetun:/gluetun
    qbittorrent:
      container_name: qbittorrent
      depends_on:
      - gluetun
      environment:
      - PUID=568
      - PGID=568
      - TZ=America/Toronto
      - WEBUI_PORT=8080
      - DOCKER_MODS=ghcr.io/vuetorrent/vuetorrent-lsio-mod:latest
      image: lscr.io/linuxserver/qbittorrent@sha256:e887804fa9de4c60f5f0fb1f3a7e4febe40a8f69fe736f70c4e8589b1f868dab
      network_mode: service:gluetun
      restart: unless-stopped
      volumes:
      - /mnt/apps-pool/apps/qbit-vpn/qbittorrent:/config
      - /mnt/fastpool/downloads:/downloads
