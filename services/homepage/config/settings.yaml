title: Doku Lab
description: Dashboard of the doku-lab platform
language: en
theme: dark
color: neutral
target: _blank
statusStyle: dot
hideVersion: true
useEqualHeights: false
headerStyle: clean
disableCollapse: true
# A plain charcoal page by default (custom.css). The footer's button (custom.js) offers the images of /images, kept
# outside Git on the homepage-images volume; the choice is the visitor's and stays in their browser.
layout:
  Platform: {style: row, columns: 2, header: true}
  Infrastructure: {style: row, columns: 2, header: true}
  Apps: {style: row, columns: 2, header: true}
  Remote desktop: {style: row, columns: 3, header: true}
  Links: {style: row, columns: 5, header: true}
