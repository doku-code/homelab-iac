# Operator decision 2026-11-18: account passwords need 10 characters instead of Phase's built-in 16.
#
# Phase has no setting for this: the rule lives only in the compiled frontend (the backend receives a
# hash derived in the browser and cannot see the length). services/phase/kustomization.yaml applies this
# patch to the frontend Deployment of the chart: the container rewrites the rule in its own files and
# then starts as usual. It stops instead of starting when the expected code is not found, so a Console
# upgrade that changes it fails the rollout (the previous pod keeps serving) instead of silently
# restoring 16. Written for Console v2.79.0; review it with every version change.
#
# The password still protects the account's keys: prefer a long passphrase whatever the minimum is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase-console-frontend
spec:
  template:
    spec:
      containers:
      - name: frontend
        command: ["/bin/bash", "-euc"]
        args:
        - |
          min=10
          root=/app/.next
          rule='minLength:16|at least 16 characters'
          if ! grep -rqE "$rule" "$root"; then
            echo "password rule not found in $root: review services/phase/frontend-password-policy.yaml for this Phase version" >&2
            exit 1
          fi
          grep -rlE "$rule" "$root" | xargs sed -E -i \
            -e "s/minLength:16/minLength:$min/g" \
            -e "s/\.length<16(\)return void [A-Za-z0-9_$]+\.toast\.error\(\"Password must be at least )16 characters/.length<$min\1$min characters/g" \
            -e "s/\.length>=16(,[A-Za-z0-9_$]+=[A-Za-z0-9_$]+\?\.feedback\?\.suggestions\?\?\[\],[A-Za-z0-9_$]+=[A-Za-z0-9_$]+\?[A-Za-z0-9_$]+:\[.Use at least )16 characters/.length>=$min\1$min characters/g"
          if grep -rqE "$rule" "$root"; then
            echo "password rule only partly rewritten: review services/phase/frontend-password-policy.yaml for this Phase version" >&2
            exit 1
          fi
          grep -rqF "Password must be at least $min characters" "$root"
          exec /app/scripts/start.sh
