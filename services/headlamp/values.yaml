# Headlamp (ADR-011, M005): official chart kubernetes-sigs/headlamp, version pinned in the Makefile.
# Headlamp itself gets NO cluster rights: every user sees what the Kubernetes API allows their identity.
# Two ways in: "Sign in" through Authentik (ADR-017; the API servers accept Authentik's identity tokens,
# ansible/roles/k3s), or a Kubernetes token pasted into the login page (the admin token of the ServiceAccount
# in access.yaml, kept in the secret store: it works without Authentik).
replicaCount: 1
clusterRoleBinding:
  create: false
config:
  enableHelm: false
  oidc:
    # Client, secret, issuer and scopes come from the Secret `headlamp-oidc`, written by `make headlamp-deploy`
    # from the environment (store path /authentik), never from Git.
    secret:
      create: false
    externalSecret:
      enabled: true
      name: headlamp-oidc
      hasScopes: true
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    # HTTPS only, and only from the administration LAN.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: headlamp-admin-lan@kubernetescrd
  hosts:
    # DNS answer in ansible/vars/dns.yml; certificate: the *.doku-lab.net wildcard (services/ingress).
    - host: headlamp.doku-lab.net
      paths:
        - path: /
          type: ImplementationSpecific
