# NFS CSI driver (kubernetes-csi/csi-driver-nfs, official chart, version pinned in the Makefile), M006.
# k3s keeps its kubelet under the standard path, so chart defaults apply. Small footprint on purpose.
controller:
  replicas: 1
  runOnControlPlane: true
# The driver's controller always carries the snapshot sidecar; without the snapshot CRDs it logs an error every
# few seconds. The snapshot controller brings the CRDs (and volume snapshots, for the backups to come).
externalSnapshotter:
  enabled: true
  resources:
    requests: {cpu: 10m, memory: 20Mi}
    limits: {memory: 128Mi}
