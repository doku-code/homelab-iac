# User data of k3s applications (repositories, uploads, databases' dumps): outside the cluster, on
# storage-01 (pve-compute, 2 TB NVMe). NOT the default class: app/runtime data may stay on the node (local-path);
# a workload asks for this class explicitly. Retain: deleting a PVC never deletes user data.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nvme-shared
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.0.50
  share: /srv/k3s
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  onDelete: retain
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.2
  - hard
  - noatime
