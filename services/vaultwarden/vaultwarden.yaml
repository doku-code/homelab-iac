# Vaultwarden, the password manager (TASK-032), moved here from the container on the old host on 2026-11-24.
# One replica. The vault lives in database "vaultwarden" on the shared PostgreSQL (ADR-015); the volume only
# holds the server's signing key, attachments and the icon cache. The Secret `vaultwarden-secrets` is not in
# Git: `make vaultwarden-deploy` writes it from the secret store.
# The administration page is off (no ADMIN_TOKEN) and nobody can register: the account is the operator's.
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: nvme-shared
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate # one writer on the volume and one owner of the signing key
  selector:
    matchLabels:
      app.kubernetes.io/name: vaultwarden
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vaultwarden
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: vaultwarden
        image: docker.io/vaultwarden/server:1.37.2
        env:
        - {name: DOMAIN, value: "https://vault.doku-lab.net"}
        - {name: ROCKET_PORT, value: "8080"}
        - {name: SIGNUPS_ALLOWED, value: "false"}
        - {name: INVITATIONS_ALLOWED, value: "false"}
        - {name: SHOW_PASSWORD_HINT, value: "false"}
        - {name: IP_HEADER, value: "X-Forwarded-For"}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: database-url
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet: {path: /alive, port: http}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /alive, port: http}
          initialDelaySeconds: 20
          periodSeconds: 30
        resources:
          requests: {cpu: 10m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - {name: data, mountPath: /data}
        - {name: tmp, mountPath: /tmp}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-data
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  selector:
    app.kubernetes.io/name: vaultwarden
  ports:
  - name: http
    port: 8080
    targetPort: http
---
# The LAN (which is also where the Tailscale routers hand remote devices over) and the pods of the cluster.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: vaultwarden
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
      - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hsts
  namespace: vaultwarden
spec:
  headers:
    stsSeconds: 15552000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`vault.doku-lab.net`)
      middlewares:
        - name: admin-lan
        - name: hsts
      services:
        - name: vaultwarden
          port: 8080
  tls: {}
