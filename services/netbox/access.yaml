# Applied by `make netbox-deploy`: namespace, the key-value store NetBox needs, and the Traefik route.
apiVersion: v1
kind: Namespace
metadata:
  name: netbox
---
# Job queue and cache only: nothing here needs to survive a restart, so no volume and no persistence.
# The password comes from the Secret created by `make netbox-deploy`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-valkey
  namespace: netbox
  labels: {app.kubernetes.io/name: netbox-valkey}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: netbox-valkey}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netbox-valkey}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3-alpine
          args: ["valkey-server", "--requirepass", "$(VALKEY_PASSWORD)", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: netbox-secrets, key: valkey_password}
          ports:
            - {name: valkey, containerPort: 6379}
          readinessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-valkey
  namespace: netbox
  labels: {app.kubernetes.io/name: netbox-valkey, app.kubernetes.io/part-of: netbox}
spec:
  selector: {app.kubernetes.io/name: netbox-valkey}
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
---
# The administration LAN may reach NetBox (web interface and API), and so may pods of this cluster: automation
# such as Windmill reads the inventory through the same address, with its own API token. Needs the real
# client address: the k3s role sets externalTrafficPolicy: Local on Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: netbox
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
      - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netbox
  namespace: netbox
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`netbox.doku-lab.net`)
      middlewares:
        - name: admin-lan
      services:
        - name: netbox
          port: 80
  tls: {}
---
# The step added to NetBox's sign-in pipeline (values.yaml, SOCIAL_AUTH_PIPELINE): a person who signs in
# through Authentik is a NetBox superuser exactly while Authentik lists them in homelab-admins. Accounts
# with a local password (the administrator of the secret store) never pass through here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-sso-pipeline
  namespace: netbox
data:
  sso_pipeline.py: |
    SUPERUSER_GROUP = "homelab-admins"


    def claim_groups(response):
        groups = response.get("groups") or []
        return {groups} if isinstance(groups, str) else set(groups)


    def set_superuser(response, user, backend, *args, **kwargs):
        wanted = SUPERUSER_GROUP in claim_groups(response)
        if user.is_superuser != wanted:
            user.is_superuser = wanted
            user.save(update_fields=["is_superuser"])
---
# Plugins (ADR-018): the topology diagram, the floor plan and the rack reordering. The chart runs the image
# with a read-only file system, so the plugins are installed on this volume instead of into the image: once
# per release (NetBox version and the two files below), by an init container of the web and worker pods
# (values.yaml). The shared NVMe storage already carries NetBox's uploads (ADR-012).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-plugins
  namespace: netbox
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nvme-shared
  resources:
    requests:
      storage: 1Gi
---
# Versions are pinned with the checksum of the file PyPI serves: a different file is refused. To change a
# version: change the line and its checksum, then the release name in values.yaml (tests/netbox.py tells it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-plugins
  namespace: netbox
data:
  requirements.txt: |
    netbox-topology-views==5.0.2 --hash=sha256:84975803e0972fa2c5fab463b009a8b5154784562275e8488e65fd45b1ab7eff
    netbox-floorplan-plugin==0.10.0 --hash=sha256:23ccac3ac1c071e5b1214044e537f87c5d2a7ecf2e72beb46e379c1e00803357
    netbox-reorder-rack==1.1.5 --hash=sha256:fc3a700c35648222aa8b49586d4f48014ba2b5bc3175333452ca75d43910e805
  install.sh: |
    #!/bin/sh
    # Installs the pinned plugins once per release into the shared volume, then does nothing at later starts:
    # /plugins/<release>/packages (on PYTHONPATH) and /plugins/<release>/static (NetBox's own static files plus
    # those of the plugins). Web and worker pods may run this at the same time: each builds its own copy and
    # the first rename wins.
    set -eu
    target="/plugins/${PLUGINS_RELEASE}"
    if [ -f "$target/.complete" ]; then
      echo "plugins ${PLUGINS_RELEASE}: already installed"
      exit 0
    fi
    build="$target.$(hostname).tmp"
    rm -rf "$build"
    mkdir -p "$build/packages" "$build/static"
    uv pip install --python /opt/netbox/venv/bin/python --target "$build/packages" \
      --require-hashes --no-deps --only-binary :all: --compile-bytecode -r /config/requirements.txt
    cp -a /opt/netbox/netbox/static/. "$build/static/"
    for directory in "$build"/packages/*/static; do
      if [ -d "$directory" ]; then cp -a "$directory/." "$build/static/"; fi
    done
    touch "$build/.complete"
    mv -T "$build" "$target" 2>/dev/null || rm -rf "$build"
    test -f "$target/.complete"
    echo "plugins ${PLUGINS_RELEASE}: installed"
