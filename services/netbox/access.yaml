# Applied by `make netbox-deploy`: namespace, the key-value store NetBox needs, and the Traefik route.
apiVersion: v1
kind: Namespace
metadata:
  name: netbox
---
# Job queue and cache only: nothing here needs to survive a restart, so no volume and no persistence.
# The password comes from the Secret created by `make netbox-deploy`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-valkey
  namespace: netbox
  labels: {app.kubernetes.io/name: netbox-valkey}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: netbox-valkey}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netbox-valkey}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3-alpine
          args: ["valkey-server", "--requirepass", "$(VALKEY_PASSWORD)", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: netbox-secrets, key: valkey_password}
          ports:
            - {name: valkey, containerPort: 6379}
          readinessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-valkey
  namespace: netbox
  labels: {app.kubernetes.io/name: netbox-valkey, app.kubernetes.io/part-of: netbox}
spec:
  selector: {app.kubernetes.io/name: netbox-valkey}
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
---
# The administration LAN may reach NetBox (web interface and API), and so may pods of this cluster: automation
# such as Windmill reads the inventory through the same address, with its own API token. Needs the real
# client address: the k3s role sets externalTrafficPolicy: Local on Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: netbox
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
      - 10.42.0.0/16
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netbox
  namespace: netbox
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`netbox.doku-lab.net`)
      middlewares:
        - name: admin-lan
      services:
        - name: netbox
          port: 80
  tls: {}
---
# The step added to NetBox's sign-in pipeline (values.yaml, SOCIAL_AUTH_PIPELINE): a person who signs in
# through Authentik is a NetBox superuser exactly while Authentik lists them in homelab-admins. Accounts
# with a local password (the administrator of the secret store) never pass through here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-sso-pipeline
  namespace: netbox
data:
  sso_pipeline.py: |
    SUPERUSER_GROUP = "homelab-admins"


    def claim_groups(response):
        groups = response.get("groups") or []
        return {groups} if isinstance(groups, str) else set(groups)


    def set_superuser(response, user, backend, *args, **kwargs):
        wanted = SUPERUSER_GROUP in claim_groups(response)
        if user.is_superuser != wanted:
            user.is_superuser = wanted
            user.save(update_fields=["is_superuser"])
---
# Plugins (ADR-018): the topology diagram, the floor plan and the rack reordering. The chart runs the image
# with a read-only file system, so the plugins are installed on this volume instead of into the image: once
# per release (NetBox version and the two files below), by an init container of the web and worker pods
# (values.yaml). The shared NVMe storage already carries NetBox's uploads (ADR-012).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: netbox-plugins
  namespace: netbox
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nvme-shared
  resources:
    requests:
      storage: 1Gi
---
# Versions are pinned with the checksum of the file PyPI serves: a different file is refused. To change a
# version: change the line and its checksum, then the release name in values.yaml (tests/netbox.py tells it).
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-plugins
  namespace: netbox
data:
  requirements.txt: |
    netbox-topology-views==5.0.2 --hash=sha256:84975803e0972fa2c5fab463b009a8b5154784562275e8488e65fd45b1ab7eff
    netbox-floorplan-plugin==0.10.0 --hash=sha256:23ccac3ac1c071e5b1214044e537f87c5d2a7ecf2e72beb46e379c1e00803357
    netbox-reorder-rack==1.1.5 --hash=sha256:fc3a700c35648222aa8b49586d4f48014ba2b5bc3175333452ca75d43910e805
  install.sh: |
    #!/bin/sh
    # Installs the pinned plugins once per release into the shared volume, then does nothing at later starts:
    # /plugins/<release>/packages (on PYTHONPATH) and /plugins/<release>/static (NetBox's own static files plus
    # those of the plugins). Web and worker pods may run this at the same time: each builds its own copy and
    # the first rename wins.
    set -eu
    target="/plugins/${PLUGINS_RELEASE}"
    if [ -f "$target/.complete" ]; then
      echo "plugins ${PLUGINS_RELEASE}: already installed"
      exit 0
    fi
    build="$target.$(hostname).tmp"
    rm -rf "$build"
    mkdir -p "$build/packages" "$build/static"
    uv pip install --python /opt/netbox/venv/bin/python --target "$build/packages" \
      --require-hashes --no-deps --only-binary :all: --compile-bytecode -r /config/requirements.txt
    cp -a /opt/netbox/netbox/static/. "$build/static/"
    for directory in "$build"/packages/*/static; do
      if [ -d "$directory" ]; then cp -a "$directory/." "$build/static/"; fi
    done
    touch "$build/.complete"
    mv -T "$build" "$target" 2>/dev/null || rm -rf "$build"
    test -f "$target/.complete"
    echo "plugins ${PLUGINS_RELEASE}: installed"
---
# The appearance (TASK-039): a plugin of three files, read from this ConfigMap by the web and worker pods. It adds
# one stylesheet to the head of every page through NetBox's own extension point (PluginTemplateExtension.head);
# no model, no view, no database change. The stylesheet is services/netbox/theme.css, copied here by `make theme`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-theme
  namespace: netbox
data:
  __init__.py: |
    from netbox.plugins import PluginConfig


    class CharcoalTitanium(PluginConfig):
        name = "netbox_charcoal_titanium"
        verbose_name = "Charcoal Titanium"
        description = "The homelab's shared appearance: one stylesheet in the head of every page."
        version = "1.0.0"
        base_url = "charcoal-titanium"
        min_version = "4.2.0"


    config = CharcoalTitanium
  template_content.py: |
    from pathlib import Path

    from django.utils.safestring import mark_safe
    from netbox.plugins import PluginTemplateExtension

    STYLESHEET = Path(__file__).with_name("theme.css")


    class Stylesheet(PluginTemplateExtension):
        def head(self):
            # Read at each page: a change of the ConfigMap shows without a restart. The file is ours, not user input.
            return mark_safe("<style>" + STYLESHEET.read_text() + "</style>")  # noqa: S308


    template_extensions = [Stylesheet]
  theme.css: |
    /* theme:start (scripts/theme.py) */
    /* Charcoal Titanium for NetBox (TASK-039): the stylesheet the plugin netbox_charcoal_titanium puts in the head of
       every page (copied into services/netbox/access.yaml by scripts/theme.py). */
    /* tokens:start (written by scripts/theme.py from services/_shared/theme/tokens.json) */
    :root {
      --ct-canvas: #10100F;
      --ct-sidebar: #151514;
      --ct-surface: #1B1B19;
      --ct-surface-elevated: #242423;
      --ct-surface-hover: #292927;
      --ct-surface-active: #30302E;
      --ct-border: #30302E;
      --ct-border-strong: #41413E;
      --ct-fg: #EDECE9;
      --ct-fg-secondary: #B5B4AF;
      --ct-fg-muted: #999894;
      --ct-fg-disabled: #666561;
      --ct-action: #E6E5E1;
      --ct-action-hover: #F5F4F0;
      --ct-action-fg: #10100F;
      --ct-action-secondary: #242423;
      --ct-focus: #B5B4AF;
      --ct-success: #79A88C;
      --ct-warning: #C9A66B;
      --ct-error: #D47D7D;
      --ct-series-1: #8FA8BF;
      --ct-series-2: #B9A283;
      --ct-series-3: #8FB39F;
      --ct-series-4: #B596AD;
      --ct-series-5: #A9A7A0;
      --ct-series-6: #C98F8F;
      --ct-radius-sm: 4px;
      --ct-radius-md: 6px;
      --ct-radius-lg: 8px;
      --ct-radius-dialog: 12px;
      --ct-space-1: 4px;
      --ct-space-2: 8px;
      --ct-space-3: 12px;
      --ct-space-4: 16px;
      --ct-space-6: 24px;
      --ct-space-8: 32px;
      --ct-font-sans: "Geist", "Geist Sans", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --ct-font-mono: "Geist Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
      --ct-font-size-sm: 12px;
      --ct-font-size-md: 13px;
      --ct-font-size-lg: 14px;
      --ct-font-size-heading: 20px;
      --ct-grid-image: radial-gradient(ellipse 85% 55% at 50% 0%, rgba(237, 236, 233, 0.10), transparent 72%), radial-gradient(circle at 1.5px 1.5px, rgba(237, 236, 233, 0.17) 1.5px, transparent 0);
      --ct-grid-size: 100% 100%, 28px 28px;
      --ct-metal: linear-gradient(180deg, #FAF9F6 0%, #E4E3DF 46%, #C9C8C3 100%);
      --ct-metal-edge: inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -1px 0 rgba(0, 0, 0, 0.16), 0 1px 2px rgba(0, 0, 0, 0.45);
      --ct-panel-sheen: linear-gradient(180deg, rgba(237, 236, 233, 0.055) 0%, rgba(237, 236, 233, 0) 48%);
      --ct-panel-edge: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 1px 2px rgba(0, 0, 0, 0.35);
      --ct-motion-duration: 140ms;
      --ct-motion-easing: cubic-bezier(0.2, 0, 0, 1);
    }
    /* tokens:end */

    /* NetBox is built on Tabler, whose colours are variables: its dark mode is answered variable for variable, then
       the few places where NetBox writes a colour itself (cards, the side menu). Only the dark mode is themed; a
       user who chose the light mode keeps NetBox's own. Put into every page by the plugin netbox_charcoal_titanium
       (services/netbox/access.yaml). */

    html[data-bs-theme=dark],
    html[data-bs-theme=dark] body {
      --tblr-font-sans-serif: var(--ct-font-sans);
      --tblr-font-monospace: var(--ct-font-mono);

      /* Surfaces. */
      --tblr-body-bg: var(--ct-canvas);
      --tblr-body-bg-rgb: 16, 16, 15;
      --tblr-bg-surface: var(--ct-surface);
      --tblr-bg-surface-secondary: var(--ct-canvas);
      --tblr-bg-surface-tertiary: var(--ct-surface-elevated);
      --tblr-bg-forms: var(--ct-canvas);
      --tblr-secondary-bg: var(--ct-surface-elevated);
      --tblr-secondary-bg-rgb: 36, 36, 34;
      --tblr-tertiary-bg: var(--ct-surface);
      --tblr-tertiary-bg-rgb: 27, 27, 25;
      --tblr-active-bg: var(--ct-surface-active);
      --tblr-light-bg-subtle: var(--ct-surface-elevated);
      --tblr-dark-bg-subtle: var(--ct-canvas);
      --tblr-gray-700: var(--ct-border-strong);
      --tblr-gray-800: var(--ct-surface);
      --tblr-gray-900: var(--ct-canvas);
      --tblr-dropdown-bg: var(--ct-surface-elevated);

      /* Lines and text. */
      --tblr-border-color: var(--ct-border);
      --tblr-border-color-translucent: var(--ct-border);
      --tblr-body-color: var(--ct-fg);
      --tblr-body-color-rgb: 237, 236, 233;
      --tblr-emphasis-color: var(--ct-fg);
      --tblr-secondary-color: var(--ct-fg-secondary);
      --tblr-tertiary-color: var(--ct-fg-muted);
      --tblr-secondary: var(--ct-fg-muted);
      --tblr-code-color: var(--ct-fg-secondary);

      /* The one accent: NetBox's bright teal becomes the off-white of the system, with dark text on it. */
      --tblr-primary: var(--ct-action);
      --tblr-primary-rgb: 230, 229, 225;
      --tblr-primary-fg: var(--ct-action-fg);
      --tblr-primary-text-emphasis: var(--ct-fg);
      --tblr-primary-bg-subtle: var(--ct-surface-active);
      --tblr-primary-border-subtle: var(--ct-border-strong);
      --tblr-link-color: var(--ct-fg);
      --tblr-link-color-rgb: 237, 236, 233;
      --tblr-link-hover-color: var(--ct-action-hover);
      --tblr-link-hover-color-rgb: 255, 255, 255;
      --tblr-border-radius: var(--ct-radius-md);
    }

    /* The page: the canvas with the system's fine dot grid. */
    html[data-bs-theme=dark] body {
      background-color: var(--ct-canvas);
      background-image: var(--ct-grid-image);
      background-size: var(--ct-grid-size);
      background-attachment: fixed;
    }

    /* NetBox paints these itself in dark mode: cards in a blue-black, the side menu with a teal glow. */
    html[data-bs-theme=dark] body .card {
      background: var(--ct-panel-sheen) var(--ct-surface) !important;
      border-color: var(--ct-border);
      box-shadow: var(--ct-panel-edge);
    }

    /* The primary button is brushed metal: lit from above, a fine highlight on its top edge. */
    html[data-bs-theme=dark] body .btn-primary {
      background-image: var(--ct-metal);
      box-shadow: var(--ct-metal-edge);
      color: var(--ct-action-fg);
    }

    html[data-bs-theme=dark] body .navbar-vertical.navbar-expand-lg {
      background: var(--ct-sidebar) !important;
      border-right: 1px solid var(--ct-border);
    }

    html[data-bs-theme=dark] body .text-bg-primary {
      color: var(--ct-action-fg) !important;
    }

    html[data-bs-theme=dark] body .text-secondary {
      color: var(--ct-fg-muted) !important;
    }

    /* Links inside tables and text are told from the words by a fine underline, since the accent is the text colour. */
    html[data-bs-theme=dark] body .table a:not(.btn):not(.badge):not(.dropdown-item),
    html[data-bs-theme=dark] body .rendered-markdown a {
      text-decoration: underline;
      text-decoration-color: var(--ct-border-strong);
      text-underline-offset: 0.18em;
    }

    html[data-bs-theme=dark] body .table a:not(.btn):not(.badge):not(.dropdown-item):hover {
      text-decoration-color: currentcolor;
    }

    html[data-bs-theme=dark] body :focus-visible {
      outline: 2px solid var(--ct-focus);
      outline-offset: 2px;
    }
    /* theme:end */
