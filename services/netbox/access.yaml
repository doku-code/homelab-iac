# Applied by `make netbox-deploy`: namespace, the key-value store NetBox needs, and the Traefik route.
apiVersion: v1
kind: Namespace
metadata:
  name: netbox
---
# Job queue and cache only: nothing here needs to survive a restart, so no volume and no persistence.
# The password comes from the Secret created by `make netbox-deploy`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbox-valkey
  namespace: netbox
  labels: {app.kubernetes.io/name: netbox-valkey}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: netbox-valkey}
  template:
    metadata:
      labels: {app.kubernetes.io/name: netbox-valkey}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3-alpine
          args: ["valkey-server", "--requirepass", "$(VALKEY_PASSWORD)", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "noeviction"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: netbox-secrets, key: valkey_password}
          ports:
            - {name: valkey, containerPort: 6379}
          readinessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: valkey}
            periodSeconds: 20
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-valkey
  namespace: netbox
  labels: {app.kubernetes.io/name: netbox-valkey, app.kubernetes.io/part-of: netbox}
spec:
  selector: {app.kubernetes.io/name: netbox-valkey}
  ports:
    - {name: valkey, port: 6379, targetPort: valkey}
---
# Only the administration LAN may reach NetBox (web interface and API). Needs the real client address: the
# k3s role sets externalTrafficPolicy: Local on Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: admin-lan
  namespace: netbox
spec:
  ipAllowList:
    sourceRange:
      - 192.168.0.0/24
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: netbox
  namespace: netbox
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`netbox.doku-lab.net`)
      middlewares:
        - name: admin-lan
      services:
        - name: netbox
          port: 80
  tls: {}
