# Foundation of the NetBox inventory (M013, ADR-016, ADR-018), read by scripts/netbox-sync.py.
#
# Who owns what:
#   schema       site, clusters, roles, platforms, tags, prefixes, ranges, device types and their ports: this file;
#                the script creates and updates them.
#   devices      what a device is: name, type, role, platform, cluster, status, description, the ports and
#                addresses listed here. This file owns that (change it here). Where a device is and what people
#                note about it belongs to NetBox: rack, position, asset tag, comments, contacts, extra tags.
#                The `rack`, `position` and `face` given here are written only while NetBox has none.
#   observed     what a machine reports about itself (`make netbox-discover-hardware`, `make netbox-discover`):
#                serial number, processor, memory modules, disks, hardware addresses, link speed, the switch port
#                a host is plugged into, and for guests their state, size, disks and hardware addresses. Written
#                as observed; serial numbers and hardware addresses go to NetBox only, never to Git.
#   iac          VMs of the OpenTofu roots listed under iac_roots, and addresses marked iac: Git owns name, VMID,
#                host, role, platform and addresses (tag "iac").
#   discovered   guests found on a Proxmox host that no root defines: created once (tags "discovered" and
#                "needs-review"); name differences are only reported. `guests` below says what the known ones
#                are; a guest described there is no longer "needs-review".
#   overlay      what a member of a tunnel reports about itself (`make netbox-discover-tailscale`): its address in
#                the tailnet, its name there and the routes it advertises. NetBox only, tag "observed".
#   private      what a public repository must not hold: the names of the Wi-Fi networks. They are listed in
#                .local/netbox/private.yaml on the workstation (key `wireless_lans`, same form as below).
# The reconciliation never deletes. Records this file names under `retired` are removed by a separate, approved
# command (`make netbox-prune`). No secrets belong in this file or in NetBox.

site: {name: doku-lab, slug: doku-lab, description: "Homelab, one location, one LAN"}

# Proxmox environments read by `make netbox-discover` (GET requests only). One since 2026-11-24: the old
# environment (cluster homelab, 192.168.0.14) was emptied and its host joined doku-lab as pve-compute.
sources:
  doku-lab:
    endpoint: https://192.168.0.10:8006
    ca: keys/pve-management-root-ca.crt
    cluster: doku-lab
    description: "New Proxmox VE cluster (ADR-010)"

# "site: false": not a network of the location (it exists inside the cluster or at a provider).
prefixes:
  - {prefix: 192.168.0.0/24, description: "LAN, gateway 192.168.0.1 (pfSense)"}
  - {prefix: 10.42.0.0/16, site: false, role: kubernetes, description: "k3s pod network (ansible/roles/k3s/defaults); exists only inside the cluster"}
  - {prefix: 10.43.0.0/16, site: false, role: kubernetes, description: "k3s service network (ansible/roles/k3s/defaults); exists only inside the cluster"}
  - {prefix: 100.64.0.0/10, site: false, role: overlay, status: container, description: "Tailscale addresses (tailnet); ts-router-01 and ts-router-02 route the LAN to it"}

address_roles:
  - {name: Kubernetes, slug: kubernetes}
  - {name: Overlay network, slug: overlay}

# Address plan as enforced by the variable validations of the OpenTofu roots (terraform/stacks/*/variables.tf).
# "role" ties a range to the machines that use it (an IPAM role with the slug of the machine role).
ranges:
  - {start: 192.168.0.40, end: 192.168.0.49, role: k3s-server, description: "k3s nodes (VMIDs 310-349)"}
  - {start: 192.168.0.50, end: 192.168.0.59, role: storage, description: "Storage VMs (VMIDs 350-359)"}
  - {start: 192.168.0.60, end: 192.168.0.69, role: postgresql, description: "PostgreSQL: .60 virtual IP, .61-.69 members (VMIDs 360-369)"}
  - {start: 192.168.0.70, end: 192.168.0.79, role: dns, description: "DNS VMs (VMIDs 370-379)"}
  - {start: 192.168.0.80, end: 192.168.0.89, role: media, description: "Media services, one container each (VMIDs 381-389); .80 was the first version's VM, deleted 2026-11-27"}
  - {start: 192.168.0.100, end: 192.168.0.200, description: "DHCP pool (pfSense), as stated in the k3s root; leases seen between .101 and .130 on 2026-11-20, the limits are not read from pfSense", review: true}

platforms:
  - {name: Proxmox VE 9, slug: proxmox-ve-9}
  - {name: Debian 13, slug: debian-13}
  - {name: Ubuntu 26.04, slug: ubuntu-26-04}
  - {name: Debian, slug: debian}
  - {name: Linux, slug: linux}
  - {name: Windows 11, slug: windows-11}
  - {name: TrueNAS 25.10, slug: truenas-25-10}
  - {name: pfSense, slug: pfsense}
  - {name: QNAP QSS, slug: qnap-qss}
  - {name: Proxmox Backup Server, slug: proxmox-backup-server}

# What Proxmox says about a guest's system, as a platform. Only used while NetBox has none for the guest.
ostypes: {win11: windows-11, debian: debian, l26: linux}

# "icon": the picture of the role in the topology diagram, one of the plugin's own (`make netbox-apply` sets it).
roles:
  - {name: Hypervisor, slug: hypervisor, color: 2196f3, icon: server}
  - {name: Router, slug: router, color: f44336, icon: router}
  - {name: Switch, slug: switch, color: ff9800, icon: switch}
  - {name: Access point, slug: access-point, color: ff5722, icon: wireless-ap}
  - {name: NAS, slug: nas, color: 795548, icon: storage}
  - {name: Backup server, slug: backup-server, color: 607d8b, icon: backup}
  - {name: k3s server, slug: k3s-server, color: 4caf50}
  - {name: PostgreSQL, slug: postgresql, color: 3f51b5}
  - {name: Storage, slug: storage, color: 009688}
  - {name: DNS, slug: dns, color: 9c27b0}
  - {name: Media, slug: media, color: e91e63}
  - {name: Deployment runner, slug: deploy-runner, color: ffc107}
  - {name: CI runner, slug: ci-runner, color: ffeb3b}
  - {name: Admin workstation, slug: admin-workstation, color: 00bcd4}
  - {name: Legacy service, slug: legacy-service, color: 9e9e9e}
  - {name: Tailscale router, slug: tailscale-router, color: 8bc34a}
  - {name: Desktop, slug: desktop, color: 673ab7}
  - {name: Template, slug: template, color: cddc39}

# Hardware models. Manufacturer and model are what the firmware reports (scripts/host-facts.py) or what the
# device announces; "u_height: 0" is a machine that sits on a shelf. `ports` are created on the type and on
# every device of the type; a `range` gives numbered ports.
device_types:
  - slug: lenovo-thinkcentre-m90q
    manufacturer: Lenovo
    model: ThinkCentre M90q
    part_number: 11DGS0UW00
    u_height: 0
    comments: "One-litre desktop (Tiny). Machine type 11DG."
    ports:
      - {name: nic0, type: 1000base-t, description: "Intel I219-LM"}
  - slug: lenovo-thinkstation-p350-tiny
    manufacturer: Lenovo
    model: ThinkStation P350 Tiny
    part_number: 30EF006DUS
    u_height: 0
    comments: "One-litre workstation (Tiny). Machine type 30EF."
    ports:
      - {name: nic0, type: 1000base-t, description: "Intel I219-LM"}
      - {name: wlo1, type: ieee802.11ax, enabled: false, description: "Intel Wi-Fi (Tiger Lake CNVi), not used"}
  - slug: beelink-mini-s
    manufacturer: Beelink
    model: Mini S
    part_number: MINI S
    u_height: 0
    comments: "The firmware reports the manufacturer as AZW (Shenzhen AZW Technology, the company behind Beelink)."
    ports:
      - {name: nic0, type: 1000base-t, description: "Realtek RTL8111/8168"}
      - {name: wlp1s0, type: ieee802.11ac, enabled: false, description: "Intel Wireless 3165, not used"}
  - slug: origimagic-nebula-series
    manufacturer: ORIGIMAGIC
    model: Nebula Series
    part_number: ARB51
    u_height: 0
    comments: "Mini PC; the firmware reports board and family ARB51."
    ports:
      - {name: nic0, type: 2.5gbase-t, description: "Realtek RTL8125"}
      - {name: wlp3s0, type: ieee802.11ax, enabled: false, description: "Intel AX210, not used"}
  - slug: custom-ryzen-9-9950x3d-tower
    manufacturer: Custom build
    model: Tower, ASUS mainboard, Ryzen 9 9950X3D
    u_height: 0
    comments: "Built from parts. The firmware reports the mainboard ASUS ProArt B850-CREATOR WIFI NEO and no model name; ports as the host reports them (2026-11-24)."
    ports:
      - {name: enp1s0f0np0, type: 25gbase-x-sfp28, description: "Mellanox ConnectX-4 Lx (add-in card), port 1, no link"}
      - {name: enp1s0f1np1, type: 25gbase-x-sfp28, description: "Mellanox ConnectX-4 Lx (add-in card), port 2; linked at 10 Gbit/s"}
      - {name: nic0, type: 5gbase-t, enabled: false, description: "Realtek RTL8126 on the mainboard, not used"}
      - {name: nic1, type: 5gbase-t, enabled: false, description: "Realtek RTL8126 on the mainboard, not used"}
      - {name: wlp9s0, type: ieee802.11be, enabled: false, description: "Realtek RTL8922AE (Wi-Fi 7) on the mainboard, not used"}
  - slug: custom-asrock-n100m-nas
    manufacturer: Custom build
    model: NAS, ASRock N100M mainboard
    u_height: 0
    comments: "Built from parts: Intel N100, 16 GB, a 10 Gb SFP+ card. Read through the TrueNAS API on 2026-11-20."
    ports:
      - {name: enp1s0, type: 10gbase-x-sfpp, description: "Add-in 10 Gb card (SFP+)"}
      - {name: enp3s0, type: 1000base-t, description: "On the mainboard, no link"}
  - slug: qnap-qsw-m3216r-8s8t
    manufacturer: QNAP
    model: QSW-M3216R-8S8T
    part_number: QSW-M3216R-8S8T
    u_height: 1
    is_full_depth: false
    comments: "Managed 10 Gb switch, half the width of a rack unit: ports 1 to 8 are RJ45 (10G/5G/2.5G/1G), 9 to 16 SFP+ (stated by the operator, 2026-11-21), plus one management port."
    ports:
      - {range: [1, 8], type: 10gbase-t}
      - {range: [9, 16], type: 10gbase-x-sfpp}
      - {name: mgmt, type: 1000base-t, mgmt_only: true, description: "Dedicated management port"}
  - slug: tp-link-eap720
    manufacturer: TP-Link
    model: EAP720
    part_number: EAP720
    u_height: 0
    comments: "Omada dual-band Wi-Fi 7 access point (BE5000), one 2.5 Gbit/s port; model as the operator states it (2026-11-23)."
    ports:
      - {name: eth0, type: 2.5gbase-t, poe_mode: pd, poe_type: type2-ieee802.3at, description: "Uplink, power over Ethernet (802.3at)"}
      - {name: wlan0, type: ieee802.11be, rf_role: ap, description: "2.4 GHz radio"}
      - {name: wlan1, type: ieee802.11be, rf_role: ap, description: "5 GHz radio"}
  - slug: lenovo-thinkcentre-m75q-gen-2
    manufacturer: Lenovo
    model: ThinkCentre M75q Gen 2
    u_height: 0
    comments: "One-litre desktop (Tiny), AMD Ryzen. As the operator describes this one (2026-11-21): the network port of the machine, and a 2.5 Gb adapter in the M.2 A+E slot."
    ports:
      - {name: wan, type: 1000base-t, description: "Port of the machine"}
      - {name: lan, type: 2.5gbase-t, description: "2.5 Gb adapter in the M.2 A+E slot"}

# Racks. Size and kind are stated here; where each device sits in the rack belongs to NetBox (drag it in the
# rack view, or give `position` and `face` on the device below: they are written only while NetBox has none).
racks:
  - name: rack-01
    u_height: 27
    width: 19
    form_factor: 4-post-cabinet
    outer_width: 600
    outer_depth: 610
    outer_unit: mm
    description: "Sysracks cabinet, 27 U, 19 inches, 610 mm deep (operator, 2026-11-21). Probably the SRW 27.600: check the label"

# Devices. "facts": the address `make netbox-discover-hardware` reads the hardware from (root SSH, read-only;
# never the old host). "review: true" marks what nobody has verified. A port listed under `ports` adds to
# the ports of the type; `address` puts an address on it, `primary: true` makes it the device's address.
devices:
  - name: pve-management
    type: lenovo-thinkcentre-m90q
    role: hypervisor
    platform: proxmox-ve-9
    cluster: doku-lab
    facts: 192.168.0.10
    description: "Intel Core i5-10500T, 16 GB RAM, 256 GB NVMe; hosts the admin workstation (ADR-002)"
    ports:
      - {name: vmbr0, type: bridge, members: [nic0], address: 192.168.0.10/24, primary: true}
  - name: pve-core
    type: lenovo-thinkstation-p350-tiny
    role: hypervisor
    platform: proxmox-ve-9
    cluster: doku-lab
    facts: 192.168.0.11
    description: "Intel Core i7-11700, 32 GB RAM, 1 TB NVMe, a 25 Gb SFP28 card"
    ports:
      - {name: vmbr0, type: bridge, members: [enp1s0np0], address: 192.168.0.11/24, primary: true}
      - {name: enp1s0np0, type: 25gbase-x-sfp28, description: "Mellanox ConnectX-4 Lx, card added by the operator in November 2026; carries vmbr0 since 2026-11-26, linked at 10 Gbit/s over a 2 m SFP28 DAC"}
      - {name: amt, type: virtual, parent: nic0, mgmt_only: true, address: 192.168.0.9/24,
         description: "Intel AMT: the management engine answers on nic0's hardware address (ports 623 and 16992 open on 2026-11-20)"}
  - name: pve-infra
    type: beelink-mini-s
    role: hypervisor
    platform: proxmox-ve-9
    cluster: doku-lab
    facts: 192.168.0.12
    description: "Intel Celeron N5095A, 8 GB RAM, 256 GB SATA SSD"
    ports:
      - {name: vmbr0, type: bridge, members: [nic0], address: 192.168.0.12/24, primary: true}
  - name: pve-lab
    type: origimagic-nebula-series
    role: hypervisor
    platform: proxmox-ve-9
    cluster: doku-lab
    facts: 192.168.0.16
    description: "AMD Ryzen 7 6800H, 28 GB usable RAM, 512 GB NVMe"
    ports:
      - {name: vmbr0, type: bridge, members: [nic0], address: 192.168.0.16/24, primary: true}
  - name: pve-compute
    type: custom-ryzen-9-9950x3d-tower
    role: hypervisor
    platform: proxmox-ve-9
    cluster: doku-lab
    facts: 192.168.0.14
    description: "AMD Ryzen 9 9950X3D, 32 threads, 30 GB usable RAM, 1 TB and 2 TB NVMe. The old environment until 2026-11-24 (then named pve-lab)"
    ports:
      - {name: vmbr0, type: bridge, members: [enp1s0f1np1], address: 192.168.0.14/24, primary: true}
  - name: pfsense
    type: lenovo-thinkcentre-m75q-gen-2
    role: router
    platform: pfsense
    description: "AMD Ryzen 3, 8 GB RAM. pfSense, LAN gateway and DHCP; never changed or signed in to by automation"
    ports:
      # pfsense.doku-lab.net and switch.doku-lab.net answer the ingress (192.168.0.45) since 2026-11-24, not these ports.
      - {name: lan, address: 192.168.0.1/24, primary: true, dns_name: ""}
  - name: switch
    type: qnap-qsw-m3216r-8s8t
    role: switch
    platform: qnap-qss
    rack: rack-01
    description: "Core switch; every Proxmox host of doku-lab is plugged into it"
    ports:
      - {name: vlan1, type: virtual, mgmt_only: true, address: 192.168.0.3/24, dns_name: "", primary: true,
         description: "Management address, set by the operator on 2026-11-22; the switch announces it (LLDP)"}
      - {name: "3", description: ""}
  - name: access-point
    type: tp-link-eap720
    role: access-point
    description: "Wi-Fi access point, managed on its own web interface"
    ports:
      - {name: eth0, address: 192.168.0.2/24, primary: true}
  - name: truenas
    type: custom-asrock-n100m-nas
    role: nas
    platform: truenas-25-10
    cluster: truenas
    description: "TrueNAS: Forgejo, Nextcloud, Plex, qBittorrent; pools tank (2 x 8 TB mirror), fastpool (1 TB), apps-pool (180 GB). Not built from this repository"
    ports:
      - {name: bond0, type: lag, members: [enp1s0], address: 192.168.0.13/24, primary: true,
         description: "Aggregate of the 10 Gb port alone since 2026-11-27 (the mainboard port left it); holds the address"}

# Cables nobody can read from a machine. Those between the Proxmox hosts and the switch are not listed here:
# the hosts hear the switch name its port (LLDP) and the reconciliation records them (tag "observed").
# The three below were found on 2026-11-22 by sending traffic to each machine and reading which port of the switch
# carried it (the switch's own counters, SNMP). The access point's traffic leaves through port 3 at 2.5 Gbit/s,
# the speed of the EAP720's own port. Ports 14 and 16 were told apart wrongly that day (32-bit counters wrap at
# 10 Gbit/s): on 2026-11-24 the old host, now pve-compute, heard the switch name port 16, which leaves 14, the
# only other SFP+ port with a link, for TrueNAS.
cables:
  - {a: [access-point, eth0], b: [switch, "3"], description: "Found by traffic and the switch's port counters, 2026-11-22; link at 2.5 Gbit/s"}
  - {a: [pfsense, lan], b: [switch, "1"], description: "Found by traffic and the switch's port counters, 2026-11-22; link at 2.5 Gbit/s"}
  - {a: [truenas, enp1s0], b: [switch, "14"], type: dac-passive, description: "The other SFP+ port with a link: pve-compute announces port 16 (LLDP, 2026-11-24)"}

# Other clusters than the Proxmox ones, and the machines on them that no Proxmox API lists.
clusters:
  - {name: truenas, type: TrueNAS, description: "Virtual machines run by TrueNAS itself"}
virtual_machines:
  - name: pbs
    cluster: truenas
    device: truenas
    role: backup-server
    platform: proxmox-backup-server
    status: offline
    vcpus: 2
    memory: 4096
    address: 192.168.0.15/24
    address_status: reserved
    description: "Proxmox Backup Server, a VM on TrueNAS. Stopped: its backup disk failed in November 2026"

# Application services on machines that are not VMs of a root (those come from `services` below).
device_services:
  truenas:
    - {name: TrueNAS web interface, protocol: tcp, ports: [81, 444]}
    - {name: Forgejo, protocol: tcp, ports: [30142, 30143], description: "git.doku-lab.net, through Traefik on k3s (services/ingress/legacy-routes.yaml)"}
    - {name: Nextcloud, protocol: tcp, ports: [30027], description: "cloud.doku-lab.net, through Traefik on k3s (services/ingress/legacy-routes.yaml)"}
  switch:
    - {name: Web interface, protocol: tcp, ports: [80, 443], description: "switch.doku-lab.net, through Traefik on k3s, from the LAN only"}
  pfsense:
    - {name: Web interface, protocol: tcp, ports: [443], description: "pfsense.doku-lab.net, through Traefik on k3s, from the LAN only"}
  access-point:
    - {name: Web interface, protocol: tcp, ports: [443]}

# Addresses that belong to no port listed above. "iac: true": owned by Git; the others are written once.
addresses:
  - {address: 192.168.0.90/24, status: reserved, dns_name: "", iac: true, description: "Reserved for the Windows service VM 700 (moved from the old host, kept off); the Traefik route dropper.doku-lab.net forwards to it"}
  - {address: 192.168.0.45/24, role: vip, iac: true, description: "k3s shared address: API and ingress, held by one server at a time (kube-vip, ansible/roles/k3s); the published names answer it"}
  - {address: 192.168.0.60/24, role: vip, iac: true, description: "PostgreSQL primary (Patroni virtual IP, terraform/stacks/postgresql)"}
  - {address: 192.168.0.20/24, role: secondary, iac: true, vm: dns-01, dns_name: adguard.doku-lab.net, description: "LAN DNS service address, shared by dns-01 and dns-02 through keepalived; recorded on the primary (ansible/vars/dns.yml)"}

# Wi-Fi networks: name (`ssid`), `description`, optional `group`, `auth_type` (open, wep, wpa-personal,
# wpa-enterprise), `auth_cipher` (auto, tkip, aes) and the `radios` that carry them as [device, port]. The real
# ones are in the private file (see `private` at the top); passphrases are never recorded anywhere.
wireless_lans: []

# Tunnels. Git says that a tunnel exists and which role of guests are its members; each member's port, tailnet
# address and advertised routes are read from the member itself (`make netbox-discover-tailscale`).
tunnel_groups:
  - {name: Tailscale, slug: tailscale, description: "The tailnet: WireGuard mesh run by Tailscale, remote access to the LAN"}
tunnels:
  - name: tailscale-lan
    group: tailscale
    encapsulation: wireguard
    description: "Tailnet access to 192.168.0.0/24 through two subnet routers; one serves the route, the other takes over when it stops"
    members: {role: tailscale-router, interface: tailscale0, role_in_tunnel: peer}

# What the guests no root defines are (cluster, then VMID or a range of VMIDs). A guest described here gets
# this role and description and is no longer "needs-review", unless "review: true" keeps the flag.
guests:
  doku-lab:
    - {vmids: [306, 307], role: tailscale-router, platform: debian-13, description: "Tailscale subnet router for the LAN (ansible/playbooks/configure-tailscale-routers.yml); container moved from the old host on 2026-11-21, not defined by a root yet"}
    - {vmids: [500, 599], role: desktop, description: "Desktop VM copied from the old host on 2026-11-24 before it became pve-compute; verified by the operator, the originals are deleted. Kept off"}
    - {vmids: [700, 799], role: desktop, description: "Windows VM moved from the old environment on 2026-11-21, kept off; its network is set by the operator when it is started again"}

# Records an earlier version of this file created and that are wrong: removed by `make netbox-prune` (the
# reconciliation itself never deletes). NetBox refuses to remove a record something still refers to.
retired:
  - {path: dcim/devices, name: pbs, reason: "The backup server is a VM on TrueNAS, not a device"}
  - {path: dcim/device-types, slug: unknown-unknown, reason: "Every device has a named type now"}
  - {path: dcim/device-types, slug: asus-custom-built-pc, reason: "Replaced by custom-ryzen-9-9950x3d-tower"}
  - {path: dcim/device-types, slug: azw-mini-s, reason: "Replaced by beelink-mini-s"}
  - {path: dcim/manufacturers, slug: unknown, reason: "No device type uses it"}
  - {path: dcim/manufacturers, slug: azw, reason: "The maker is recorded as Beelink"}
  - {path: dcim/manufacturers, slug: asus, reason: "No device type uses it"}
  - {path: dcim/device-types, slug: unidentified-firewall-appliance, reason: "pfSense runs on a Lenovo ThinkCentre M75q Gen 2"}
  - {path: dcim/manufacturers, slug: unidentified, reason: "No device type uses it"}
  # Guests of the old environment that were replaced and then deleted from the old host on 2026-11-21 (operator's
  # decision). Their ports and addresses go with them.
  - {path: virtualization/virtual-machines, name: media-01, cluster: doku-lab, reason: "VM380, replaced by one container per media service, deleted 2026-11-27"}
  - {path: virtualization/virtual-machines, name: adguard, reason: "CT200, replaced by dns-01, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: homepage, reason: "CT201, replaced by the dashboard on k3s, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: wiki-js, reason: "CT202, replaced by the wiki on k3s, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: windmill, reason: "CT210, replaced by Windmill on k3s, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: deb13-infisical, reason: "VM207, replaced by Phase, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: deb13-monitoring, reason: "VM208, replaced by the monitoring on k3s, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: k3s-server-1, reason: "VM303, Stage A k3s replaced by the doku-lab cluster, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: k3s-server-2, reason: "VM304, Stage A k3s replaced by the doku-lab cluster, deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: k3s-server-3, reason: "VM305, Stage A k3s replaced by the doku-lab cluster, deleted 2026-11-21"}
  # The two Tailscale routers moved to the new cluster on 2026-11-21 (same containers, same addresses); the copies
  # on the old host were deleted on the operator's word. Their records in the old cluster go, the new ones stay.
  - {path: virtualization/virtual-machines, name: ts-router-01, cluster: homelab, reason: "CT306 moved to pve-core, old copy deleted 2026-11-21"}
  - {path: virtualization/virtual-machines, name: ts-router-02, cluster: homelab, reason: "CT307 moved to pve-management, old copy deleted 2026-11-21"}
  # The old environment no longer exists (2026-11-24): its last guests were replaced or moved, the host joined
  # doku-lab. Every record of its cluster goes, then the cluster.
  - {path: virtualization/virtual-machines, cluster: homelab, every: true, reason: "Guest of the old environment, replaced, moved or deleted by 2026-11-24"}
  - {path: virtualization/clusters, name: homelab, reason: "The old environment joined doku-lab as pve-compute on 2026-11-24"}
  - {path: ipam/ip-addresses, address: 192.168.0.116/24, reason: "DHCP lease the switch had until the operator gave it 192.168.0.3 on 2026-11-22"}
  - {path: dcim/device-types, slug: tp-link-eap220, reason: "The access point is an EAP720 (operator, 2026-11-23)"}
  # Review of every record, 2026-11-24. The two SFP+ cables were recorded on each other's port; the right ones are
  # created by the reconciliation once these are gone (pve-compute - 16 heard through LLDP, truenas - 14 above).
  - {path: dcim/cables, between: [[pve-compute, enp1s0f1np1], [switch, "14"]], reason: "pve-compute announces port 16 (LLDP)"}
  - {path: dcim/cables, between: [[truenas, enp1s0], [switch, "16"]], reason: "Port 16 is pve-compute's; TrueNAS is on 14"}
  # The operator replaced the patch panel on 2026-11-27: pve-infra and pve-lab swapped switch ports (heard through
  # LLDP: pve-infra on 6, pve-lab on 7). The reconciliation creates the right cables once these are gone.
  - {path: dcim/cables, between: [[pve-infra, nic0], [switch, "7"]], reason: "pve-infra announces port 6 since the new patch panel (LLDP, 2026-11-27)"}
  - {path: dcim/cables, between: [[pve-lab, nic0], [switch, "6"]], reason: "pve-lab announces port 7 since the new patch panel (LLDP, 2026-11-27)"}
  # Three disposable VMs of the PostgreSQL upgrade rehearsal (TASK-038), observed while they existed.
  - {path: virtualization/virtual-machines, name: pgr-01, cluster: doku-lab, reason: "VM366, upgrade rehearsal, destroyed 2026-11-27"}
  - {path: virtualization/virtual-machines, name: pgr-02, cluster: doku-lab, reason: "VM367, upgrade rehearsal, destroyed 2026-11-27"}
  - {path: virtualization/virtual-machines, name: pgr-03, cluster: doku-lab, reason: "VM368, upgrade rehearsal, destroyed 2026-11-27"}
  - {path: dcim/interfaces, name: nic2, reason: "pve-compute has two ports on its mainboard, not three"}
  - {path: dcim/interface-templates, name: nic2, reason: "pve-compute has two ports on its mainboard, not three"}

# OpenTofu roots whose VMs are inventoried from `tofu output -json ansible_inventory` (state on the workstation).
iac_roots:
  - {root: pve-management-control, group: mgmt_control, role: admin-workstation, platform: ubuntu-26-04, node: pve-management}
  - {root: deploy-runner, group: deploy_runner, role: deploy-runner, platform: debian-13}
  - {root: ci-runner, group: ci_runner, role: ci-runner, platform: debian-13}
  - {root: k3s, group: k3s_cluster, role: k3s-server, platform: debian-13}
  - {root: storage, group: storage, role: storage, platform: debian-13}
  - {root: postgresql, group: postgresql, role: postgresql, platform: debian-13}
  - {root: dns, group: dns, role: dns, platform: debian-13}
  - {root: media, group: media, role: media, platform: debian-13}

# Configuration contexts: the parameters automation reads from NetBox (GET /api/virtualization/virtual-machines/
# returns them merged per machine as "config_context"). Git owns them: the script creates and updates them,
# a change made in NetBox is overwritten. Values are the ones the roots and roles of this repository use
# (terraform/stacks/*/variables.tf, ansible/vars/dns.yml). No credentials here: secrets live in Phase.
config_contexts:
  - name: site-network
    description: "LAN settings every machine of the site uses"
    sites: [doku-lab]
    data:
      network: {prefix: 192.168.0.0/24, gateway: 192.168.0.1, dns_servers: [192.168.0.20], domain: doku-lab.net}
  - name: platform-debian-13
    description: "How automation logs in to Debian 13 cloud images"
    platforms: [debian-13]
    data:
      ansible: {user: debian, python_interpreter: /usr/bin/python3}
  - name: platform-ubuntu-26-04
    description: "How automation logs in to the Ubuntu workstation"
    platforms: [ubuntu-26-04]
    data:
      ansible: {user: ubuntu, python_interpreter: /usr/bin/python3}
  - name: role-k3s-server
    description: "Provisioning rules of k3s nodes (terraform/stacks/k3s)"
    roles: [k3s-server]
    data:
      provisioning:
        opentofu_root: terraform/stacks/k3s
        ansible_group: k3s_cluster
        vmid_range: [310, 349]
        proxmox_hosts: [pve-core, pve-infra, pve-lab, pve-compute]
        minimum: {cores: 2, memory_mb: 4096, disk_gb: 32}
  - name: role-storage
    description: "Provisioning rules of storage VMs (terraform/stacks/storage)"
    roles: [storage]
    data:
      provisioning:
        opentofu_root: terraform/stacks/storage
        ansible_group: storage
        vmid_range: [350, 359]
        proxmox_hosts: [pve-core, pve-compute]
        minimum: {cores: 1, memory_mb: 1024, disk_gb: 10}
  - name: role-postgresql
    description: "Provisioning rules of PostgreSQL members (terraform/stacks/postgresql)"
    roles: [postgresql]
    data:
      provisioning:
        opentofu_root: terraform/stacks/postgresql
        ansible_group: postgresql
        vmid_range: [360, 369]
        proxmox_hosts: [pve-core, pve-infra, pve-lab, pve-compute]
        minimum: {cores: 2, memory_mb: 2048, disk_gb: 10}
  - name: role-dns
    description: "Provisioning rules of DNS VMs (terraform/stacks/dns)"
    roles: [dns]
    data:
      provisioning:
        opentofu_root: terraform/stacks/dns
        ansible_group: dns
        vmid_range: [370, 379]
        proxmox_hosts: [pve-core, pve-infra, pve-lab, pve-compute]
        minimum: {cores: 1, memory_mb: 1024, disk_gb: 10}
  - name: role-media
    description: "Provisioning rules of media VMs (terraform/stacks/media)"
    roles: [media]
    data:
      provisioning:
        opentofu_root: terraform/stacks/media
        ansible_group: media
        vmid_range: [380, 389]
        proxmox_hosts: [pve-infra, pve-lab]
        minimum: {cores: 2, memory_mb: 4096, disk_gb: 12}

# What each kind of machine serves, recorded on every VM of the role that a root defines.
services:
  k3s-server:
    - {name: Kubernetes API, protocol: tcp, ports: [6443]}
    - {name: Ingress (Traefik), protocol: tcp, ports: [80, 443]}
  postgresql:
    - {name: PostgreSQL, protocol: tcp, ports: [5432], description: "Clients use the virtual IP 192.168.0.60"}
  dns:
    - {name: DNS, protocol: udp, ports: [53]}
    - {name: AdGuard Home web interface, protocol: tcp, ports: [80]}
  storage:
    - {name: NFS, protocol: tcp, ports: [2049]}
  media:
    - {name: Jellyfin, protocol: tcp, ports: [8096], description: "jellyfin.doku-lab.net through Traefik on k3s"}
    - {name: Seerr, protocol: tcp, ports: [5055], description: "seerr.doku-lab.net through Traefik on k3s"}
    - {name: Media tools, protocol: tcp, ports: [7878, 8989, 9696], description: "Radarr, Sonarr, Prowlarr: media.doku-lab.net behind Authentik; Traefik, the other media containers and the workstation only"}
