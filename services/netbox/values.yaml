# NetBox (M013, ADR-016): official chart netbox-community/netbox, pinned in
# services/argocd/apps/netbox.yaml and kept in sync by Argo CD. One web pod, one
# worker pod. The database is the shared PostgreSQL outside k3s (ADR-015); the key-value store is only a job
# queue and cache and runs in the cluster (services/netbox/access.yaml).
image:
  tag: v4.7.5

# Every credential comes from the Kubernetes Secret created by `make netbox-deploy` from the environment
# (store paths /netbox and /postgresql), never from Git.
existingSecret: netbox-secrets
superuser:
  existingSecret: netbox-secrets

allowedHosts:
  - netbox.doku-lab.net
csrf:
  trustedOrigins:
    - https://netbox.doku-lab.net
# The chart's default lets anyone read the inventory without an account.
loginRequired: true

# Single sign-on through Authentik (ADR-017). The login page keeps its user name and password form for the
# local administrator and gains a button "authentik". Members of Authentik's group homelab-admins become
# NetBox superusers at each login (the two functions of the ConfigMap netbox-sso-pipeline in access.yaml).
# The client secret is the file oidc.yaml of the Secret `netbox-sso`, written by `make netbox-deploy`;
# NetBox starts without it.
remoteAuth:
  enabled: true
  backends:
    - social_core.backends.open_id_connect.OpenIdConnectAuth
logoutRedirectUrl: https://auth.doku-lab.net/application/o/netbox/end-session/
extraConfig:
  - values:
      SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: https://auth.doku-lab.net/application/o/netbox/
      SOCIAL_AUTH_OIDC_KEY: netbox
      SOCIAL_AUTH_OIDC_SCOPE: [openid, profile, email]
      SOCIAL_AUTH_BACKEND_ATTRS:
        oidc: [authentik, login]
      # NetBox's own pipeline, plus the last step.
      SOCIAL_AUTH_PIPELINE:
        - social_core.pipeline.social_auth.social_details
        - social_core.pipeline.social_auth.social_uid
        - social_core.pipeline.social_auth.auth_allowed
        - social_core.pipeline.social_auth.social_user
        - social_core.pipeline.user.get_username
        - social_core.pipeline.user.create_user
        - social_core.pipeline.social_auth.associate_user
        - netbox.authentication.user_default_groups_handler
        - social_core.pipeline.social_auth.load_extra_data
        - social_core.pipeline.user.user_details
        - netbox.sso_pipeline.set_superuser
  - secret:
      secretName: netbox-sso
      optional: true
extraVolumes:
  - name: sso-pipeline
    configMap:
      name: netbox-sso-pipeline
  - &plugins-volume
    name: plugins
    persistentVolumeClaim:
      claimName: netbox-plugins
  - &plugins-config
    name: plugins-config
    configMap:
      name: netbox-plugins
  - &plugins-tmp
    name: plugins-tmp
    emptyDir: {}
  # The appearance plugin (TASK-039): three files of a ConfigMap, no installation.
  - &theme-volume
    name: theme
    configMap:
      name: netbox-theme
extraVolumeMounts:
  - name: sso-pipeline
    mountPath: /opt/netbox/netbox/netbox/sso_pipeline.py
    subPath: sso_pipeline.py
    readOnly: true
  - &plugins-packages
    name: plugins
    mountPath: /opt/netbox/plugins
    subPath: v4.7.5-d787f1278b51/packages
    readOnly: true
  - &theme-package
    name: theme
    mountPath: /opt/netbox/theme/netbox_charcoal_titanium
    readOnly: true
  # NetBox's own static files with those of the plugins, in place of the image's.
  - name: plugins
    mountPath: /opt/netbox/netbox/static
    subPath: v4.7.5-d787f1278b51/static
    readOnly: true

# Plugins (ADR-018): diagrams of the network (from the cables) and of the room, and rack reordering by
# dragging. They are not part of the image: the init container below installs the pinned files of the
# ConfigMap netbox-plugins (services/netbox/access.yaml) once per release into the volume netbox-plugins, and
# the web and worker containers read them from there. The release name is the NetBox version and a checksum
# of that ConfigMap's files; it changes with either, which makes the next start install again. PyPI is needed
# for that one start only. Database changes of the plugins are applied by NetBox when it starts.
plugins:
  - netbox_topology_views
  - netbox_floorplan
  - netbox_reorder_rack
  - netbox_charcoal_titanium
pluginsConfig:
  netbox_topology_views:
    # Positions arranged by hand in the diagram are kept.
    allow_coordinates_saving: true
initContainers:
  - &plugins-install
    name: plugins
    image: ghcr.io/netbox-community/netbox:v4.7.5
    command: [sh, /config/install.sh]
    env:
      - {name: PLUGINS_RELEASE, value: v4.7.5-d787f1278b51}
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      capabilities: {drop: [ALL]}
      seccompProfile: {type: RuntimeDefault}
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {memory: 512Mi}
    volumeMounts:
      - {name: plugins, mountPath: /plugins}
      - {name: plugins-config, mountPath: /config, readOnly: true}
      - {name: plugins-tmp, mountPath: /tmp}

# Routes are in services/netbox/access.yaml (Traefik, LAN only, wildcard certificate).
ingress:
  enabled: false

postgresql:
  enabled: false
externalDatabase:
  host: 192.168.0.60
  port: 5432
  database: netbox
  username: netbox
  existingSecretName: netbox-secrets
  existingSecretKey: db_password
  options:
    sslmode: require
    target_session_attrs: read-write

# The bundled Valkey sub-chart pulls an unpinned image (bitnami/valkey:latest) and defaults to replication;
# a single pinned official Valkey is declared in access.yaml instead.
valkey:
  enabled: false
tasksDatabase:
  host: netbox-valkey
  existingSecretName: netbox-secrets
  existingSecretKey: valkey_password
cachingDatabase:
  host: netbox-valkey
  existingSecretName: netbox-secrets
  existingSecretKey: valkey_password

# Uploaded images and attachments: shared NVMe storage outside the cluster (ADR-012). Web and worker pods
# mount the same volume and may run on different nodes.
persistence:
  enabled: true
  storageClass: nvme-shared
  accessMode: ReadWriteMany
  size: 1Gi

replicaCount: 1
# The image starts four web workers by default (about 1.5 GiB together); two are plenty for one household.
extraEnvs:
  - {name: GRANIAN_WORKERS, value: "2"}
  - &plugins-path {name: PYTHONPATH, value: "/opt/netbox/plugins:/opt/netbox/theme"}
resources:
  requests: {cpu: 200m, memory: 768Mi}
  limits: {cpu: 2000m, memory: 2Gi}
worker:
  replicaCount: 1
  # The worker loads the same plugins (background jobs import them).
  initContainers:
    - *plugins-install
  extraVolumes:
    - *plugins-volume
    - *plugins-config
    - *plugins-tmp
    - *theme-volume
  extraVolumeMounts:
    - *plugins-packages
    - *theme-package
  extraEnvs:
    - *plugins-path
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: 1000m, memory: 1536Mi}
