---
# Shared PostgreSQL platform (M007, ADR-015). Run through `make postgresql-configure` from the operator
# workstation; the inventory comes from the OpenTofu outputs of terraform/stacks/postgresql and the
# credentials from the environment (secret store path /postgresql).
- name: Configure the PostgreSQL/Patroni members
  hosts: postgresql
  become: true
  gather_facts: true
  force_handlers: true
  any_errors_fatal: true
  vars:
    stage_a_hostname: "{{ inventory_hostname }}"
  vars_files:
    - ../vars/postgresql-apps.yml
  roles:
    - headless_baseline
    - patroni_postgresql
  tasks:
    - name: Keep SSH key-only and without root login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          # Managed by Ansible (configure-postgresql.yml)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
  handlers:
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
