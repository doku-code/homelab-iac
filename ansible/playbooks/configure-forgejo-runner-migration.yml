---
- name: Configure the clean Forgejo Runner connections
  hosts: forgejo_runner_migration
  become: false
  gather_facts: true
  vars:
    infisical_url: "https://secrets.doku-lab.net"
    infisical_environment: "dev"
    infisical_secret_path: "/forgejo-runner/connections"
    infisical_registry_secret_path: "/forgejo-runner/registry"
    infisical_project_id: "{{ (lookup('ansible.builtin.file', playbook_dir + '/../../.infisical.json') | from_json).workspaceId }}"
    forgejo_runner_home: /var/lib/forgejo-runner
    forgejo_runner_registry_auth_required: true
    forgejo_runner_connection_uuids: {}
    forgejo_runner_connection_tokens: {}
    forgejo_runner_instances:
      - name: migration
        service_name: forgejo-runner
        user: runner
        group: runner
        working_directory: /var/lib/forgejo-runner
        config_file: /etc/forgejo-runner/config.yml
        config_owner: runner
        config_group: runner
        podman_socket: unix:///run/podman/podman.sock
        container_options: ""
        valid_volumes: []
        supplementary_groups:
          - podman
        connections:
          homelab-iac:
            url: https://git.doku-lab.net/Homelab/homelab-iac/
            labels:
              - homelab-iac:docker://node:22-bookworm
          CEM:
            url: https://git.doku-lab.net/CEM/cem-obsidian-importer/
            labels:
              - cem:docker://git.doku-lab.net/cem/cem-ci:1.0.0
          forgejo-custom-theme:
            url: https://git.doku-lab.net/doku-code/forgejo-custom-theme/
            labels:
              - forgejo-theme:docker://node:22-bookworm

  pre_tasks:
    - name: Require fresh connection UUIDs
      ansible.builtin.assert:
        that:
          - forgejo_runner_connection_uuids.keys() | list | sort == ['CEM', 'forgejo-custom-theme', 'homelab-iac']
        fail_msg: "Supply the three fresh Forgejo connection UUIDs after registration."

    - name: Require Infisical Machine Identity credentials
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'INFISICAL_CLIENT_ID') | length > 0
          - lookup('ansible.builtin.env', 'INFISICAL_CLIENT_SECRET') | length > 0
        fail_msg: "Set INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET in the controller environment."
      delegate_to: localhost
      become: false
      no_log: true

    - name: Authenticate to Infisical with Universal Auth
      infisical.vault.login:
        url: "{{ infisical_url }}"
        auth_method: universal_auth
        universal_auth_client_id: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_ID') }}"
        universal_auth_client_secret: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_SECRET') }}"
      register: infisical_login
      check_mode: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read clean runner connection secrets from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "{{ infisical_secret_path }}"
        as_dict: true
      register: infisical_runner_secrets
      check_mode: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read Forgejo registry credentials from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "{{ infisical_registry_secret_path }}"
        as_dict: true
      register: infisical_registry_secrets
      check_mode: false
      delegate_to: localhost
      become: false
      no_log: true

    - name: Require Forgejo registry credentials
      ansible.builtin.assert:
        that:
          - "'REGISTRY_USERNAME' in (infisical_registry_secrets.secrets | default({}))"
          - "'REGISTRY_READ_TOKEN' in (infisical_registry_secrets.secrets | default({}))"
        fail_msg: "Forgejo registry read credentials are missing from Infisical."
      delegate_to: localhost
      become: false
      no_log: true

    - name: Map Forgejo registry credentials in memory
      ansible.builtin.set_fact:
        forgejo_runner_registry_username: "{{ infisical_registry_secrets.secrets['REGISTRY_USERNAME'] }}"
        forgejo_runner_registry_token: "{{ infisical_registry_secrets.secrets['REGISTRY_READ_TOKEN'] }}"
      no_log: true

    - name: Require clean runner connection secrets
      ansible.builtin.assert:
        that:
          - "'HOMELAB_IAC_CONNECTION_TOKEN' in (infisical_runner_secrets.secrets | default({}))"
          - "'CEM_CONNECTION_TOKEN' in (infisical_runner_secrets.secrets | default({}))"
          - "'CUSTOM_THEME_CONNECTION_TOKEN' in (infisical_runner_secrets.secrets | default({}))"
        fail_msg: "The clean runner connection secrets are missing from Infisical."
      delegate_to: localhost
      become: false
      no_log: true

    - name: Map clean runner connection secrets in memory
      ansible.builtin.set_fact:
        forgejo_runner_connection_tokens:
          migration:
            homelab-iac: "{{ infisical_runner_secrets.secrets['HOMELAB_IAC_CONNECTION_TOKEN'] }}"
            CEM: "{{ infisical_runner_secrets.secrets['CEM_CONNECTION_TOKEN'] }}"
            forgejo-custom-theme: "{{ infisical_runner_secrets.secrets['CUSTOM_THEME_CONNECTION_TOKEN'] }}"
      no_log: true

    - name: Add fresh connection UUIDs to the target model
      ansible.builtin.set_fact:
        forgejo_runner_instances: >-
          {{ forgejo_runner_instances | map('combine', {
            'connections': {
              'homelab-iac': {'url': 'https://git.doku-lab.net/Homelab/homelab-iac/', 'uuid': forgejo_runner_connection_uuids['homelab-iac'], 'labels': ['homelab-iac:docker://node:22-bookworm']},
              'CEM': {'url': 'https://git.doku-lab.net/CEM/cem-obsidian-importer/', 'uuid': forgejo_runner_connection_uuids['CEM'], 'labels': ['cem:docker://git.doku-lab.net/cem/cem-ci:1.0.0']},
              'forgejo-custom-theme': {'url': 'https://git.doku-lab.net/doku-code/forgejo-custom-theme/', 'uuid': forgejo_runner_connection_uuids['forgejo-custom-theme'], 'labels': ['forgejo-theme:docker://node:22-bookworm']}
            }
          }) | list }}

  roles:
    - forgejo_runner
