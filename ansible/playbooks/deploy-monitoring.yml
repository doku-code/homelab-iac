# ansible monitoring \
#  -b \
#  -m ansible.builtin.command \
#  -a "docker compose -f /opt/monitoring/compose.yml ps"
---
- name: Deploy Grafana and Prometheus
  hosts: monitoring
  become: true

  vars:
    infisical_url: "https://secrets.doku-lab.net"
    infisical_environment: "dev"
    infisical_secret_path: "/"
    infisical_project_id: "92363d0a-b281-4867-bd6e-6d643ffa8158"

  pre_tasks:
    - name: Login to Infisical
      infisical.vault.login:
        url: "{{ infisical_url }}"
        auth_method: universal_auth
        universal_auth_client_id: "{{ lookup('env', 'INFISICAL_UNIVERSAL_AUTH_CLIENT_ID') }}"
        universal_auth_client_secret: "{{ lookup('env', 'INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET') }}"
      register: infisical_login
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read monitoring secrets from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "{{ infisical_secret_path }}"
        as_dict: true
      register: infisical_secrets
      delegate_to: localhost
      become: false
      no_log: true

    - name: Map monitoring secrets
      ansible.builtin.set_fact:
        grafana_admin_password: "{{ infisical_secrets.secrets.GRAFANA_ADMIN_PASSWORD }}"
        pve_exporter_user: "{{ infisical_secrets.secrets.PVE_EXPORTER_USER }}"
        pve_exporter_token_name: "{{ infisical_secrets.secrets.PVE_EXPORTER_TOKEN_NAME }}"
        pve_exporter_token_value: "{{ infisical_secrets.secrets.PVE_EXPORTER_TOKEN_VALUE }}"
        pve_exporter_verify_ssl: "{{ infisical_secrets.secrets.PVE_EXPORTER_VERIFY_SSL }}"
        discord_alert_webhook: "{{ infisical_secrets.secrets.DISCORD_ALERT_WEBHOOK }}"
      no_log: true

    - name: Ensure monitoring secrets are available
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length > 0
          - pve_exporter_user | length > 0
          - pve_exporter_token_name | length > 0
          - pve_exporter_token_value | length > 0
          - pve_exporter_verify_ssl | length > 0
          - discord_alert_webhook | length > 0
        fail_msg: "Required monitoring secrets are missing."
      no_log: true

  tasks:
    - name: Create Grafana and Prometheus directory
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Grafana and Prometheus configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/monitoring/"
        dest: /opt/monitoring/
        owner: root
        group: root
        mode: preserve

    - name: Remove legacy Prometheus configuration file
      ansible.builtin.file:
        path: /opt/monitoring/prometheus.yml
        state: absent

    - name: Create monitoring secrets directory
      ansible.builtin.file:
        path: /opt/monitoring/.secrets
        state: directory
        owner: root
        group: "65534"
        mode: "0750"

    - name: Install Discord webhook secret
      ansible.builtin.copy:
        dest: /opt/monitoring/.secrets/discord-webhook-url
        content: "{{ discord_alert_webhook }}"
        owner: root
        group: "65534"
        mode: "0640"
      no_log: true

    - name: Deploy monitoring stack
      block:
        - name: Create temporary Compose environment file
          ansible.builtin.copy:
            dest: /opt/monitoring/.env.runtime
            owner: root
            group: root
            mode: "0600"
            content: |
              GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password | to_json }}
              PVE_EXPORTER_USER={{ pve_exporter_user | to_json }}
              PVE_EXPORTER_TOKEN_NAME={{ pve_exporter_token_name | to_json }}
              PVE_EXPORTER_TOKEN_VALUE={{ pve_exporter_token_value | to_json }}
              PVE_EXPORTER_VERIFY_SSL={{ pve_exporter_verify_ssl | to_json }}
          no_log: true

        - name: Deploy monitoring containers
          community.docker.docker_compose_v2:
            project_src: /opt/monitoring
            env_files:
              - .env.runtime
            state: present
            pull: missing
            remove_orphans: true
          no_log: true

      always:
        - name: Remove temporary Compose environment file
          ansible.builtin.file:
            path: /opt/monitoring/.env.runtime
            state: absent
          no_log: true

    - name: Validate Prometheus configuration
      ansible.builtin.command:
        cmd: docker exec prometheus promtool check config /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Validate Prometheus alert rules
      ansible.builtin.command:
        cmd: docker exec prometheus promtool check rules /etc/prometheus/rules/homelab-alerts.yml
      changed_when: false

    - name: Validate Alertmanager configuration
      ansible.builtin.command:
        cmd: docker exec alertmanager amtool check-config /etc/alertmanager/alertmanager.yml
      changed_when: false

    - name: Reload Prometheus configuration
      ansible.builtin.uri:
        url: http://192.168.0.28:9090/-/reload
        method: POST
        status_code: 200

    - name: Reload Alertmanager configuration
      ansible.builtin.uri:
        url: http://192.168.0.28:9093/-/reload
        method: POST
        status_code: 200

    - name: Reload Grafana datasource provisioning
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/admin/provisioning/datasources/reload
        method: POST
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      no_log: true
