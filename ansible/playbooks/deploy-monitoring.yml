# infisical run --env=dev -- \
# ansible-playbook ansible/playbooks/deploy-monitoring.yml
#
# ansible monitoring \
#  -b \
#  -m ansible.builtin.command \
#  -a "docker compose -f /opt/monitoring/compose.yml ps"
---
- name: Deploy Grafana and Prometheus
  hosts: monitoring
  become: true

  vars:
    grafana_admin_password: >-
      {{ lookup('ansible.builtin.env', 'GRAFANA_ADMIN_PASSWORD') }}
    pve_exporter_user: >-
      {{ lookup('ansible.builtin.env', 'PVE_EXPORTER_USER') }}
    pve_exporter_token_name: >-
      {{ lookup('ansible.builtin.env', 'PVE_EXPORTER_TOKEN_NAME') }}
    pve_exporter_token_value: >-
      {{ lookup('ansible.builtin.env', 'PVE_EXPORTER_TOKEN_VALUE') }}
    pve_exporter_verify_ssl: >-
      {{ lookup('ansible.builtin.env', 'PVE_EXPORTER_VERIFY_SSL') }}
    discord_alert_webhook: >-
      {{ lookup('ansible.builtin.env', 'DISCORD_ALERT_WEBHOOK') }}

  pre_tasks:
    - name: Ensure monitoring secrets are available
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length > 0
          - pve_exporter_user | length > 0
          - pve_exporter_token_name | length > 0
          - pve_exporter_token_value | length > 0
          - pve_exporter_verify_ssl | length > 0
          - discord_alert_webhook | length > 0
        fail_msg: "Required monitoring secrets are missing."
      no_log: true

  tasks:
    - name: Create Grafana and Prometheus directory
      ansible.builtin.file:
        path: /opt/monitoring
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy Grafana and Prometheus configuration
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/monitoring/"
        dest: /opt/monitoring/
        owner: root
        group: root
        mode: preserve

    - name: Remove legacy Prometheus configuration file
      ansible.builtin.file:
        path: /opt/monitoring/prometheus.yml
        state: absent

    - name: Create monitoring secrets directory
      ansible.builtin.file:
        path: /opt/monitoring/.secrets
        state: directory
        owner: root
        group: "65534"
        mode: "0750"

    - name: Install Discord webhook secret
      ansible.builtin.copy:
        dest: /opt/monitoring/.secrets/discord-webhook-url
        content: "{{ discord_alert_webhook }}"
        owner: root
        group: "65534"
        mode: "0640"
      no_log: true

    - name: Deploy monitoring stack
      block:
        - name: Create temporary Compose environment file
          ansible.builtin.copy:
            dest: /opt/monitoring/.env.runtime
            owner: root
            group: root
            mode: "0600"
            content: |
              GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password | to_json }}
              PVE_EXPORTER_USER={{ pve_exporter_user | to_json }}
              PVE_EXPORTER_TOKEN_NAME={{ pve_exporter_token_name | to_json }}
              PVE_EXPORTER_TOKEN_VALUE={{ pve_exporter_token_value | to_json }}
              PVE_EXPORTER_VERIFY_SSL={{ pve_exporter_verify_ssl | to_json }}
          no_log: true

        - name: Deploy monitoring containers
          community.docker.docker_compose_v2:
            project_src: /opt/monitoring
            env_files:
              - .env.runtime
            state: present
            pull: missing
            remove_orphans: true
          no_log: true

      always:
        - name: Remove temporary Compose environment file
          ansible.builtin.file:
            path: /opt/monitoring/.env.runtime
            state: absent
          no_log: true

    - name: Validate Prometheus configuration
      ansible.builtin.command:
        cmd: docker exec prometheus promtool check config /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Validate Prometheus alert rules
      ansible.builtin.command:
        cmd: docker exec prometheus promtool check rules /etc/prometheus/rules/homelab-alerts.yml
      changed_when: false

    - name: Validate Alertmanager configuration
      ansible.builtin.command:
        cmd: docker exec alertmanager amtool check-config /etc/alertmanager/alertmanager.yml
      changed_when: false

    - name: Reload Prometheus configuration
      ansible.builtin.uri:
        url: http://192.168.0.28:9090/-/reload
        method: POST
        status_code: 200

    - name: Reload Alertmanager configuration
      ansible.builtin.uri:
        url: http://192.168.0.28:9093/-/reload
        method: POST
        status_code: 200

    - name: Reload Grafana datasource provisioning
      ansible.builtin.uri:
        url: http://127.0.0.1:3000/api/admin/provisioning/datasources/reload
        method: POST
        user: admin
        password: "{{ grafana_admin_password }}"
        force_basic_auth: true
        status_code: 200
      no_log: true
