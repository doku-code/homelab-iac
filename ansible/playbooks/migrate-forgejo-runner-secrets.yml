---
- name: Migrate existing Forgejo runner connection secrets to Infisical
  hosts: forgejo_runner
  become: true
  gather_facts: false
  vars:
    infisical_url: "https://secrets.doku-lab.net"
    infisical_environment: "{{ lookup('ansible.builtin.env', 'INFISICAL_ENV') | default('dev', true) }}"
    infisical_secret_path: "/forgejo-runner/connections"
    infisical_project_id: "{{ (lookup('ansible.builtin.file', playbook_dir + '/../../.infisical.json') | from_json).workspaceId }}"
    runner_secret_migration_confirm: false

  tasks:
    - name: Require explicit migration confirmation
      ansible.builtin.assert:
        that:
          - runner_secret_migration_confirm | bool
        fail_msg: "Set CONFIRM_RUNNER_SECRET_MIGRATION=yes to authorize this one-time Infisical write."
      no_log: true

    - name: Read the existing main runner configuration
      ansible.builtin.slurp:
        src: /home/runner/runner-config.yml
      register: main_runner_config
      no_log: true

    - name: Read the existing custom-theme runner configuration
      ansible.builtin.slurp:
        src: /home/runner/forgejo-custom-theme-runner-config.yml
      register: custom_theme_runner_config
      no_log: true

    - name: Map live connection tokens in memory
      ansible.builtin.set_fact:
        runner_migration_secrets:
          CEM_CONNECTION_TOKEN: "{{ (main_runner_config.content | b64decode | from_yaml).server.connections.cem.token }}"
          THEME_CONNECTION_TOKEN: "{{ (main_runner_config.content | b64decode | from_yaml).server.connections.theme.token }}"
          CUSTOM_THEME_CONNECTION_TOKEN: "{{ (custom_theme_runner_config.content | b64decode | from_yaml).server.connections['forgejo-custom-theme'].token }}"
      no_log: true

    - name: Authenticate to Infisical with Universal Auth
      infisical.vault.login:
        url: "{{ infisical_url }}"
        auth_method: universal_auth
        universal_auth_client_id: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_ID') }}"
        universal_auth_client_secret: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_SECRET') }}"
      register: infisical_login
      delegate_to: localhost
      become: false
      no_log: true

    - name: Check for existing canonical runner secrets
      infisical.vault.read_secrets:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "{{ infisical_secret_path }}"
        as_dict: true
      register: existing_runner_secrets
      delegate_to: localhost
      become: false
      no_log: true

    - name: Refuse to overwrite existing canonical secrets
      ansible.builtin.assert:
        that:
          - "(runner_migration_secrets.keys() | intersect((existing_runner_secrets.secrets | default({})).keys()) | length) == 0"
        fail_msg: "One or more canonical runner secrets already exist; refusing to overwrite them."
      no_log: true

    - name: Create canonical runner infrastructure secrets
      infisical.vault.create_secret:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "{{ infisical_secret_path }}"
        secret_name: "{{ item.key }}"
        secret_value: "{{ item.value }}"
        secret_comment: "Forgejo runner connection credential; migrated from CT 300 live configuration."
      loop: "{{ runner_migration_secrets | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Verify canonical runner secret names
      infisical.vault.read_secrets:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "{{ infisical_secret_path }}"
        as_dict: true
      register: migrated_runner_secrets
      delegate_to: localhost
      become: false
      no_log: true

    - name: Confirm canonical runner secrets exist
      ansible.builtin.assert:
        that:
          - "item in (migrated_runner_secrets.secrets | default({}))"
          - "(migrated_runner_secrets.secrets[item] | default('')) | length > 0"
        fail_msg: "A migrated runner secret could not be verified."
      loop: "{{ runner_migration_secrets.keys() | list }}"
      delegate_to: localhost
      become: false
      no_log: true
