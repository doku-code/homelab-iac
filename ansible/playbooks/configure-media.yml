---
# Media VM media-01 (TASK-036). Run through `make media-configure` from the operator workstation; the
# inventory comes from the OpenTofu outputs of terraform/stacks/media and the credentials from the
# environment (store paths /media and /postgresql).
- name: Configure the media VM
  hosts: media
  become: true
  gather_facts: true
  force_handlers: true
  vars:
    stage_a_hostname: "{{ inventory_hostname }}"
  vars_files:
    - ../vars/media.yml
  roles:
    - headless_baseline
    - media_stack
  tasks:
    - name: Keep SSH key-only and without root login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          # Managed by Ansible (configure-media.yml)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
  handlers:
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
