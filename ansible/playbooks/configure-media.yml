---
# One media service per container (TASK-036). The containers are reached as root with the workstation's key,
# as Proxmox creates them; there is no other account on them.
- name: Configure the media containers
  hosts: media
  gather_facts: true
  force_handlers: true
  vars_files:
    - ../vars/media.yml
  roles:
    - media_service
  post_tasks:
    - name: Keep SSH key-only
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          # Managed by Ansible (configure-media.yml)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin prohibit-password
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
  handlers:
    # In a container SSH is started by its socket, and such a server cannot reload: it is stopped (open sessions
    # stay) and the socket starts it again, with the new settings, at the next connection.
    - name: Reload SSH
      ansible.builtin.shell: systemctl is-active --quiet ssh.socket && systemctl stop ssh.service || systemctl reload ssh.service
      changed_when: true
