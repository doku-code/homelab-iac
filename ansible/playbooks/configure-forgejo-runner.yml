---
- name: Configure Forgejo Actions runner
  hosts: forgejo_runner
  become: "{{ runner_ansible_become | default(false) }}"
  gather_facts: true
  vars:
    infisical_url: "https://secrets.doku-lab.net"
    infisical_environment: "{{ lookup('ansible.builtin.env', 'INFISICAL_ENV') | default('dev', true) }}"
    infisical_secret_path: "/forgejo-runner/connections"
    infisical_project_id: "{{ (lookup('ansible.builtin.file', playbook_dir + '/../../.infisical.json') | from_json).workspaceId }}"

  pre_tasks:
    - name: Require Infisical Machine Identity credentials
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'INFISICAL_CLIENT_ID') | length > 0
          - lookup('ansible.builtin.env', 'INFISICAL_CLIENT_SECRET') | length > 0
        fail_msg: "Set INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET in the controller environment."
      delegate_to: localhost
      become: false
      no_log: true

    - name: Authenticate to Infisical with Universal Auth
      infisical.vault.login:
        url: "{{ infisical_url }}"
        auth_method: universal_auth
        universal_auth_client_id: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_ID') }}"
        universal_auth_client_secret: "{{ lookup('ansible.builtin.env', 'INFISICAL_CLIENT_SECRET') }}"
      register: infisical_login
      delegate_to: localhost
      become: false
      no_log: true

    - name: Read Forgejo runner connection secrets from Infisical
      infisical.vault.read_secrets:
        login_data: "{{ infisical_login.login_data }}"
        project_id: "{{ infisical_project_id }}"
        env_slug: "{{ infisical_environment }}"
        path: "{{ infisical_secret_path }}"
        as_dict: true
      register: infisical_runner_secrets
      delegate_to: localhost
      become: false
      no_log: true

    - name: Require the canonical runner connection secrets
      ansible.builtin.assert:
        that:
          - "'CEM_CONNECTION_TOKEN' in (infisical_runner_secrets.secrets | default({}))"
          - "'THEME_CONNECTION_TOKEN' in (infisical_runner_secrets.secrets | default({}))"
          - "'CUSTOM_THEME_CONNECTION_TOKEN' in (infisical_runner_secrets.secrets | default({}))"
        fail_msg: "The canonical Forgejo runner connection secrets are missing from Infisical."
      delegate_to: localhost
      become: false
      no_log: true

    - name: Map runner connection secrets in memory
      ansible.builtin.set_fact:
        forgejo_runner_connection_tokens:
          main:
            cem: "{{ infisical_runner_secrets.secrets['CEM_CONNECTION_TOKEN'] }}"
            theme: "{{ infisical_runner_secrets.secrets['THEME_CONNECTION_TOKEN'] }}"
          custom_theme:
            forgejo-custom-theme: "{{ infisical_runner_secrets.secrets['CUSTOM_THEME_CONNECTION_TOKEN'] }}"
      no_log: true

  roles:
    - forgejo_runner
