---
# Shared storage VM storage-01 (M006). Run through `make storage-configure` from the operator workstation;
# the inventory comes from the OpenTofu outputs of terraform/stacks/storage. No secrets involved.
- name: Configure the shared NFS storage VM
  hosts: storage
  become: true
  gather_facts: true
  force_handlers: true
  vars:
    stage_a_hostname: "{{ inventory_hostname }}"
  roles:
    - headless_baseline
    - nfs_server
  tasks:
    - name: Keep SSH key-only and without root login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          # Managed by Ansible (configure-storage.yml)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
  handlers:
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
