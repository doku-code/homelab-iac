---
# Bootstrap deployment runner deploy-runner-01 (ADR-014, M003) on doku-lab. Run through
# `make runner-configure` from the operator workstation: the inventory comes from the OpenTofu outputs of
# terraform/stacks/deploy-runner, the secrets from the controller environment (Infisical /deploy-runner):
# FORGEJO_RUNNER_UUID, FORGEJO_RUNNER_TOKEN, DEPLOY_PROXMOX_VE_API_TOKEN. Never logged, never in Git.
- name: Configure the bootstrap deployment runner
  hosts: deploy_runner
  become: true
  gather_facts: true
  force_handlers: true
  vars:
    stage_a_hostname: "{{ inventory_hostname }}"
  roles:
    - headless_baseline
    - deploy_runner
  tasks:
    - name: Keep SSH key-only and without root login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          # Managed by Ansible (configure-deploy-runner.yml)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        owner: root
        group: root
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload SSH
  handlers:
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
