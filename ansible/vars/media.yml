# Media services (TASK-036): the pinned releases the containers run, with the checksum of what is downloaded.
# An update is a new version (and checksum) here, then `make media-configure`.
media_versions:
  jellyfin: "12.4+deb13"
  seerr: v3.5.2
  node: "22.23.5"
  radarr: "7.0.3.10918"
  sonarr: "4.0.20.3014"
  prowlarr: "3.1.0.5799"
media_checksums:
  seerr: d4340a2eb2c11e30dc7fbb600eb576e5694226580a3405e2879b768a3b53bb12
  node: cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8
  radarr: 1737e72150ea991c8f224fcf529c419b7e6c567ba672cbf27a61f11c9a51fe8e
  sonarr: 1fc48544b5a3401b2fc3df8d0642c1e6a73a28e41a351169edd9cd8f54770db5
  prowlarr: e9c66fd3d2c5e94ca51e2495eb9e99ee16004dc396cac4e74905d1408fe31767

# The Plex library on the NAS, read-only (NFS share of the NAS, mounted on the node, passed to Jellyfin by
# `make media-mounts`). Each entry becomes a Jellyfin library; path is under /mnt/tank/plex_media.
media_nas_libraries:
  - {name: Movies, type: movies, path: Movies}
  - {name: Series, type: tvshows, path: Series}
  - {name: Animes, type: tvshows, path: Animes}
