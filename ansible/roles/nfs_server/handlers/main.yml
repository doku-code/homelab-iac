---
- name: Reload exports
  ansible.builtin.command:
    argv: [exportfs, -ra]
  changed_when: true

- name: Restart NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    state: restarted

- name: Reload firewall
  ansible.builtin.systemd_service:
    name: nftables
    state: restarted
