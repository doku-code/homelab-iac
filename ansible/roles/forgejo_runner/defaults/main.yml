---
forgejo_runner_version: "13.0.0"
forgejo_runner_arch: amd64
forgejo_runner_binary: /usr/local/bin/forgejo-runner
forgejo_runner_checksum: "sha256:cfcfe65e9ed5c9a4b344acfdbc3c32210b274c005a5888f46967c4d988177707"
forgejo_runner_package_state: present
forgejo_runner_service_state: started
forgejo_runner_service_enabled: true
forgejo_runner_home: /var/lib/forgejo-runner
forgejo_runner_group: runner
forgejo_runner_podman_socket: unix:///run/podman/podman.sock
forgejo_runner_podman_socket_group: podman
forgejo_runner_podman_socket_mode: "0660"
forgejo_runner_podman_runtime_dir: /run/podman
forgejo_runner_podman_runtime_mode: "0710"
forgejo_runner_podman_tmpfiles_config: /etc/tmpfiles.d/zz-forgejo-runner-podman.conf
forgejo_runner_packages:
  - ca-certificates
  - curl
  - git
  - podman
  - buildah
  - conmon
  - crun
  - fuse-overlayfs
  - slirp4netns
  - uidmap
forgejo_runner_container_network: ""
forgejo_runner_container_privileged: false
# Empty selects every runner instance. Set to a list of names for staged
# convergence, for example [main].
forgejo_runner_instance_names: []
forgejo_runner_registry_auth_required: false
forgejo_runner_registry_url: git.doku-lab.net
forgejo_runner_registry_username: ""
forgejo_runner_registry_token: ""


forgejo_runner_connection_tokens: {}
forgejo_runner_connection_uuids: {}
forgejo_runner_registry_auth_dir: /etc/forgejo-runner/registry
forgejo_runner_registry_auth_file: "{{ forgejo_runner_registry_auth_dir }}/config.json"
forgejo_runner_instances:
  - name: main
    service_name: forgejo-runner
    user: runner
    group: runner
    working_directory: "{{ forgejo_runner_home }}"
    config_file: /etc/forgejo-runner/config.yml
    config_owner: runner
    config_group: runner
    podman_socket: "{{ forgejo_runner_podman_socket }}"
    container_options: ""
    # Only trusted publication workflows may request this root-equivalent socket.
    valid_volumes:
      - /run/podman/podman.sock
    supplementary_groups:
      - podman
    connections:
      # The instance URL is shared; UUID/token identities determine scope.
      homelab-iac:
        url: https://git.doku-lab.net/
        uuid: "{{ forgejo_runner_connection_uuids['homelab-iac'] }}"
        labels:
          - homelab-iac:docker://git.doku-lab.net/doku-code/ci-base:1.0.0
      cem:
        url: https://git.doku-lab.net/
        uuid: "{{ forgejo_runner_connection_uuids['cem'] }}"
        labels:
          - cem:docker://git.doku-lab.net/cem/cem-ci:1.0.3
      forgejo-custom-theme:
        url: https://git.doku-lab.net/
        uuid: "{{ forgejo_runner_connection_uuids['forgejo-custom-theme'] }}"
        labels:
          - forgejo-theme:docker://git.doku-lab.net/doku-code/ci-base:1.0.0
