---
- name: Select Forgejo runner instances
  ansible.builtin.set_fact:
    forgejo_runner_selected_instances: >-
      {{ forgejo_runner_instances
         if forgejo_runner_instance_names | length == 0
         else forgejo_runner_instances
              | selectattr('name', 'in', forgejo_runner_instance_names)
              | list }}

- name: Validate selected Forgejo runner instances
  ansible.builtin.assert:
    that:
      - forgejo_runner_selected_instances | length > 0
      - forgejo_runner_instance_names | length == 0 or forgejo_runner_selected_instances | length == forgejo_runner_instance_names | length
    fail_msg: "Every requested Forgejo runner instance must exist."

- name: Require a Linux runner host
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
    fail_msg: "The Forgejo runner role supports Linux hosts only."

- name: Refresh Debian package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when: ansible_facts['os_family'] == 'Debian'

- name: Install runner and Podman prerequisites
  ansible.builtin.package:
    name: "{{ forgejo_runner_packages }}"
    state: "{{ forgejo_runner_package_state }}"

- name: Create the Podman socket group
  ansible.builtin.group:
    name: "{{ forgejo_runner_podman_socket_group }}"
    system: true

- name: Configure Podman runtime directory permissions
  ansible.builtin.copy:
    dest: "{{ forgejo_runner_podman_tmpfiles_config }}"
    content: |
      # Keep the rootful Podman API traversable by the dedicated runner group.
      z {{ forgejo_runner_podman_runtime_dir }} {{ forgejo_runner_podman_runtime_mode }} root {{ forgejo_runner_podman_socket_group }} -
    owner: root
    group: root
    mode: "0644"

- name: Apply Podman runtime directory permissions
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - "{{ forgejo_runner_podman_tmpfiles_config }}"
  changed_when: false

- name: Create Podman socket override directory
  ansible.builtin.file:
    path: /etc/systemd/system/podman.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Podman socket ownership
  ansible.builtin.copy:
    dest: /etc/systemd/system/podman.socket.d/runner.conf
    content: |
      [Socket]
      SocketGroup={{ forgejo_runner_podman_socket_group }}
      SocketMode={{ forgejo_runner_podman_socket_mode }}
      ExecStartPre=/usr/bin/install -d -o root -g {{ forgejo_runner_podman_socket_group }} -m {{ forgejo_runner_podman_runtime_mode }} {{ forgejo_runner_podman_runtime_dir }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart Podman socket

- name: Enable the rootful Podman socket
  ansible.builtin.systemd_service:
    name: podman.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Inspect Podman socket ownership
  ansible.builtin.stat:
    path: /run/podman/podman.sock
  register: forgejo_runner_podman_socket_stat

- name: Apply Podman socket ownership immediately
  ansible.builtin.systemd_service:
    name: podman.socket
    state: restarted
    daemon_reload: true
  when:
    - forgejo_runner_podman_socket_stat.stat.pw_name != 'root'
      or forgejo_runner_podman_socket_stat.stat.gr_name != forgejo_runner_podman_socket_group
      or forgejo_runner_podman_socket_stat.stat.mode != forgejo_runner_podman_socket_mode

- name: Create runner group
  ansible.builtin.group:
    name: "{{ item.group }}"
    system: true
  loop: "{{ forgejo_runner_selected_instances }}"
  when: item.user != 'root'

- name: Create runner user
  ansible.builtin.user:
    name: "{{ item.user }}"
    group: "{{ item.group }}"
    home: "{{ forgejo_runner_home }}"
    create_home: true
    system: true
    shell: /usr/sbin/nologin
  loop: "{{ forgejo_runner_selected_instances }}"
  when: item.user != 'root'

- name: Add runner users to Podman groups
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: "{{ item.supplementary_groups }}"
    append: true
  loop: "{{ forgejo_runner_selected_instances }}"
  when: item.user != 'root'

- name: Create runner home and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: runner
    group: runner
    mode: "0750"
  loop:
    - "{{ forgejo_runner_home }}"

- name: Create runner configuration directories
  ansible.builtin.file:
    path: "{{ instance.config_file | dirname }}"
    state: directory
    owner: "{{ instance.config_owner }}"
    group: "{{ instance.config_group }}"
    mode: "0750"
  loop: "{{ forgejo_runner_selected_instances }}"
  loop_control:
    loop_var: instance

- name: Require Forgejo registry credentials
  ansible.builtin.assert:
    that:
      - forgejo_runner_registry_username | length > 0
      - forgejo_runner_registry_token | length > 0
    fail_msg: "Forgejo registry read credentials are required for the configured runner image."
  when: forgejo_runner_registry_auth_required | bool
  no_log: true

- name: Create persistent registry authentication directory
  ansible.builtin.file:
    path: "{{ forgejo_runner_registry_auth_dir }}"
    state: directory
    owner: root
    group: runner
    mode: "0750"
  when: forgejo_runner_registry_auth_required | bool

- name: Install persistent registry authentication for Podman and the runner
  ansible.builtin.copy:
    dest: "{{ forgejo_runner_registry_auth_file }}"
    content: >-
      {{ {'auths': {forgejo_runner_registry_url: {
        'auth': (forgejo_runner_registry_username ~ ':' ~ forgejo_runner_registry_token) | b64encode
      }}} | to_nice_json }}
    owner: runner
    group: runner
    mode: "0600"
  when: forgejo_runner_registry_auth_required | bool
  no_log: true
  diff: false
  notify: Restart Forgejo Runner instances

- name: Authenticate rootful Podman using the managed auth file
  ansible.builtin.command:
    argv:
      - podman
      - login
      - --authfile
      - "{{ forgejo_runner_registry_auth_file }}"
      - "{{ forgejo_runner_registry_url }}"
    stdin: ""
    stdin_add_newline: false
  changed_when: false
  when: forgejo_runner_registry_auth_required | bool
  no_log: true

- name: Download Forgejo Runner
  ansible.builtin.get_url:
    url: "https://code.forgejo.org/forgejo/runner/releases/download/v{{ forgejo_runner_version }}/forgejo-runner-{{ forgejo_runner_version }}-linux-{{ forgejo_runner_arch }}"
    dest: "{{ forgejo_runner_binary }}"
    checksum: "{{ forgejo_runner_checksum }}"
    owner: root
    group: root
    mode: "0755"
    force: true

- name: Deploy runner configurations
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ instance.config_file }}"
    owner: "{{ instance.config_owner }}"
    group: "{{ instance.config_group }}"
    mode: "0600"
  loop: "{{ forgejo_runner_selected_instances }}"
  loop_control:
    loop_var: instance
  vars:
    runner_instance: "{{ instance }}"
  no_log: true
  notify: Restart Forgejo Runner instances

- name: Install runner services
  ansible.builtin.template:
    src: forgejo-runner.service.j2
    dest: "/etc/systemd/system/{{ instance.service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ forgejo_runner_selected_instances }}"
  loop_control:
    loop_var: instance
  vars:
    runner_instance: "{{ instance }}"
  notify: Restart Forgejo Runner instances

- name: Enable and set runner services to the requested state
  ansible.builtin.systemd_service:
    name: "{{ item.service_name }}.service"
    enabled: "{{ forgejo_runner_service_enabled }}"
    state: "{{ forgejo_runner_service_state }}"
    daemon_reload: true
  loop: "{{ forgejo_runner_selected_instances }}"
