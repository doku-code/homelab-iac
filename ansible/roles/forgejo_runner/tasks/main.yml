---
- name: Select Forgejo runner instances
  ansible.builtin.set_fact:
    forgejo_runner_selected_instances: >-
      {{ forgejo_runner_instances
         if forgejo_runner_instance_names | length == 0
         else forgejo_runner_instances
              | selectattr('name', 'in', forgejo_runner_instance_names)
              | list }}

- name: Validate selected Forgejo runner instances
  ansible.builtin.assert:
    that:
      - forgejo_runner_selected_instances | length > 0
      - forgejo_runner_instance_names | length == 0 or forgejo_runner_selected_instances | length == forgejo_runner_instance_names | length
    fail_msg: "Every requested Forgejo runner instance must exist."

- name: Require a Linux runner host
  ansible.builtin.assert:
    that:
      - ansible_facts['system'] == 'Linux'
    fail_msg: "The Forgejo runner role supports Linux hosts only."

- name: Refresh Debian package metadata
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when: ansible_facts['os_family'] == 'Debian'

- name: Install runner and Podman prerequisites
  ansible.builtin.package:
    name: "{{ forgejo_runner_packages }}"
    state: "{{ forgejo_runner_package_state }}"

- name: Create the Podman socket group
  ansible.builtin.group:
    name: "{{ forgejo_runner_podman_socket_group }}"
    system: true

- name: Create Podman socket override directory
  ansible.builtin.file:
    path: /etc/systemd/system/podman.socket.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Podman socket ownership
  ansible.builtin.copy:
    dest: /etc/systemd/system/podman.socket.d/runner.conf
    content: |
      [Socket]
      SocketGroup={{ forgejo_runner_podman_socket_group }}
      SocketMode={{ forgejo_runner_podman_socket_mode }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart Podman socket

- name: Enable the rootful Podman socket
  ansible.builtin.systemd_service:
    name: podman.socket
    enabled: true
    state: started
    daemon_reload: true

- name: Inspect Podman socket ownership
  ansible.builtin.stat:
    path: /run/podman/podman.sock
  register: forgejo_runner_podman_socket_stat

- name: Apply Podman socket ownership immediately
  ansible.builtin.systemd_service:
    name: podman.socket
    state: restarted
    daemon_reload: true
  when:
    - forgejo_runner_podman_socket_stat.stat.pw_name != 'root'
      or forgejo_runner_podman_socket_stat.stat.gr_name != forgejo_runner_podman_socket_group
      or forgejo_runner_podman_socket_stat.stat.mode != forgejo_runner_podman_socket_mode

- name: Create runner group
  ansible.builtin.group:
    name: "{{ item.group }}"
    system: true
  loop: "{{ forgejo_runner_selected_instances }}"
  when: item.user != 'root'

- name: Create runner user
  ansible.builtin.user:
    name: "{{ item.user }}"
    group: "{{ item.group }}"
    home: "{{ forgejo_runner_home }}"
    create_home: true
    system: true
    shell: /usr/sbin/nologin
  loop: "{{ forgejo_runner_selected_instances }}"
  when: item.user != 'root'

- name: Add runner users to Podman groups
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: "{{ item.supplementary_groups }}"
    append: true
  loop: "{{ forgejo_runner_selected_instances }}"
  when: item.user != 'root'

- name: Create runner home and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: runner
    group: runner
    mode: "0750"
  loop:
    - "{{ forgejo_runner_home }}"

- name: Build the pinned CEM runner image from the controller checkout
  block:
    - name: Create a temporary controller build directory
      ansible.builtin.tempfile:
        state: directory
        prefix: forgejo-runner-cem-
      delegate_to: localhost
      become: false
      register: forgejo_runner_cem_ci_temp

    - name: Verify the configured local CEM repository
      ansible.builtin.stat:
        path: "{{ forgejo_runner_cem_ci_controller_repository }}/.git"
      delegate_to: localhost
      become: false
      register: forgejo_runner_cem_ci_git

    - name: Require the local CEM repository checkout
      ansible.builtin.assert:
        that:
          - forgejo_runner_cem_ci_git.stat.exists
          - forgejo_runner_cem_ci_git.stat.isdir
        fail_msg: >-
          CEM_REPOSITORY_PATH must point to a local CEM checkout containing .git;
          refusing to clone or fall back to an unpinned source.
      delegate_to: localhost
      become: false

    - name: Resolve the pinned CEM commit
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ forgejo_runner_cem_ci_controller_repository }}"
          - rev-parse
          - --verify
          - "{{ forgejo_runner_cem_ci_version }}^{commit}"
      delegate_to: localhost
      become: false
      register: forgejo_runner_cem_ci_commit
      changed_when: false

    - name: Verify the pinned CEM build definition
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ forgejo_runner_cem_ci_controller_repository }}"
          - cat-file
          - -e
          - "{{ forgejo_runner_cem_ci_commit.stdout }}:ci/cem-ci/Dockerfile"
      delegate_to: localhost
      become: false
      changed_when: false

    - name: Archive only the pinned CEM build context
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ forgejo_runner_cem_ci_controller_repository }}"
          - archive
          - --format=tar
          - "--output={{ forgejo_runner_cem_ci_temp.path }}/cem-ci.tar"
          - "{{ forgejo_runner_cem_ci_commit.stdout }}"
          - ci/cem-ci
      delegate_to: localhost
      become: false
      changed_when: true

    - name: Extract the pinned CEM build context on the controller
      ansible.builtin.unarchive:
        src: "{{ forgejo_runner_cem_ci_temp.path }}/cem-ci.tar"
        dest: "{{ forgejo_runner_cem_ci_temp.path }}"
        remote_src: true
      delegate_to: localhost
      become: false

    - name: Create the temporary remote CEM build context
      ansible.builtin.file:
        path: "{{ forgejo_runner_cem_ci_remote_context }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy the pinned CEM build context to the runner
      ansible.builtin.copy:
        src: "{{ forgejo_runner_cem_ci_temp.path }}/ci/cem-ci/"
        dest: "{{ forgejo_runner_cem_ci_remote_context }}/"
        owner: root
        group: root
        mode: "0644"

    - name: Build cem-ci from the pinned context
      ansible.builtin.command:
        cmd: "podman build --pull=missing --tag {{ forgejo_runner_cem_ci_image }} -f Dockerfile ."
        chdir: "{{ forgejo_runner_cem_ci_remote_context }}"
      register: forgejo_runner_cem_ci_build
      changed_when: true

    - name: Verify the cem-ci image exists
      ansible.builtin.command:
        cmd: "podman image exists {{ forgejo_runner_cem_ci_image }}"
      register: forgejo_runner_cem_ci_image_check
      changed_when: false

    - name: Remove the temporary remote CEM build context
      ansible.builtin.file:
        path: "{{ forgejo_runner_cem_ci_remote_context }}"
        state: absent
      when:
        - forgejo_runner_cem_ci_build.rc == 0
        - forgejo_runner_cem_ci_image_check.rc == 0
  always:
    - name: Remove the temporary controller CEM build context
      ansible.builtin.file:
        path: "{{ forgejo_runner_cem_ci_temp.path }}"
        state: absent
      delegate_to: localhost
      become: false
      when: forgejo_runner_cem_ci_temp is defined
  when: forgejo_runner_build_cem_ci | bool

- name: Download Forgejo Runner
  ansible.builtin.get_url:
    url: "https://code.forgejo.org/forgejo/runner/releases/download/v{{ forgejo_runner_version }}/forgejo-runner-{{ forgejo_runner_version }}-linux-{{ forgejo_runner_arch }}"
    dest: "{{ forgejo_runner_binary }}"
    checksum: "{{ forgejo_runner_checksum }}"
    owner: root
    group: root
    mode: "0755"
    force: true

- name: Deploy runner configurations
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ instance.config_file }}"
    owner: "{{ instance.config_owner }}"
    group: "{{ instance.config_group }}"
    mode: "0600"
  loop: "{{ forgejo_runner_selected_instances }}"
  loop_control:
    loop_var: instance
  vars:
    runner_instance: "{{ instance }}"
  no_log: true
  notify: Restart Forgejo Runner instances

- name: Install runner services
  ansible.builtin.template:
    src: forgejo-runner.service.j2
    dest: "/etc/systemd/system/{{ instance.service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ forgejo_runner_selected_instances }}"
  loop_control:
    loop_var: instance
  vars:
    runner_instance: "{{ instance }}"
  notify: Restart Forgejo Runner instances

- name: Enable and set runner services to the requested state
  ansible.builtin.systemd_service:
    name: "{{ item.service_name }}.service"
    enabled: "{{ forgejo_runner_service_enabled }}"
    state: "{{ forgejo_runner_service_state }}"
    daemon_reload: true
  loop: "{{ forgejo_runner_selected_instances }}"
