---
- name: Require a Linux runner host
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
    fail_msg: "The Forgejo runner role supports Linux hosts only."

- name: Install runner and Podman prerequisites
  ansible.builtin.package:
    name: "{{ forgejo_runner_packages }}"
    state: "{{ forgejo_runner_package_state }}"

- name: Create runner group
  ansible.builtin.group:
    name: "{{ item.group }}"
    system: true
  loop: "{{ forgejo_runner_instances }}"
  when: item.user != 'root'

- name: Create runner user
  ansible.builtin.user:
    name: "{{ item.user }}"
    group: "{{ item.group }}"
    home: "{{ forgejo_runner_home }}"
    create_home: true
    system: true
    shell: /usr/sbin/nologin
  loop: "{{ forgejo_runner_instances }}"
  when: item.user != 'root'

- name: Add runner users to Podman groups
  ansible.builtin.user:
    name: "{{ item.user }}"
    groups: "{{ item.supplementary_groups }}"
    append: true
  loop: "{{ forgejo_runner_instances }}"
  when: item.user != 'root'

- name: Create runner home and config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: runner
    group: runner
    mode: "0750"
  loop:
    - "{{ forgejo_runner_home }}"
    - /etc/forgejo-runner
    - "{{ forgejo_runner_home }}/logs"

- name: Download Forgejo Runner
  ansible.builtin.get_url:
    url: "https://code.forgejo.org/forgejo/runner/releases/download/v{{ forgejo_runner_version }}/forgejo-runner-{{ forgejo_runner_version }}-linux-{{ forgejo_runner_arch }}"
    dest: "{{ forgejo_runner_binary }}"
    owner: root
    group: root
    mode: "0755"
    force: true

- name: Deploy runner configurations
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ item.config_file }}"
    owner: "{{ item.config_owner }}"
    group: "{{ item.config_group }}"
    mode: "0600"
  loop: "{{ forgejo_runner_instances }}"
  loop_control:
    loop_var: instance
  vars:
    runner_instance: "{{ instance }}"
  no_log: true
  notify: Restart Forgejo Runner

- name: Install runner services
  ansible.builtin.template:
    src: forgejo-runner.service.j2
    dest: "/etc/systemd/system/{{ item.service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ forgejo_runner_instances }}"
  loop_control:
    loop_var: instance
  vars:
    runner_instance: "{{ instance }}"
  notify: Restart Forgejo Runner

- name: Enable and set runner services to the requested state
  ansible.builtin.systemd_service:
    name: "{{ item.service_name }}.service"
    enabled: "{{ forgejo_runner_service_enabled }}"
    state: "{{ forgejo_runner_service_state }}"
    daemon_reload: true
  loop: "{{ forgejo_runner_instances }}"

- name: Check for existing Forgejo registrations
  ansible.builtin.stat:
    path: "{{ item.state_file }}"
  loop: "{{ forgejo_runner_instances }}"
  register: forgejo_runner_registrations

- name: Report registration prerequisites
  ansible.builtin.debug:
    msg: "Register {{ item.item.name }} once in Forgejo, then keep {{ item.item.state_file }} outside Git."
  loop: "{{ forgejo_runner_registrations.results }}"
  when: not item.stat.exists
