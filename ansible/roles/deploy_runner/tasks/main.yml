---
- name: Require Debian 13
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Debian'
      - ansible_facts['distribution_major_version'] == '13'
    fail_msg: "The deployment runner is built for Debian 13 (trixie)."

- name: Require the runner registration and the scoped Proxmox token
  ansible.builtin.assert:
    that:
      - deploy_runner_connection_uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
      - deploy_runner_connection_uuid != '00000000-0000-0000-0000-000000000000'
      - deploy_runner_connection_token is match('^[0-9a-f]{40}$')
      - deploy_runner_proxmox_token is match('^' ~ (deploy_runner_proxmox_user | regex_escape) ~ '![A-Za-z0-9._-]+=\S+$')
    fail_msg: >-
      Export FORGEJO_RUNNER_UUID, FORGEJO_RUNNER_TOKEN (repository runner Homelab/homelab-iac) and
      DEPLOY_PROXMOX_VE_API_TOKEN for {{ deploy_runner_proxmox_user }} (e.g. infisical run --path /deploy-runner).
  no_log: true

- name: Install runner prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, git, make, python3, sudo, unzip]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Trust the doku-lab Proxmox root CA (TLS stays verified)
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../keys/pve-management-root-ca.crt"
    dest: /usr/local/share/ca-certificates/doku-lab-pve-root-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: deploy_runner_ca

- name: Refresh the system trust store
  ansible.builtin.command: update-ca-certificates
  when: deploy_runner_ca is changed
  changed_when: true

- name: Fetch OpenTofu, verified against the pinned SHA256
  ansible.builtin.get_url:
    url: "https://github.com/opentofu/opentofu/releases/download/v{{ opentofu_version }}/tofu_{{ opentofu_version }}_linux_amd64.zip"
    dest: "/var/tmp/tofu_{{ opentofu_version }}_linux_amd64.zip"
    checksum: "sha256:{{ opentofu_sha256 }}"
    mode: "0600"

- name: Create the OpenTofu version directory
  ansible.builtin.file:
    path: "/opt/opentofu/{{ opentofu_version }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Unpack the pinned OpenTofu binary
  ansible.builtin.unarchive:
    src: "/var/tmp/tofu_{{ opentofu_version }}_linux_amd64.zip"
    dest: "/opt/opentofu/{{ opentofu_version }}"
    remote_src: true
    include: [tofu]
    creates: "/opt/opentofu/{{ opentofu_version }}/tofu"

- name: Point /usr/local/bin/tofu at the pinned version
  ansible.builtin.file:
    src: "/opt/opentofu/{{ opentofu_version }}/tofu"
    dest: /usr/local/bin/tofu
    state: link

- name: Download Forgejo Runner, verified against the pinned SHA256
  ansible.builtin.get_url:
    url: "https://code.forgejo.org/forgejo/runner/releases/download/v{{ deploy_runner_version }}/forgejo-runner-{{ deploy_runner_version }}-linux-amd64"
    dest: "{{ deploy_runner_binary }}"
    checksum: "{{ deploy_runner_checksum }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart deploy runner

- name: Create the job user (no credentials) and the deployment user
  ansible.builtin.user:
    name: "{{ item.name }}"
    home: "{{ item.home }}"
    create_home: true
    system: true
    shell: /usr/sbin/nologin
  loop:
    - { name: runner, home: "{{ deploy_runner_home }}" }
    - { name: deploy, home: "{{ deploy_runner_base }}" }

- name: Create runner, deployment and configuration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ deploy_runner_home }}", owner: runner, group: runner, mode: "0750" }
    - { path: "{{ deploy_runner_home }}/work", owner: runner, group: runner, mode: "0750" }
    - { path: "{{ deploy_runner_config | dirname }}", owner: root, group: runner, mode: "0750" }
    - { path: "{{ deploy_runner_base }}", owner: deploy, group: deploy, mode: "0700" }
    - { path: "{{ deploy_runner_etc }}", owner: root, group: deploy, mode: "0750" }
    - { path: "{{ deploy_runner_etc }}/roots", owner: root, group: deploy, mode: "0750" }
    # Operator approvals (make deploy-runner-approve over SSH): root-owned, never writable by jobs or deploy.
    - { path: "{{ deploy_runner_etc }}/approvals", owner: root, group: root, mode: "0755" }

- name: Pre-create the deployment lock (held by the wrapper, checked before runner restarts)
  ansible.builtin.copy:
    dest: "{{ deploy_runner_base }}/lock"
    content: ""
    force: false
    owner: deploy
    group: deploy
    mode: "0600"

- name: Install an empty, root-owned OpenTofu CLI configuration (no dev_overrides, no mirrors)
  ansible.builtin.copy:
    dest: "{{ deploy_runner_etc }}/tofurc"
    content: "# Managed by Ansible (deploy_runner): intentionally empty; TF_CLI_CONFIG_FILE points here.\n"
    owner: root
    group: root
    mode: "0644"

- name: Deploy the runner configuration (registration secret)
  ansible.builtin.template:
    src: config.yml.j2
    dest: "{{ deploy_runner_config }}"
    owner: root
    group: runner
    mode: "0640"
  no_log: true
  diff: false
  notify: Restart deploy runner

- name: Install the scoped Proxmox token, readable only by the deployment user
  ansible.builtin.copy:
    dest: "{{ deploy_runner_etc }}/proxmox.env"
    content: "PROXMOX_VE_API_TOKEN={{ deploy_runner_proxmox_token }}\n"
    owner: root
    group: deploy
    mode: "0640"
  no_log: true
  diff: false

- name: Install the root inputs
  ansible.builtin.template:
    src: root.tfvars.j2
    dest: "{{ deploy_runner_etc }}/roots/{{ item.key }}.tfvars"
    owner: root
    group: deploy
    mode: "0640"
  loop: "{{ deploy_runner_roots | dict2items }}"

- name: Install the wrapper configuration
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ deploy_runner_etc }}/config.json"
    owner: root
    group: deploy
    mode: "0640"

- name: Install the main-only deployment wrapper
  ansible.builtin.copy:
    src: homelab-deploy
    dest: /usr/local/sbin/homelab-deploy
    owner: root
    group: root
    mode: "0755"

- name: Allow the job user to run only the wrapper, as the deployment user
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/homelab-deploy
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: Install the runner service
  ansible.builtin.template:
    src: forgejo-runner.service.j2
    dest: /etc/systemd/system/forgejo-runner.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart deploy runner

- name: Enable and start the runner
  ansible.builtin.systemd_service:
    name: forgejo-runner.service
    enabled: true
    state: started
    daemon_reload: true
