# LAN listening and native verify-full TLS remain a separate production gate.
# Disposable clients use authenticated SSH forwarding to this loopback listener.
listen_addresses = '127.0.0.1'
password_encryption = 'scram-sha-256'
max_connections = 30
shared_buffers = '128MB'
fsync = on
full_page_writes = on
synchronous_commit = on
