---
# `nft -f`: the service's restart would run "flush ruleset" first and take Docker's rules with it.
- name: Reload media firewall
  ansible.builtin.command:
    argv: [/usr/sbin/nft, -f, /etc/nftables.conf]
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Rebuild the initramfs
  ansible.builtin.command:
    argv: [update-initramfs, -u]
  changed_when: true
  notify: Reboot for the graphics driver

- name: Reboot for the graphics driver
  ansible.builtin.reboot:
    reboot_timeout: 300
