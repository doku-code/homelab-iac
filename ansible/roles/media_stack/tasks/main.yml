---
# Media stack on media-01 (TASK-036). Order matters: the data disk is mounted before anything is written
# below it, and no container starts when it is not (a missing disk must never become writes to the system disk).
- name: Refuse to continue without the pinned images and the credentials
  ansible.builtin.assert:
    that:
      - (media_images.keys() | sort) == ['jellyfin', 'prowlarr', 'qbittorrent', 'radarr', 'seerr', 'sonarr']
      - media_images.values() | select('search', ':latest$|^[^:]+$') | list | length == 0
      - media_admin_password | length >= 32
      - media_api_keys.values() | map('length') | min >= 32
      - media_database_passwords.values() | map('length') | min >= 32
      - media_nas_libraries | length == 0 or media_nas_export | length > 0
    fail_msg: "Pin every image in ansible/vars/media.yml and set the secrets (store paths /media and /postgresql; make media-secrets)."
  no_log: true

- name: Refuse to continue without the data disk
  ansible.builtin.stat:
    path: "{{ media_data_device }}"
  register: media_data_disk
  failed_when: not media_data_disk.stat.exists

# firmware-intel-graphics (the graphics adapter's firmware) is in non-free-firmware, which the cloud image leaves out.
- name: Add the firmware component to the Debian sources
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: '^Components: main$'
    replace: 'Components: main non-free-firmware'
  when: media_gpu | bool

- name: Install Docker, the firewall and the tools of the archive
  ansible.builtin.apt:
    name: [docker.io, docker-cli, docker-compose, nftables, e2fsprogs, nfs-common, postgresql-client, sqlite3, zstd, curl]
    state: present
    update_cache: true

# Creates the filesystem only on an empty device; an existing one is only grown (never re-formatted).
- name: Create or grow the data filesystem
  community.general.filesystem:
    dev: "{{ media_data_device }}"
    fstype: ext4
    resizefs: true
    force: false

# nofail: without the disk the VM still boots and answers SSH; Docker itself then refuses to start (below).
- name: Mount the data filesystem
  ansible.posix.mount:
    path: "{{ media_root }}"
    src: "{{ media_data_device }}"
    fstype: ext4
    opts: defaults,noatime,discard,nofail
    state: mounted

- name: Create the drop-in directory for Docker
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# No data disk, no Docker: no container can then write its configuration or a download to the system disk.
- name: Tie Docker to the data filesystem
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/10-media-data.conf
    content: |
      # Managed by Ansible (role media_stack)
      [Unit]
      RequiresMountsFor={{ media_root }}
      ConditionPathIsMountPoint={{ media_root }}
      {% if media_gpu %}
      # The graphics driver creates its device several seconds after Docker would start: without this wait
      # Jellyfin is refused its device at boot and stays stopped (seen on 2026-11-26). Wants, not Requires:
      # without the device Docker starts after the wait, and only Jellyfin fails, visibly.
      Wants={{ media_gpu_render_device | replace('/dev/', 'dev-') | replace('/', '-') }}.device
      After={{ media_gpu_render_device | replace('/dev/', 'dev-') | replace('/', '-') }}.device
      {% endif %}
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Create the group of the applications
  ansible.builtin.group:
    name: "{{ media_user }}"
    gid: "{{ media_gid }}"

- name: Create the user of the applications
  ansible.builtin.user:
    name: "{{ media_user }}"
    uid: "{{ media_uid }}"
    group: "{{ media_user }}"
    shell: /usr/sbin/nologin
    create_home: false

- name: Create the configuration and cache directories
  ansible.builtin.file:
    path: "{{ media_root }}/{{ item }}"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0750"
  loop: [config, config/jellyfin, config/seerr, config/radarr, config/sonarr, config/prowlarr, config/qbittorrent, cache, cache/jellyfin]

# setgid and group-writable: what one application writes, the others may read, link and move.
- name: Create the test area
  ansible.builtin.file:
    path: "{{ media_root }}/{{ item }}"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "2775"
  loop: "{{ ['data', 'data/media'] + media_test_dirs }}"

- name: Say what the test area is, where one would look
  ansible.builtin.copy:
    dest: "{{ media_root }}/data/README-TEST-AREA.txt"
    content: |
      TEST AREA of the media stack (homelab-iac, TASK-036). Managed by Ansible.
      torrents/            what qBittorrent downloads
      media/test-movies/   what Radarr imports (hard links to torrents/)
      media/test-series/   what Sonarr imports
      Nothing here is on the NAS and nothing here is the Plex library. Safe to empty.
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0644"

- name: Create the directory of the archives
  ansible.builtin.file:
    path: "{{ media_root }}/backups"
    state: directory
    owner: root
    group: root
    mode: "0700"

# ── Graphics adapter (when the VM has it): driver firmware, GuC/HuC loading, a reboot when either changed.
- name: Install the graphics firmware and tools
  ansible.builtin.apt:
    name: [firmware-intel-graphics, intel-gpu-tools]
    state: present
  when: media_gpu | bool
  notify: Rebuild the initramfs

# Jasper Lake encodes in low-power mode only, which needs the HuC firmware loaded by the driver.
- name: Load the GuC and HuC firmware
  ansible.builtin.copy:
    dest: /etc/modprobe.d/i915.conf
    content: |
      # Managed by Ansible (role media_stack)
      options i915 enable_guc=2
    owner: root
    group: root
    mode: "0644"
  when: media_gpu | bool
  notify: Rebuild the initramfs

# systemd only knows devices that udev tags for it; the render device is not tagged by default.
- name: Let systemd wait for the render device
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-media-render-device.rules
    content: |
      # Managed by Ansible (role media_stack): docker.service waits for this device at boot.
      SUBSYSTEM=="drm", KERNEL=="{{ media_gpu_render_device | basename }}", TAG+="systemd"
    owner: root
    group: root
    mode: "0644"
  when: media_gpu | bool
  notify: Rebuild the initramfs

- name: Forget the wait when the VM has no graphics adapter
  ansible.builtin.file:
    path: /etc/udev/rules.d/70-media-render-device.rules
    state: absent
  when: not (media_gpu | bool)

- name: Apply a pending driver change before the containers start
  ansible.builtin.meta: flush_handlers

- name: Refuse to continue without the render device
  ansible.builtin.stat:
    path: "{{ media_gpu_render_device }}"
  register: media_render_device
  failed_when: not media_render_device.stat.exists
  when: media_gpu | bool

- name: Read the group of the render device
  ansible.builtin.set_fact:
    media_render_gid: "{{ media_render_device.stat.gid }}"
  when: media_gpu | bool

# ── Firewall
- name: Restrict the administration tools to the ingress
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  vars:
    media_lan_interface: "{{ ansible_facts.default_ipv4.interface }}"
  notify: Reload media firewall

# The unit's stop action is "flush ruleset", which would remove Docker's rules: enabled for the boot, where
# it runs before Docker, and never restarted (the handler loads the file instead).
- name: Enable the firewall at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
    daemon_reload: true

- name: Load the firewall now
  ansible.builtin.meta: flush_handlers

# ── Compose project
- name: Create the project directory
  ansible.builtin.file:
    path: "{{ media_project_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Write the secrets of the project
  ansible.builtin.template:
    src: env.j2
    dest: "{{ media_project_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Write the Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ media_project_dir }}/compose.yml"
    owner: root
    group: root
    mode: "0640"
    validate: docker compose --env-file {{ media_project_dir }}/.env -f %s config --quiet

# qBittorrent's password is stored as PBKDF2-HMAC-SHA512 (100000 rounds); the salt is derived from the
# password so the same password gives the same line. Computed on the controller, never logged.
- name: Derive qBittorrent's password line
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import base64, hashlib, os
        password = os.environ["MEDIA_ADMIN_PASSWORD"].encode()
        salt = hashlib.sha256(b"qbittorrent-webui:" + password).digest()[:16]
        key = hashlib.pbkdf2_hmac("sha512", password, salt, 100000)
        print(base64.b64encode(salt).decode() + ":" + base64.b64encode(key).decode())
  environment:
    MEDIA_ADMIN_PASSWORD: "{{ media_admin_password }}"
  delegate_to: localhost
  become: false
  changed_when: false
  check_mode: false
  register: media_qbittorrent_derived
  no_log: true

- name: Create qBittorrent's configuration directory
  ansible.builtin.file:
    path: "{{ media_root }}/config/qbittorrent/qBittorrent/config"
    state: directory
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0750"

# Only when the file does not exist: qBittorrent rewrites it, and later changes are made in its interface.
- name: Give qBittorrent its first configuration
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ media_root }}/config/qbittorrent/qBittorrent/config/qBittorrent.conf"
    owner: "{{ media_user }}"
    group: "{{ media_user }}"
    mode: "0640"
    force: false
  vars:
    media_qbittorrent_hash: "{{ media_qbittorrent_derived.stdout }}"
  no_log: true

- name: Start the applications
  community.docker.docker_compose_v2:
    project_src: "{{ media_project_dir }}"
    files: [compose.yml]
    state: present
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: 600
  tags: [compose]

# ── Connections between the applications (their own APIs, from the VM itself; idempotent). The script redacts
# every credential from what it prints, so its output may be shown.
- name: Connect the applications to each other
  ansible.builtin.script:
    cmd: media-configure.py
    executable: python3
  environment:
    MEDIA_ADMIN_USER: "{{ media_admin_user }}"
    MEDIA_ADMIN_PASSWORD: "{{ media_admin_password }}"
    RADARR_API_KEY: "{{ media_api_keys.radarr }}"
    SONARR_API_KEY: "{{ media_api_keys.sonarr }}"
    PROWLARR_API_KEY: "{{ media_api_keys.prowlarr }}"
    SEERR_API_KEY: "{{ media_api_keys.seerr }}"
    MEDIA_TEST_MOVIES: "{{ media_test_movies }}"
    MEDIA_TEST_SERIES: "{{ media_test_series }}"
    MEDIA_NAS_LIBRARIES: "{{ (media_nas_libraries if media_nas_export else []) | to_json }}"
    MEDIA_GPU: "{{ 'yes' if media_gpu else 'no' }}"
    MEDIA_GPU_DEVICE: "{{ media_gpu_render_device }}"
    MEDIA_URL: "{{ media_url }}"
    MEDIA_JELLYFIN_URL: "{{ media_jellyfin_url }}"
  register: media_connections
  changed_when: "'changed: ' in media_connections.stdout"
  tags: [connect]

- name: Show what was connected
  ansible.builtin.debug:
    msg: "{{ media_connections.stdout_lines }}"
  tags: [connect]

# ── Status and archive
- name: Install the status and archive commands
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/usr/local/sbin/{{ item }}"
    owner: root
    group: root
    mode: "0750"
  loop: [media-status, media-backup]

- name: Install the nightly archive
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [media-backup.service, media-backup.timer]
  notify: Reload systemd

- name: Apply the unit changes
  ansible.builtin.meta: flush_handlers

- name: Enable the nightly archive
  ansible.builtin.systemd_service:
    name: media-backup.timer
    enabled: true
    state: started
