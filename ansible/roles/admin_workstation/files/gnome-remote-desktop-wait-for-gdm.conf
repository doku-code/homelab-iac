# Managed by homelab-iac: with the passed-through GPU, GDM needs ~30 s at boot and the system daemon
# gives up after 25 s without retrying (RDP then never listens). Wait for the GDM greeter first.
[Unit]
After=gdm.service
[Service]
TimeoutStartSec=180
ExecStartPre=/bin/sh -c 'for i in $(seq 1 120); do loginctl list-sessions --no-legend | grep -q " greeter " && exit 0; sleep 1; done; echo "GDM greeter not seen after 120 s, starting anyway"'
