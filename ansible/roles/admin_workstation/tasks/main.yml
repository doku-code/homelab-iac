---
# Admin workstation (ADR-009): GNOME desktop, developer tooling, remote login over RDP.
# Secrets: the desktop and RDP passwords come from .local files on the controller and reach the guest only on
# stdin (never in argv or logs, no_log). Each is set once: a rerun never resets an existing credential.
# A run without those files installs everything and reports which credential is still unset;
# the operator then sets it on the guest itself (command printed at the end).
# Every task is safe to rerun after a partial failure; a second run must report no changes.

- name: Read the admin user's password status
  ansible.builtin.command:
    argv: [passwd, --status, "{{ admin_workstation_user }}"]
  register: admin_workstation_password
  changed_when: false

- name: Install workstation packages
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ admin_workstation_apt }}"
    state: present

# --- Desktop session --------------------------------------------------------------------------

- name: Read the default systemd target
  ansible.builtin.command:
    argv: [systemctl, get-default]
  register: admin_workstation_target
  changed_when: false

- name: Boot into the graphical target
  ansible.builtin.command:
    argv: [systemctl, set-default, graphical.target]
  changed_when: true
  when: admin_workstation_target.stdout != 'graphical.target'

# Cloud-init only installs an SSH key; GDM needs a password. Set it once, never overwrite it.
# SSH stays key-only (sshd drop-in in the playbook), so this password never opens SSH.
- name: Set the desktop login password when the account has none
  ansible.builtin.command: chpasswd
  args:
    stdin: "{{ admin_workstation_user }}:{{ mgmt_desktop_password }}"
  no_log: true
  changed_when: true
  when:
    - admin_workstation_password.stdout.split()[1] != 'P'
    - (mgmt_desktop_password | default('')) | length > 0

# --- Docker -----------------------------------------------------------------------------------

- name: Let the admin user run Docker
  ansible.builtin.user:
    name: "{{ admin_workstation_user }}"
    groups: [docker]
    append: true
  when: admin_workstation_docker_group | bool

# --- Flatpak GUI applications ------------------------------------------------------------------
# System installation (root, /var/lib/flatpak): shared by every account, needs no user D-Bus session,
# and is updated by `flatpak update` or GNOME Software. The modules are idempotent (state: present).

- name: Add the Flathub remote
  community.general.flatpak_remote:
    name: flathub
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
    method: system
    state: present

- name: Install GUI applications from Flathub
  community.general.flatpak:
    name: "{{ admin_workstation_flatpaks }}"
    remote: flathub
    method: system
    state: present

# --- mise: language runtimes and versioned CLIs ---------------------------------------------------

- name: Install the mise apt key (pinned by SHA256)
  ansible.builtin.get_url:
    url: "{{ admin_workstation_mise_signing_url }}"
    dest: /etc/apt/keyrings/mise-archive-keyring.asc
    checksum: "sha256:{{ admin_workstation_mise_signing_sha256 }}"
    mode: "0644"

- name: Add the mise apt repository
  ansible.builtin.deb822_repository:
    name: mise
    types: [deb]
    uris: ["{{ admin_workstation_mise_repo }}"]
    suites: [stable]
    components: [main]
    architectures: [amd64]
    signed_by: /etc/apt/keyrings/mise-archive-keyring.asc

- name: Install mise
  ansible.builtin.apt:
    update_cache: true
    name: mise
    state: present

- name: Create the admin user's mise configuration directory
  ansible.builtin.file:
    path: "/home/{{ admin_workstation_user }}/.config/mise"
    state: directory
    owner: "{{ admin_workstation_user }}"
    group: "{{ admin_workstation_user }}"
    mode: "0755"

- name: Declare the admin user's global tools
  ansible.builtin.copy:
    dest: "/home/{{ admin_workstation_user }}/.config/mise/config.toml"
    owner: "{{ admin_workstation_user }}"
    group: "{{ admin_workstation_user }}"
    mode: "0644"
    content: |
      # Managed by homelab-iac (ansible/roles/admin_workstation). Edit the role catalog instead.
      [tools]
      {% for tool, version in admin_workstation_mise_tools.items() %}
      "{{ tool }}" = "{{ version }}"
      {% endfor %}

# The mise steps run as the admin user (tools live in ~/.local/share/mise), never as root.
- name: Find declared tools that are not installed yet
  become: true
  become_user: "{{ admin_workstation_user }}"
  ansible.builtin.command:
    argv: [mise, install, --dry-run-code]
    chdir: "/home/{{ admin_workstation_user }}"
  environment:
    HOME: "/home/{{ admin_workstation_user }}"
  register: admin_workstation_mise_missing
  changed_when: false
  failed_when: admin_workstation_mise_missing.rc not in [0, 1]

- name: Install the missing tools
  become: true
  become_user: "{{ admin_workstation_user }}"
  ansible.builtin.command:
    argv: [mise, install, --yes]
    chdir: "/home/{{ admin_workstation_user }}"
  environment:
    HOME: "/home/{{ admin_workstation_user }}"
  changed_when: true
  when: admin_workstation_mise_missing.rc == 1

- name: Verify every declared tool is installed
  become: true
  become_user: "{{ admin_workstation_user }}"
  ansible.builtin.command:
    argv: [mise, install, --dry-run-code]
    chdir: "/home/{{ admin_workstation_user }}"
  environment:
    HOME: "/home/{{ admin_workstation_user }}"
  changed_when: false

- name: Activate mise in interactive shells
  ansible.builtin.lineinfile:
    path: "/home/{{ admin_workstation_user }}/.bashrc"
    line: 'eval "$(mise activate bash)"'
    create: true
    owner: "{{ admin_workstation_user }}"
    group: "{{ admin_workstation_user }}"
    mode: "0644"

# --- Firewall: RDP only from trusted networks, SSH always open (key-only) ------------------------
# Rules are added before the default policy and activation, so enabling never cuts the SSH session.

- name: Keep SSH reachable independently of RDP
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    comment: ssh (key-only, independent access path)

- name: Allow RDP from the trusted management networks only
  community.general.ufw:
    rule: allow
    port: "3389"
    proto: tcp
    from_ip: "{{ item }}"
    comment: rdp (GNOME Remote Login)
  loop: "{{ admin_workstation_rdp_allowed_networks }}"
  when: admin_workstation_rdp | bool

- name: Deny other incoming traffic and enable the firewall
  community.general.ufw:
    state: enabled
    default: deny
    direction: incoming

# --- Remote login over RDP: GNOME Remote Login in system (headless login) mode -------------------
# `grdctl --system` configures the system daemon (gnome-remote-desktop.service, user
# gnome-remote-desktop) that serves the GDM login screen; it is not per-user desktop sharing.
# grdctl --system re-executes itself through pkexec and exits 0 even when the sub-command fails
# (gnome-remote-desktop 50.2 src/grd-ctl.c), so the result is checked by re-reading the status.

- name: Ensure the remote login service directory exists
  ansible.builtin.file:
    path: "{{ admin_workstation_rdp_dir }}"
    state: directory
    owner: gnome-remote-desktop
    group: gnome-remote-desktop
  when: admin_workstation_rdp | bool

- name: Create a self-signed TLS certificate for remote login
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:4096
      - -sha256
      - -days
      - "3650"
      - -nodes
      - -subj
      - "/CN={{ inventory_hostname }}"
      - -keyout
      - "{{ admin_workstation_rdp_dir }}/rdp-tls.key"
      - -out
      - "{{ admin_workstation_rdp_dir }}/rdp-tls.crt"
    creates: "{{ admin_workstation_rdp_dir }}/rdp-tls.crt"
  when: admin_workstation_rdp | bool

- name: Restrict the remote login TLS files to the gnome-remote-desktop service
  ansible.builtin.file:
    path: "{{ admin_workstation_rdp_dir }}/{{ item.name }}"
    owner: gnome-remote-desktop
    group: gnome-remote-desktop
    mode: "{{ item.mode }}"
  loop:
    - {name: rdp-tls.key, mode: "0600"}
    - {name: rdp-tls.crt, mode: "0644"}
  when: admin_workstation_rdp | bool

- name: Read the remote login status
  ansible.builtin.command:
    argv: [grdctl, --system, status]
  register: admin_workstation_rdp_status
  changed_when: false
  when: admin_workstation_rdp | bool

- name: Point remote login at the TLS certificate and key
  ansible.builtin.command:
    argv: [grdctl, --system, rdp, "{{ item.action }}", "{{ admin_workstation_rdp_dir }}/{{ item.file }}"]
  loop:
    - {action: set-tls-cert, file: rdp-tls.crt, line: TLS certificate}
    - {action: set-tls-key, file: rdp-tls.key, line: TLS key}
  changed_when: true
  notify: Restart gnome-remote-desktop
  when:
    - admin_workstation_rdp | bool
    - "(item.line ~ ': ' ~ admin_workstation_rdp_dir ~ '/' ~ item.file) not in admin_workstation_rdp_status.stdout_lines | map('trim') | list"

# grdctl prompts for the password on a terminal only (a plain pipe stores an empty one), so `script`
# gives it a pseudo-terminal fed from stdin: the password never appears in argv or logs.
- name: Set the remote login credentials once
  ansible.builtin.command:
    argv: [script, --quiet, --return, --command, "grdctl --system rdp set-credentials {{ admin_workstation_user }}", /dev/null]
    stdin: "{{ mgmt_rdp_password }}"
  no_log: true
  changed_when: true
  notify: Restart gnome-remote-desktop
  when:
    - admin_workstation_rdp | bool
    - (mgmt_rdp_password | default('')) | length > 0
    - "admin_workstation_rdp_status.stdout is search('(Username|Password): \\(empty\\)')"

- name: Enable remote login over RDP
  ansible.builtin.command:
    argv: [grdctl, --system, rdp, enable]
  changed_when: true
  notify: Restart gnome-remote-desktop
  when:
    - admin_workstation_rdp | bool
    - "'Status: enabled' not in admin_workstation_rdp_status.stdout_lines | map('trim') | list"

- name: Verify the remote login configuration
  ansible.builtin.command:
    argv: [grdctl, --system, status]
  register: admin_workstation_rdp_final
  changed_when: false
  failed_when: >-
    admin_workstation_rdp_final.rc != 0
    or 'Status: enabled' not in admin_workstation_rdp_final.stdout_lines | map('trim') | list
    or ('TLS certificate: ' ~ admin_workstation_rdp_dir ~ '/rdp-tls.crt') not in admin_workstation_rdp_final.stdout_lines | map('trim') | list
    or ('TLS key: ' ~ admin_workstation_rdp_dir ~ '/rdp-tls.key') not in admin_workstation_rdp_final.stdout_lines | map('trim') | list
  when: admin_workstation_rdp | bool

- name: Run the remote login service
  ansible.builtin.systemd_service:
    name: gnome-remote-desktop.service
    enabled: true
    state: started
  when: admin_workstation_rdp | bool

# --- Display adapter with a passed-through GPU --------------------------------------------------
# With the host's Intel GPU passed through (TASK-028), GNOME made that GPU its primary display although no
# screen is attached to it: the Proxmox console froze on the splash screen and remote login never opened
# 3389. This rule keeps the virtual console adapter (bochs-drm) primary; the GPU still renders. Applying a
# change restarts GDM, which ends every desktop and RDP session: run mgmt-configure from SSH, not from RDP.

- name: Keep the console adapter as GNOME's primary display
  ansible.builtin.copy:
    dest: "{{ admin_workstation_gpu_rule }}"
    content: |
      # Managed by homelab-iac: the virtual console adapter stays the primary display; the passed-through
      # Intel GPU only renders (it has no screen attached).
      SUBSYSTEM=="drm", KERNEL=="card[0-9]*", DRIVERS=="bochs-drm", TAG+="mutter-device-preferred-primary"
    owner: root
    group: root
    mode: "0644"
  notify: &display_handlers
    - Reload udev rules for the display adapters
    - Restart GDM
    - Restart gnome-remote-desktop
  when: admin_workstation_gpu_passthrough | bool

- name: Drop the primary display rule when no GPU is passed through
  ansible.builtin.file:
    path: "{{ admin_workstation_gpu_rule }}"
    state: absent
  notify: *display_handlers
  when: not (admin_workstation_gpu_passthrough | bool)

# GDM must run for remote login: set-default only applies at the next boot.
- name: Run the display manager now
  ansible.builtin.systemd_service:
    name: display-manager.service
    state: started

- name: Show the RDP certificate fingerprint to compare in Thincast on first connection
  ansible.builtin.debug:
    msg: "{{ admin_workstation_rdp_final.stdout_lines | map('trim') | list | select('match', 'TLS fingerprint:') | list }}"
  when: admin_workstation_rdp | bool

- name: Re-read the admin user's password status
  ansible.builtin.command:
    argv: [passwd, --status, "{{ admin_workstation_user }}"]
  register: admin_workstation_password_final
  changed_when: false

- name: Report credentials that are still unset
  ansible.builtin.debug:
    msg: >-
      ACTION REQUIRED on the guest (interactive, nothing is echoed or stored):
      {{ 'Linux/desktop password: sudo passwd ' ~ admin_workstation_user ~ '. '
         if admin_workstation_password_final.stdout.split()[1] != 'P' else '' }}
      {{ 'RDP password: sudo grdctl --system rdp set-credentials ' ~ admin_workstation_user
         ~ ' && sudo systemctl restart gnome-remote-desktop.service'
         if admin_workstation_rdp | bool and admin_workstation_rdp_final.stdout is search('(Username|Password): \(empty\)') else '' }}
  when: >-
    admin_workstation_password_final.stdout.split()[1] != 'P'
    or (admin_workstation_rdp | bool and admin_workstation_rdp_final.stdout is search('(Username|Password): \(empty\)'))
