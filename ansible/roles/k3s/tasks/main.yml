---
- name: Require Debian 13 without swap
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version == '13'
      - ansible_facts.architecture == 'x86_64'
      - ansible_facts.swaptotal_mb == 0
      - k3s_role in ['server', 'agent']
    fail_msg: k3s nodes are Debian 13 x86_64 VMs without swap (terraform/stacks/k3s).

- name: Require the cluster token from the environment
  ansible.builtin.assert:
    that:
      - k3s_token is match('^[0-9a-f]{64}$')
    fail_msg: Set K3S_TOKEN (64 hex) from Infisical dev:/k3s.
  no_log: true

- name: Install k3s host prerequisites
  ansible.builtin.apt:
    name: [iptables, nftables, conntrack, socat, curl]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Load and persist the kernel modules for the CNI
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: [overlay, br_netfilter]

- name: Enable forwarding for the CNI
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop: [net.ipv4.ip_forward, net.bridge.bridge-nf-call-iptables]

- name: Install the pinned k3s binary, verified by SHA256 (no upstream install script)
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s"
    checksum: "sha256:{{ k3s_sha256 }}"
    dest: /usr/local/bin/k3s
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: Link kubectl, crictl and ctr to k3s
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
  loop: [kubectl, crictl, ctr]

- name: Create the private configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write the k3s configuration (cluster token)
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  no_log: true
  diff: false
  notify: Restart k3s

- name: Create the server manifests directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/server/manifests
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: k3s_role == 'server'

- name: Keep client addresses on the bundled Traefik (ingress allow-lists)
  ansible.builtin.template:
    src: traefik-config.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
    owner: root
    group: root
    mode: "0600"
  when: k3s_role == 'server'

- name: Install the k3s service
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Enable and start k3s
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true

- name: Apply a pending restart before checking readiness
  ansible.builtin.meta: flush_handlers

- name: Wait for the API and the datastore
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, get, --raw=/readyz]
  register: k3s_readyz
  changed_when: false
  until: k3s_readyz.rc == 0 and k3s_readyz.stdout == 'ok'
  retries: 60
  delay: 5
  when: k3s_role == 'server'

- name: Wait until this node is Ready
  ansible.builtin.command:
    argv: [/usr/local/bin/k3s, kubectl, wait, "node/{{ inventory_hostname }}", --for=condition=Ready, --timeout=300s]
  changed_when: false
  delegate_to: "{{ k3s_init_node }}"
  register: k3s_node_ready
  until: k3s_node_ready.rc == 0
  retries: 12
  delay: 10
