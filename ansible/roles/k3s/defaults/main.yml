---
# k3s on doku-lab (ADR-011, M004). Same verified pin as the legacy Stage A role (ansible/vars/k3s-stage-a.yml).
k3s_version: v1.35.8+k3s1
k3s_sha256: 12f81c9bb5b71e098a4f7a2d187e350902a9339a6c3d5e56c20a03f7a417e07f

# Shared cluster secret: from the controller environment (store path /k3s, K3S_TOKEN), never from Git.
k3s_token: "{{ lookup('ansible.builtin.env', 'K3S_TOKEN') }}"

# The first server (OpenTofu output k3s_init_node) initialises embedded etcd; later servers join it.
k3s_init_node: "{{ groups['k3s_cluster'] | sort | first }}"
k3s_role: server
k3s_api_url: "https://{{ hostvars[k3s_init_node].ansible_host }}:6443"

# The address the cluster is reached at (API and ingress): held by one server at a time (kube-vip, ARP), so no
# single node carries the published names. In the k3s node range, outside the DHCP pool; NetBox records it.
# Empty: no shared address (a single server). Every server has the same interface name (Debian cloud image).
k3s_vip: 192.168.0.45
k3s_vip_interface: eth0
k3s_vip_image: ghcr.io/kube-vip/kube-vip:v1.3.2

# Ingress and load balancing (M004 decision): keep the bundled Traefik and ServiceLB for now.
k3s_disable: []
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Sign-in of people through Authentik (ADR-017, M014): the API servers accept identity tokens issued to this
# client. Names and groups get the prefix, so nothing a token says can collide with a built-in identity
# (system:masters, a node, a ServiceAccount). Rights come from RBAC only (services/headlamp/access.yaml).
# The issuer is looked up when a token arrives: the API starts and serves without Authentik. Empty: off.
k3s_oidc_issuer: https://auth.doku-lab.net/application/o/headlamp/
k3s_oidc_client_id: headlamp
k3s_oidc_prefix: "oidc:"
