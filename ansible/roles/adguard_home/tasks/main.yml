---
- name: Require Debian 13 and the admin password hash from the environment
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian' and ansible_facts.distribution_major_version == '13'
      - adguard_admin_hash is match('^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$')
      - adguard_service_address == '' or adguard_service_address is match('^192\.168\.0\.[0-9]{1,3}$')
    fail_msg: Set ADGUARD_ADMIN_HASH (bcrypt hash of the web login) from the store path /dns.
  no_log: true

- name: Install prerequisites
  ansible.builtin.apt:
    name: [nftables, iputils-arping, tar]
    state: present
    update_cache: true
    cache_valid_time: 3600

# systemd-resolved listens on 127.0.0.53:53; AdGuard Home needs port 53 on every address.
- name: Create the resolver drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Free port 53 from the local stub resolver
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/10-no-stub.conf
    content: |
      # Managed by Ansible (role adguard_home)
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-resolved

- name: Point the VM's own lookups at its configured resolvers
  ansible.builtin.file:
    src: /run/systemd/resolve/resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Apply the resolver change before downloading
  ansible.builtin.meta: flush_handlers

- name: Create the firewall drop-in directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Allow DNS and the web interface for the LAN only
  ansible.builtin.template:
    src: firewall.nft.j2
    dest: /etc/nftables.d/adguard.nft
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/nft -c -f %s
  notify: Reload firewall

- name: Load the firewall table at boot
  ansible.builtin.lineinfile:
    path: /etc/nftables.conf
    line: include "/etc/nftables.d/*.nft"
  notify: Reload firewall

- name: Enable nftables
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Create the service account
  ansible.builtin.user:
    name: adguard
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/adguardhome
    create_home: false

- name: Create the configuration and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: adguard
    group: adguard
    mode: "0700"
  loop: [/etc/adguardhome, /var/lib/adguardhome]

- name: Download the pinned AdGuard Home release, verified by SHA256
  ansible.builtin.get_url:
    url: "https://github.com/AdguardTeam/AdGuardHome/releases/download/{{ adguard_version }}/AdGuardHome_linux_amd64.tar.gz"
    checksum: "sha256:{{ adguard_sha256 }}"
    dest: "/opt/AdGuardHome-{{ adguard_version }}.tar.gz"
    owner: root
    group: root
    mode: "0644"
  register: adguard_download

- name: Unpack the release
  ansible.builtin.unarchive:
    src: "/opt/AdGuardHome-{{ adguard_version }}.tar.gz"
    dest: /opt
    remote_src: true
    owner: root
    group: root
  when: adguard_download is changed
  notify: Restart AdGuard Home

- name: Render the configuration from Git
  ansible.builtin.template:
    src: AdGuardHome.yaml.j2
    dest: /etc/adguardhome/desired.yaml
    owner: adguard
    group: adguard
    mode: "0600"
  no_log: true
  diff: false
  notify: Apply AdGuard configuration

- name: Install the service
  ansible.builtin.template:
    src: adguardhome.service.j2
    dest: /etc/systemd/system/adguardhome.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart AdGuard Home

- name: Hold the LAN's DNS address on this VM
  ansible.builtin.template:
    src: dns-service-address.service.j2
    dest: /etc/systemd/system/dns-service-address.service
    owner: root
    group: root
    mode: "0644"
  when: adguard_service_address != ''
  notify: Apply the service address

- name: Enable the service address
  ansible.builtin.systemd_service:
    name: dns-service-address
    enabled: true
    daemon_reload: true
  when: adguard_service_address != ''

- name: Apply configuration and firewall changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start AdGuard Home
  ansible.builtin.systemd_service:
    name: adguardhome
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for DNS and the web interface
  ansible.builtin.wait_for:
    port: "{{ item }}"
    timeout: 60
  loop: [53, 80]
