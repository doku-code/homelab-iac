---
- name: Rebuild initramfs
  ansible.builtin.command: update-initramfs -u -k all
  listen: Rebuild workstation boot configuration
  changed_when: true

- name: Regenerate GRUB configuration
  ansible.builtin.command: update-grub
  listen: Rebuild workstation boot configuration
  changed_when: true

- name: Inspect Proxmox-managed ESP configuration
  ansible.builtin.stat:
    path: /etc/kernel/proxmox-boot-uuids
  register: workstation_boot_esps
  listen: Rebuild workstation boot configuration

- name: Refresh configured Proxmox boot ESPs
  ansible.builtin.command: proxmox-boot-tool refresh
  when: workstation_boot_esps.stat.exists
  listen: Rebuild workstation boot configuration
  changed_when: true

- name: Reload workstation systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true
