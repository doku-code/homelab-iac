---
- name: Rebuild initramfs
  ansible.builtin.command:
    cmd: update-initramfs -u -k all
  listen: Rebuild workstation boot configuration
  changed_when: true

- name: Regenerate GRUB configuration
  ansible.builtin.command:
    cmd: update-grub
  listen: Rebuild workstation boot configuration
  changed_when: true

- name: Refresh Proxmox boot ESPs
  ansible.builtin.command:
    cmd: proxmox-boot-tool refresh
  listen: Rebuild workstation boot configuration
  register: proxmox_boot_refresh
  failed_when: false
  changed_when: proxmox_boot_refresh.rc == 0
