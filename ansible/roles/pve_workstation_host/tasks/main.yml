---
- name: Require reviewed host and explicit live maintenance approval
  ansible.builtin.assert:
    that:
      - ansible_facts['hostname'] == 'pve-lab'
      - pve_workstation_vm_names | length > 0
      - ansible_check_mode or (workstation_headless_approved | default(false) | bool)
    fail_msg: "Review headless maintenance; set workstation_headless_approved=true for live changes."

- name: Reconcile only reviewed workstation console and passthrough fields
  ansible.builtin.script:
    cmd: >-
      headless-vms.py {{ '--check' if ansible_check_mode else '--apply' }}
      {{ pve_workstation_vm_names | to_json | quote }}
    executable: /usr/bin/python3
  register: workstation_conversion
  check_mode: false
  changed_when: "'CHANGED' in workstation_conversion.stdout"

- name: Collect service facts before retiring GPU binding
  ansible.builtin.service_facts:

- name: Disable obsolete GPU binding without rebinding live devices
  ansible.builtin.systemd_service:
    name: pve-workstation-gpu-bind.service
    enabled: false
    state: stopped
  when: "'pve-workstation-gpu-bind.service' in ansible_facts.services"

- name: Remove only workstation-owned passthrough boot overrides
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/modprobe.d/99-pve-workstation-vfio.conf
    - /etc/default/grub.d/99-pve-workstation-vfio.cfg
  notify: Rebuild workstation boot configuration

- name: Remove marked VFIO initramfs block without changing other modules
  ansible.builtin.blockinfile:
    path: /etc/initramfs-tools/modules
    marker: "# {mark} ANSIBLE PVE WORKSTATION VFIO"
    state: absent
  notify: Rebuild workstation boot configuration

- name: Retire workstation binding and exclusivity provisioning artifacts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/pve-workstation-bind-gpu
    - /etc/systemd/system/pve-workstation-gpu-bind.service
    - /var/lib/vz/snippets/pve-workstation-exclusive.sh
  notify: Reload workstation systemd units

# Reboot is an operator-controlled maintenance step, never a handler.
