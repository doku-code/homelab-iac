---
# Runs on the current primary only, through the local socket as the postgres OS user. One database and
# one login role of the same name per application; nothing is dropped.
- name: Validate the application list and its passwords
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z][a-z0-9_]{1,30}$')
      - item.name not in ['postgres', 'replicator', 'rewinder', 'template0', 'template1', postgresql_app_group]
      - lookup('ansible.builtin.env', 'PG_APP_' + (item.name | upper) + '_PASSWORD') | length >= 32
    fail_msg: "Application {{ item.name }}: use a lowercase name and set PG_APP_{{ item.name | upper }}_PASSWORD (>= 32 characters)."
  loop: "{{ postgresql_apps }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Create the group role that marks application logins
  community.postgresql.postgresql_user:
    login_unix_socket: /var/run/postgresql
    login_db: postgres
    name: "{{ postgresql_app_group }}"
    role_attr_flags: NOLOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
  become: true
  become_user: postgres

- name: Create the application roles
  community.postgresql.postgresql_user:
    login_unix_socket: /var/run/postgresql
    login_db: postgres
    name: "{{ item.name }}"
    password: "{{ lookup('ansible.builtin.env', 'PG_APP_' + (item.name | upper) + '_PASSWORD') }}"
    role_attr_flags: LOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Mark the application roles as application logins
  community.postgresql.postgresql_membership:
    login_unix_socket: /var/run/postgresql
    login_db: postgres
    groups: ["{{ postgresql_app_group }}"]
    target_roles: ["{{ item.name }}"]
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the application databases
  community.postgresql.postgresql_db:
    login_unix_socket: /var/run/postgresql
    name: "{{ item.name }}"
    owner: "{{ item.name }}"
    encoding: UTF8
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps }}"
  loop_control:
    label: "{{ item.name }}"

- name: Close each application database to every other role
  community.postgresql.postgresql_privs:
    login_unix_socket: /var/run/postgresql
    login_db: "{{ item.name }}"
    type: database
    objs: "{{ item.name }}"
    privs: CONNECT,TEMPORARY
    roles: PUBLIC
    state: absent
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps }}"
  loop_control:
    label: "{{ item.name }}"

# Further databases of an application (the Arr tools: one for the data, one for the logs), owned by the same
# role and closed to every other one. pg_hba names each of them for that role (templates/patroni.yml.j2).
- name: Validate the further databases
  ansible.builtin.assert:
    that:
      - item.1 is match('^[a-z][a-z0-9_]{1,30}$')
      - item.1 not in ['postgres', 'template0', 'template1']
      - item.1 not in (postgresql_apps | map(attribute='name'))
    fail_msg: "Database {{ item.1 }} of {{ item.0.name }}: use a lowercase name that is not an application's own."
  loop: "{{ postgresql_apps | subelements('extra_databases', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Create the further databases of an application
  community.postgresql.postgresql_db:
    login_unix_socket: /var/run/postgresql
    name: "{{ item.1 }}"
    owner: "{{ item.0.name }}"
    encoding: UTF8
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps | subelements('extra_databases', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Close the further databases to every other role
  community.postgresql.postgresql_privs:
    login_unix_socket: /var/run/postgresql
    login_db: "{{ item.1 }}"
    type: database
    objs: "{{ item.1 }}"
    privs: CONNECT,TEMPORARY
    roles: PUBLIC
    state: absent
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps | subelements('extra_databases', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1 }}"

# Some applications expect helper roles to exist (Windmill: windmill_user, windmill_admin). They cannot log
# in and get no rights here beyond the one attribute asked for; the application role is made a member.
- name: Validate the helper roles
  ansible.builtin.assert:
    that:
      - item.1.name is match('^[a-z][a-z0-9_]{1,30}$')
      - item.1.name not in ['postgres', 'replicator', 'rewinder', postgresql_app_group]
      - item.1.name not in (postgresql_apps | map(attribute='name'))
    fail_msg: "Helper role {{ item.1.name }} of {{ item.0.name }}: use a lowercase name that is not a login role."
  loop: "{{ postgresql_apps | subelements('helper_roles', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.name }}"

- name: Create the helper roles an application expects
  community.postgresql.postgresql_user:
    login_unix_socket: /var/run/postgresql
    login_db: postgres
    name: "{{ item.1.name }}"
    role_attr_flags: "NOLOGIN,NOSUPERUSER,NOCREATEDB,NOCREATEROLE,NOREPLICATION,{{ 'BYPASSRLS' if item.1.bypass_rls | default(false) else 'NOBYPASSRLS' }}"
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps | subelements('helper_roles', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.name }}"

- name: Make each application a member of its helper roles
  community.postgresql.postgresql_membership:
    login_unix_socket: /var/run/postgresql
    login_db: postgres
    groups: ["{{ item.1.name }}"]
    target_roles: ["{{ item.0.name }}"]
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps | subelements('helper_roles', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }} in {{ item.1.name }}"

- name: Nest the helper roles as the application expects
  community.postgresql.postgresql_membership:
    login_unix_socket: /var/run/postgresql
    login_db: postgres
    groups: "{{ item.1.member_of }}"
    target_roles: ["{{ item.1.name }}"]
  become: true
  become_user: postgres
  loop: "{{ postgresql_apps | subelements('helper_roles', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.name }}"
  when: item.1.member_of is defined
