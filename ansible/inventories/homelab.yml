all:
  children:
    monitoring:
      hosts:
        deb13-monitoring:
          ansible_host: 192.168.0.28
          ansible_user: debian
          ansible_python_interpreter: /usr/bin/python3

    # OLD environment only (audit-linux.yml and deploy-node-exporter.yml target `proxmox`).
    # The new cluster (192.168.0.10/.11/.12/.16, docs/inventory/new-cluster.md) is deliberately
    # NOT in this legacy group; `pve-lab` here is the OLD host at 192.168.0.14, never the new .16.
    proxmox:
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519

      hosts:
        pve-lab:
          ansible_host: 192.168.0.14
