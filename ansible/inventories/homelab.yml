all:
  children:
    monitoring:
      hosts:
        deb13-monitoring:
          ansible_host: 192.168.0.28
          ansible_user: debian
          ansible_python_interpreter: /usr/bin/python3

    # pve-infra and pve-compute are permanently retired (2026-11-12). 192.168.0.10 now
    # belongs to the standalone pve-management host, which is deliberately NOT in this
    # legacy group: audit-linux.yml and deploy-node-exporter.yml target `proxmox`.
    proxmox:
      vars:
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519

      hosts:
        pve-core:
          ansible_host: 192.168.0.11

        pve-lab:
          ansible_host: 192.168.0.14
